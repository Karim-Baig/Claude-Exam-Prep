<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-P — Claude Certified Architect, Professional — Question Bank</title>
<style>
:root{
  --bg:#0f1115; --panel:#161a21; --panel2:#1c212a; --bd:#272e3a; --bd2:#333c4a;
  --tx:#e7eaf0; --mut:#98a2b6; --dim:#6c7688;
  --acc:#d97757; --acc2:#e08d70; --accbg:rgba(217,119,87,.13);
  --ok:#4ea87a; --okbg:rgba(78,168,122,.13);
  --bad:#d3596b; --badbg:rgba(211,89,107,.13);
  --warn:#c9a227;
  --r:10px; --sh:0 1px 3px rgba(0,0,0,.3);
}
[data-theme=light]{
  --bg:#faf9f7; --panel:#fff; --panel2:#f4f2ee; --bd:#e4e0d9; --bd2:#d3cec4;
  --tx:#1f1e1c; --mut:#6a6660; --dim:#918c84;
  --acc:#bf5a34; --acc2:#a94c28; --accbg:rgba(191,90,52,.09);
  --ok:#2f7d55; --okbg:rgba(47,125,85,.1);
  --bad:#b23a4d; --badbg:rgba(178,58,77,.09);
  --warn:#8a6d10;
  --sh:0 1px 3px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
code{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88em;
  background:var(--panel2);border:1px solid var(--bd);border-radius:4px;padding:.08em .38em;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{
  display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;flex:none;
  background:var(--panel);border-bottom:1px solid var(--bd);
}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:4px}
.brand b{font-size:14px;letter-spacing:.2px}
.brand span{font-size:11px;color:var(--dim)}
nav{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:9px;border:1px solid var(--bd)}
nav button{padding:6px 15px;border-radius:7px;font-size:13.5px;color:var(--mut);font-weight:500}
nav button.on{background:var(--acc);color:#fff}
nav button:not(.on):hover{color:var(--tx)}
.grow{flex:1}
.hbtn{
  padding:6px 11px;border:1px solid var(--bd);border-radius:8px;color:var(--mut);
  font-size:12.5px;background:var(--panel2);
}
.hbtn:hover{color:var(--tx);border-color:var(--bd2)}

main{display:flex;flex:1;min-height:0}

/* ---------- left rail : 10 things ---------- */
#rail{
  width:340px;flex:none;background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;min-height:0;transition:width .16s ease;
}
#rail.hid{width:0;overflow:hidden;border-right:none}
.railhd{padding:13px 14px 11px;border-bottom:1px solid var(--bd);flex:none}
.railhd h2{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--acc);font-weight:700}
.railhd p{font-size:11.5px;color:var(--dim);margin-top:3px}
.railhd select{
  width:100%;margin-top:10px;padding:7px 9px;background:var(--panel2);
  border:1px solid var(--bd);border-radius:7px;font-size:12.5px;
}
.railbody{overflow-y:auto;padding:9px;flex:1}
.tt{border:1px solid var(--bd);border-radius:9px;margin-bottom:7px;background:var(--panel2);overflow:hidden}
.tt>button{
  width:100%;display:flex;gap:9px;align-items:flex-start;padding:10px 11px;text-align:left;
}
.tt>button:hover{background:var(--bd)}
.tt .n{
  flex:none;width:19px;height:19px;border-radius:5px;background:var(--accbg);color:var(--acc);
  font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px;
}
.tt .t{font-size:13px;font-weight:600;line-height:1.4}
.tt.open .t{color:var(--acc)}
.ttb{padding:0 11px 11px 39px;font-size:12.5px;color:var(--mut);line-height:1.62;display:none}
.tt.open .ttb{display:block}
.ttb .nt{
  margin-top:9px;padding:8px 10px;background:var(--accbg);border-left:2px solid var(--acc);
  border-radius:0 6px 6px 0;color:var(--tx);font-size:12px;
}
.ttb .nt b{color:var(--acc);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:2px}

/* ---------- main column ---------- */
#col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 16px;flex:none;
  background:var(--panel);border-bottom:1px solid var(--bd);
}
.bar select,.bar input{
  padding:5px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:7px;font-size:12.5px;
}
.bar input{width:180px}
.chip{
  padding:5px 10px;border:1px solid var(--bd);border-radius:20px;font-size:12px;color:var(--mut);
  background:var(--panel2);
}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.count{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.scroll{overflow-y:auto;flex:1;padding:20px 16px 80px}
.wrap{max-width:850px;margin:0 auto}

/* ---------- question ---------- */
.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.tag{
  font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:600;
  padding:3px 8px;border-radius:5px;background:var(--panel2);border:1px solid var(--bd);color:var(--mut);
}
.tag.d-easy{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.tag.d-medium{color:var(--warn);border-color:var(--warn);background:rgba(201,162,39,.12)}
.tag.d-hard{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.tag.dom{color:var(--acc);border-color:var(--acc);background:var(--accbg)}
.qid{margin-left:auto;font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
.stem{font-size:16px;line-height:1.72;white-space:pre-wrap;margin-bottom:8px}
.topic{font-size:12px;color:var(--dim);margin-bottom:16px;font-style:italic}
.hint{
  display:inline-block;font-size:12px;color:var(--acc);background:var(--accbg);
  border:1px solid var(--acc);border-radius:6px;padding:3px 9px;margin-bottom:14px;font-weight:600;
}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;text-align:left;width:100%;
  border:1px solid var(--bd);border-radius:var(--r);background:var(--panel);transition:.11s;
}
.opt:hover:not(.lk){border-color:var(--acc);background:var(--panel2)}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt .k{
  flex:none;width:25px;height:25px;border-radius:6px;border:1px solid var(--bd2);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--mut);
}
.opt.sel .k{background:var(--acc);border-color:var(--acc);color:#fff}
.opt .x{flex:1;line-height:1.6;font-size:14.5px}
.opt.lk{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .mk{flex:none;font-size:15px;font-weight:700}
.opt.right .mk{color:var(--ok)}
.opt.wrong .mk{color:var(--bad)}

.acts{display:flex;gap:9px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.btn{padding:9px 20px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid transparent}
.btn.p{background:var(--acc);color:#fff}
.btn.p:hover{background:var(--acc2)}
.btn.p:disabled{opacity:.4;cursor:not-allowed}
.btn.s{border-color:var(--bd);color:var(--mut);background:var(--panel2)}
.btn.s:hover{color:var(--tx);border-color:var(--bd2)}
.btn.s.on{color:var(--acc);border-color:var(--acc);background:var(--accbg)}
.kbd{font-size:11px;color:var(--dim);margin-left:auto}
.kbd b{
  font-family:ui-monospace,monospace;background:var(--panel2);border:1px solid var(--bd);
  border-radius:4px;padding:1px 5px;color:var(--mut);font-weight:500;
}

/* ---------- explanation ---------- */
.exp{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--panel)}
.exp .hd{
  padding:11px 16px;font-size:13px;font-weight:700;letter-spacing:.3px;
  display:flex;align-items:center;gap:9px;
}
.exp.good .hd{background:var(--okbg);color:var(--ok);border-bottom:1px solid var(--ok)}
.exp.bad .hd{background:var(--badbg);color:var(--bad);border-bottom:1px solid var(--bad)}
.sec{padding:14px 16px;border-bottom:1px solid var(--bd)}
.sec:last-child{border-bottom:none}
.sec h4{
  font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);
  margin-bottom:7px;font-weight:700;
}
.sec p{font-size:14px;line-height:1.72;color:var(--tx)}
.dl{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--bd);font-size:13.5px;line-height:1.65}
.dl:last-child{border-bottom:none;padding-bottom:0}
.dl .k{
  flex:none;width:22px;height:22px;border-radius:5px;background:var(--badbg);color:var(--bad);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1px solid var(--bad);
}
.dl .k.nk{background:var(--panel2);color:var(--mut);border-color:var(--bd)}
.sec.cn{background:var(--accbg)}
.sec.cn h4{color:var(--acc)}
.sec.tp{background:var(--panel2)}
.sec.tp h4{color:var(--warn)}

/* ---------- flashcards ---------- */
.card{
  border:1px solid var(--bd);border-radius:14px;background:var(--panel);padding:40px 32px;
  min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;cursor:pointer;box-shadow:var(--sh);
}
.card .f{font-size:20px;line-height:1.6;font-weight:600;max-width:640px}
.card .b{font-size:15.5px;line-height:1.75;color:var(--tx);max-width:660px;text-align:left}
.card .hk{
  margin-top:18px;padding:11px 15px;background:var(--accbg);border-left:3px solid var(--acc);
  border-radius:0 8px 8px 0;font-size:13.5px;text-align:left;max-width:660px;line-height:1.65;
}
.flip{font-size:11.5px;color:var(--dim);margin-top:22px;letter-spacing:.4px}

/* ---------- progress ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:26px}
.stat{border:1px solid var(--bd);border-radius:11px;padding:15px;background:var(--panel);text-align:center}
.stat .v{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:.3px}
h3.sh{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:26px 0 12px;font-weight:700}
.row{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--bd);
  border-radius:9px;margin-bottom:7px;background:var(--panel);
}
.row .nm{flex:1;font-size:13.5px;min-width:0}
.row .nm small{display:block;color:var(--dim);font-size:11.5px;margin-top:1px}
.bar2{width:120px;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;flex:none}
.bar2 i{display:block;height:100%;border-radius:4px}
.pct{width:58px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.empty{text-align:center;padding:70px 20px;color:var(--dim)}
.empty h3{font-size:17px;color:var(--mut);margin-bottom:8px;font-weight:600}
.empty p{font-size:13.5px;max-width:420px;margin:0 auto;line-height:1.7}
@media(max-width:900px){#rail{position:absolute;z-index:20;height:calc(100vh - 54px);top:54px;box-shadow:0 0 40px rgba(0,0,0,.5)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>CCAR-P</b><span>Claude Certified Architect · Professional</span></div>
    <button class="hbtn" id="railtog" title="Toggle the 10 Things panel">&#9776; 10 Things</button>
    <nav>
      <button data-tab="practice" class="on">Practice</button>
      <button data-tab="cards">Flashcards</button>
      <button data-tab="prog">Progress</button>
    </nav>
    <div class="grow"></div>
    <button class="hbtn" id="theme">&#9788; Theme</button>
  </header>

  <main>
    <aside id="rail">
      <div class="railhd">
        <h2>10 Things to Know</h2>
        <p>Key concepts, what they mean, and how they are tested.</p>
        <select id="ttdom"></select>
      </div>
      <div class="railbody" id="ttbody"></div>
    </aside>

    <div id="col">
      <!-- practice -->
      <div id="t-practice" style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="bar">
          <select id="fdom"><option value="">All domains</option></select>
          <select id="fdif">
            <option value="">Any difficulty</option>
            <option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option>
          </select>
          <select id="ftyp">
            <option value="">Any type</option>
            <option value="single">Single answer</option>
            <option value="multi">Multi-select</option>
            <option value="next-step">Next step</option>
          </select>
          <button class="chip on" data-set="all">All</button>
          <button class="chip" data-set="unseen">Unseen</button>
          <button class="chip" data-set="missed">Missed</button>
          <button class="chip" data-set="marked">Bookmarked</button>
          <input id="fq" placeholder="Search stems…">
          <span class="count" id="cnt"></span>
        </div>
        <div class="scroll"><div class="wrap" id="qzone"></div></div>
      </div>

      <!-- flashcards -->
      <div id="t-cards" style="display:none;flex-direction:column;flex:1;min-height:0">
        <div class="bar">
          <select id="cdom"><option value="">All domains</option></select>
          <button class="chip" id="cshuf">Shuffle</button>
          <span class="count" id="ccnt"></span>
        </div>
        <div class="scroll"><div class="wrap" id="czone"></div></div>
      </div>

      <!-- progress -->
      <div id="t-prog" style="display:none;flex-direction:column;flex:1;min-height:0">
        <div class="bar">
          <button class="chip" id="reset">Reset all progress</button>
          <span class="count" id="pcnt"></span>
        </div>
        <div class="scroll"><div class="wrap" id="pzone"></div></div>
      </div>
    </div>
  </main>
</div>

<script>
const QUESTIONS = @@QUESTIONS@@;
const FLASHCARDS = @@FLASHCARDS@@;
const TENTHINGS = @@TENTHINGS@@;
const META = @@META@@;

/* ================= storage ================= */
const KEY='ccarp.v1';
const D={ans:{},mark:{},card:{},theme:'dark'};
let S=Object.assign({},D);
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign({},D,JSON.parse(r));}catch(e){}
// Written straight through, not debounced: saves happen once per answer, bookmark or
// theme flip, and a debounce would silently lose the last answer if the tab is closed
// within the window.
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ================= util ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(s){
  const code=[]; let t=esc(s);
  t=t.replace(/`([^`]+)`/g,(m,c)=>{code.push(c);return '@@C'+(code.length-1)+'@@'});
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/@@C(\d+)@@/g,(m,i)=>'<code>'+code[+i]+'</code>');
  return t.replace(/\n/g,'<br>');
}
const eq=(a,b)=>a.length===b.length&&[...a].sort().join()===[...b].sort().join();

/* ================= 10 things rail ================= */
let ttDom=Object.keys(TENTHINGS)[0];
function drawTT(){
  $('#ttbody').innerHTML=(TENTHINGS[ttDom]||[]).map((t,i)=>
    '<div class="tt" data-i="'+i+'"><button><span class="n">'+(i+1)+'</span><span class="t">'+esc(t.title)+'</span></button>'+
    '<div class="ttb">'+md(t.desc)+'<div class="nt"><b>Note</b>'+md(t.note)+'</div></div></div>').join('');
}
$('#ttdom').innerHTML=Object.keys(TENTHINGS).map(d=>'<option>'+esc(d)+'</option>').join('');
$('#ttdom').onchange=e=>{ttDom=e.target.value;drawTT()};
$('#ttbody').onclick=e=>{const c=e.target.closest('.tt'); if(c)c.classList.toggle('open')};
$('#railtog').onclick=()=>$('#rail').classList.toggle('hid');
drawTT();

/* ================= filters ================= */
const DOMS=[...new Set(QUESTIONS.map(q=>q.domain))].sort();
$('#fdom').innerHTML+=DOMS.map(d=>'<option>'+esc(d)+'</option>').join('');
$('#cdom').innerHTML+=[...new Set(FLASHCARDS.map(c=>c.domain))].sort().map(d=>'<option>'+esc(d)+'</option>').join('');
let F={dom:'',dif:'',typ:'',set:'all',q:''};
function pool(){
  const s=F.q.toLowerCase();
  return QUESTIONS.filter(q=>{
    if(F.dom&&q.domain!==F.dom)return 0;
    if(F.dif&&q.difficulty!==F.dif)return 0;
    if(F.typ&&q.type!==F.typ)return 0;
    if(F.set==='unseen'&&S.ans[q.id])return 0;
    if(F.set==='missed'&&!(S.ans[q.id]&&!S.ans[q.id].ok))return 0;
    if(F.set==='marked'&&!S.mark[q.id])return 0;
    if(s&&!(q.stem+' '+q.topic).toLowerCase().includes(s))return 0;
    return 1;
  });
}
['fdom','fdif','ftyp'].forEach(id=>$('#'+id).onchange=e=>{F[id.slice(1)]=e.target.value;idx=0;draw()});
$('#fq').oninput=e=>{F.q=e.target.value;idx=0;draw()};
$$('[data-set]').forEach(b=>b.onclick=()=>{
  $$('[data-set]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  F.set=b.dataset.set;idx=0;draw();
});

/* ================= practice ================= */
let idx=0, pick=[], shown=false;
function draw(){
  const P=pool();
  $('#cnt').textContent=P.length?((idx+1)+' of '+P.length.toLocaleString()):'0 questions';
  if(!P.length){
    $('#qzone').innerHTML='<div class="empty"><h3>Nothing matches these filters</h3>'+
      '<p>Try widening the domain or difficulty, or switch the set back to <strong>All</strong>.</p></div>';
    return;
  }
  if(idx>=P.length)idx=0; if(idx<0)idx=P.length-1;
  const q=P[idx], rec=S.ans[q.id], multi=q.correct.length>1;
  if(!shown&&rec){pick=rec.pick||[];shown=true}
  const lk=shown?' lk':'';
  let h='<div class="meta"><span class="tag dom">'+esc(q.domain)+'</span>'+
        '<span class="tag d-'+q.difficulty+'">'+q.difficulty+'</span>'+
        '<span class="tag">'+(q.type==='next-step'?'next step':q.type)+'</span>'+
        (S.mark[q.id]?'<span class="tag" style="color:var(--acc)">&#9733; saved</span>':'')+
        '<span class="qid">'+esc(q.id)+'</span></div>';
  h+='<div class="stem">'+md(q.stem)+'</div>';
  if(q.topic)h+='<div class="topic">'+esc(q.topic)+'</div>';
  if(multi)h+='<div class="hint">Choose '+(q.correct.length===2?'TWO':'THREE')+'</div>';
  h+='<div class="opts">';
  for(const o of q.options){
    const sel=pick.includes(o.key), cor=q.correct.includes(o.key);
    let cl='opt'+lk, mk='';
    if(shown){ if(cor){cl+=' right';mk='&#10003;'} else if(sel){cl+=' wrong';mk='&#10007;'} }
    else if(sel) cl+=' sel';
    h+='<button class="'+cl+'" data-k="'+o.key+'"><span class="k">'+o.key+'</span>'+
       '<span class="x">'+md(o.text)+'</span>'+(mk?'<span class="mk">'+mk+'</span>':'')+'</button>';
  }
  h+='</div><div class="acts">';
  h+=shown?'<button class="btn p" id="next">Next question &rarr;</button>'
          :'<button class="btn p" id="sub"'+(pick.length?'':' disabled')+'>Check answer</button>';
  h+='<button class="btn s'+(S.mark[q.id]?' on':'')+'" id="bm">'+(S.mark[q.id]?'&#9733; Saved':'&#9734; Save')+'</button>';
  h+='<button class="btn s" id="prev">&larr; Previous</button>';
  h+='<span class="kbd"><b>A</b>–<b>E</b> pick &nbsp; <b>Enter</b> check &nbsp; <b>&rarr;</b> next &nbsp; <b>S</b> save</span></div>';

  if(shown){
    const ok=eq(pick,q.correct), e=q.explanation||{};
    h+='<div class="exp '+(ok?'good':'bad')+'"><div class="hd">'+
       (ok?'&#10003; Correct':'&#10007; Not quite')+' &middot; answer '+q.correct.join(' + ')+'</div>';
    if(e.correct)h+='<div class="sec"><h4>Why this is right</h4><p>'+md(e.correct)+'</p></div>';
    const d=e.distractors||{};
    if(Object.keys(d).length){
      h+='<div class="sec"><h4>Why the others fail</h4>';
      for(const o of q.options){
        if(!d[o.key])continue;
        h+='<div class="dl"><span class="k'+(pick.includes(o.key)?'':' nk')+'">'+o.key+'</span><span>'+md(d[o.key])+'</span></div>';
      }
      h+='</div>';
    }
    if(e.concept)h+='<div class="sec cn"><h4>Concept to lock in</h4><p>'+md(e.concept)+'</p></div>';
    if(e.tip)h+='<div class="sec tp"><h4>Exam tip</h4><p>'+md(e.tip)+'</p></div>';
    h+='</div>';
  }
  $('#qzone').innerHTML=h;

  $$('#qzone .opt').forEach(b=>b.onclick=()=>{
    if(shown)return;
    const k=b.dataset.k;
    if(multi){ pick.includes(k)?pick.splice(pick.indexOf(k),1):(pick.length<q.correct.length&&pick.push(k)); }
    else pick=[k];
    draw();
  });
  const sub=$('#sub'); if(sub)sub.onclick=submit;
  const nx=$('#next'); if(nx)nx.onclick=next;
  $('#prev').onclick=()=>{idx--;pick=[];shown=false;draw()};
  $('#bm').onclick=()=>{S.mark[q.id]?delete S.mark[q.id]:S.mark[q.id]=1;save();draw()};
}
function submit(){
  const P=pool(); if(!P.length||!pick.length)return;
  const q=P[idx];
  S.ans[q.id]={ok:eq(pick,q.correct),pick:pick.slice(),t:Date.now()};
  shown=true;save();draw();
  $('.scroll').scrollTo({top:$('.exp')?$('.exp').offsetTop-60:0,behavior:'smooth'});
}
function next(){idx++;pick=[];shown=false;draw();$('.scroll').scrollTop=0}

/* ================= flashcards ================= */
let ci=0, face=0, order=null;
function cpool(){
  const d=$('#cdom').value, L=FLASHCARDS.filter(c=>!d||c.domain===d);
  return order? order.map(i=>L[i]).filter(Boolean) : L;
}
function drawC(){
  const L=cpool();
  $('#ccnt').textContent=L.length?((ci+1)+' of '+L.length):'0 cards';
  if(!L.length){$('#czone').innerHTML='<div class="empty"><h3>No cards in this domain</h3></div>';return}
  if(ci>=L.length)ci=0; if(ci<0)ci=L.length-1;
  const c=L[ci];
  let h='<div class="meta"><span class="tag dom">'+esc(c.domain)+'</span>'+
        (c.difficulty?'<span class="tag d-'+c.difficulty+'">'+c.difficulty+'</span>':'')+
        '<span class="qid">'+esc(c.id||'')+'</span></div><div class="card" id="cd">';
  h+= face? '<div class="b">'+md(c.back)+(c.hook?'<div class="hk">'+md(c.hook)+'</div>':'')+'</div>'
          : '<div class="f">'+md(c.front)+'</div>';
  h+='<div class="flip">'+(face?'click to flip back':'click to reveal')+'</div></div>';
  h+='<div class="acts" style="margin-top:16px"><button class="btn s" id="cp">&larr; Previous</button>'+
     '<button class="btn p" id="cn">Next card &rarr;</button>'+
     '<span class="kbd"><b>Space</b> flip &nbsp; <b>&rarr;</b> next</span></div>';
  $('#czone').innerHTML=h;
  $('#cd').onclick=()=>{face=!face;drawC()};
  $('#cn').onclick=()=>{ci++;face=0;drawC()};
  $('#cp').onclick=()=>{ci--;face=0;drawC()};
}
$('#cdom').onchange=()=>{ci=0;face=0;order=null;drawC()};
$('#cshuf').onclick=()=>{
  const n=cpool().length; order=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]]}
  ci=0;face=0;drawC();
};

/* ================= progress ================= */
function drawP(){
  const ids=Object.keys(S.ans), n=ids.length;
  const ok=ids.filter(i=>S.ans[i].ok).length;
  const pctc=v=>v>=80?'var(--ok)':v>=60?'var(--warn)':'var(--bad)';
  let h='<div class="grid">'+
    '<div class="stat"><div class="v">'+n.toLocaleString()+'</div><div class="l">Answered</div></div>'+
    '<div class="stat"><div class="v" style="color:'+(n?pctc(100*ok/n):'var(--mut)')+'">'+(n?Math.round(100*ok/n):0)+'%</div><div class="l">Accuracy</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--bad)">'+(n-ok)+'</div><div class="l">Missed</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--acc)">'+Object.keys(S.mark).length+'</div><div class="l">Bookmarked</div></div>'+
    '<div class="stat"><div class="v">'+Math.round(100*n/QUESTIONS.length)+'%</div><div class="l">Bank covered</div></div>'+
    '</div>';
  $('#pcnt').textContent=n.toLocaleString()+' of '+QUESTIONS.length.toLocaleString()+' seen';

  if(!n){
    h+='<div class="empty"><h3>No attempts yet</h3><p>Answer some questions in Practice and this page will '+
       'show your accuracy per domain, plus the weakest topics to drill.</p></div>';
    $('#pzone').innerHTML=h;return;
  }

  const agg=(keyf)=>{
    const m={};
    for(const id of ids){
      const q=QUESTIONS.find(x=>x.id===id); if(!q)continue;
      const k=keyf(q); if(!k)continue;
      (m[k]=m[k]||{n:0,ok:0}).n++; if(S.ans[id].ok)m[k].ok++;
    }
    return m;
  };
  const bar=(label,sub,o)=>{
    const p=Math.round(100*o.ok/o.n);
    return '<div class="row"><div class="nm">'+esc(label)+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+
      '<div class="bar2"><i style="width:'+p+'%;background:'+pctc(p)+'"></i></div>'+
      '<div class="pct" style="color:'+pctc(p)+'">'+p+'%</div>'+
      '<div style="width:56px;text-align:right;font-size:11.5px;color:var(--dim)">'+o.ok+'/'+o.n+'</div></div>';
  };

  const byDom=agg(q=>q.domain);
  h+='<h3 class="sh">By domain</h3>';
  h+=DOMS.filter(d=>byDom[d]).sort((a,b)=>byDom[a].ok/byDom[a].n-byDom[b].ok/byDom[b].n)
      .map(d=>bar(d,(META.weights&&META.weights[d]?META.weights[d]+'% of the exam':''),byDom[d])).join('');

  const byDif=agg(q=>q.difficulty);
  h+='<h3 class="sh">By difficulty</h3>';
  h+=['easy','medium','hard'].filter(d=>byDif[d]).map(d=>bar(d,'',byDif[d])).join('');

  const byTyp=agg(q=>q.type);
  h+='<h3 class="sh">By question type</h3>';
  h+=Object.keys(byTyp).map(t=>bar(t==='next-step'?'next step':t,'',byTyp[t])).join('');

  const byTop=agg(q=>q.topic);
  const weak=Object.entries(byTop).filter(([,o])=>o.n>=2&&o.ok/o.n<.7)
    .sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).slice(0,18);
  if(weak.length){
    h+='<h3 class="sh">Weakest topics &mdash; drill these</h3>';
    h+=weak.map(([t,o])=>bar(t,'',o)).join('');
  }
  $('#pzone').innerHTML=h;
}
$('#reset').onclick=()=>{
  if(!confirm('Erase all answers, bookmarks and progress? This cannot be undone.'))return;
  S=Object.assign({},D,{theme:S.theme});
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  idx=0;pick=[];shown=false;draw();drawP();
};

/* ================= tabs, theme, keys ================= */
let tab='practice';
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  tab=b.dataset.tab;
  $('#t-practice').style.display=tab==='practice'?'flex':'none';
  $('#t-cards').style.display=tab==='cards'?'flex':'none';
  $('#t-prog').style.display=tab==='prog'?'flex':'none';
  if(tab==='cards')drawC(); if(tab==='prog')drawP();
});
function theme(t){document.documentElement.dataset.theme=t;S.theme=t;save()}
theme(S.theme||'dark');
$('#theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');

document.addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(tab==='cards'){
    if(e.key===' '){e.preventDefault();face=!face;drawC()}
    else if(e.key==='ArrowRight'){ci++;face=0;drawC()}
    else if(e.key==='ArrowLeft'){ci--;face=0;drawC()}
    return;
  }
  if(tab!=='practice')return;
  const k=e.key.toUpperCase();
  if(/^[A-E]$/.test(k)&&!shown){const b=document.querySelector('#qzone .opt[data-k="'+k+'"]');if(b){e.preventDefault();b.click()}}
  else if(e.key==='Enter'){e.preventDefault();shown?next():submit()}
  else if(e.key==='ArrowRight'){e.preventDefault();shown?next():(idx++,pick=[],draw())}
  else if(e.key==='ArrowLeft'){e.preventDefault();idx--;pick=[];shown=false;draw()}
  else if(k==='S'){const b=$('#bm');if(b)b.click()}
});

draw();
</script>
</body>
</html>
