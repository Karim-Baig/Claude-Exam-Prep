<title>Claude Certified Developer – Foundations (CCDV-F) · Question Bank</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0a0a12;--bg2:#11111f;--card:#16162a;--card2:#1c1c34;--line:#2a2a46;

header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;

.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--tx3);letter-spacing:.04em}
nav{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:9px;border:1px solid var(--line)}

nav button:hover{color:var(--tx)}
nav button.on{background:var(--pri);color:#fff}
.spacer{flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font:600 12px/1.2 inherit;color:var(--tx2);white-space:nowrap}
.chip b{color:var(--tx)}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--tx2);width:33px;height:33px;
border-radius:8px;cursor:pointer;font-size:14px;display:grid;place-items:center}
.iconbtn:hover{color:var(--tx);border-color:var(--pri)}
/* ---------- layout ---------- */
main{display:grid;grid-template-columns:250px 1fr;gap:20px;max-width:1400px;margin:0 auto;padding:20px 18px 70px}

label.fl{display:block;font-size:11px;color:var(--tx2);margin:9px 0 4px;font-weight:600}
label.fl:first-of-type{margin-top:0}
select,input[type=text]{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--line);
border-radius:7px;padding:8px 9px;font:13px inherit;cursor:pointer}
select:focus,input:focus{outline:0;border-color:var(--pri)}
.btn{display:block;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);
border-radius:7px;padding:9px;font:600 12.5px inherit;cursor:pointer;margin-top:7px;text-align:left}

.tag{font:700 10.5px/1 inherit;padding:5px 9px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase}
.tag.dom{background:var(--priS);color:var(--pri2);border:1px solid #8b5cf640}

color:var(--tx3);border-bottom:1px solid var(--line)}

.mini{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;min-width:80px}

.pill{font:700 11px inherit;padding:3px 9px;border-radius:20px;white-space:nowrap}

h2.sec{font-size:16px;font-weight:700;margin:24px 0 12px;display:flex;align-items:center;gap:9px}
h2.sec:first-child{margin-top:0}

.bmlist{display:flex;flex-direction:column;gap:8px}

cursor:pointer;font-size:13.5px;display:flex;gap:11px;align-items:flex-start}
.bmrow:hover{border-color:var(--pri)}

/* ---------- exam banner ---------- */
.exambar{background:linear-gradient(135deg,#8b5cf618,#6366f118);border:1px solid #8b5cf640;
border-radius:var(--r);padding:12px 15px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}

<script>const QB=[];</script>
<script>
/* ===== D1 · Applications & Integration — API mechanics, stop_reason, errors ===== */
QB.push(
{id:1,d:"D1",s:"Claude API Mechanics",t:"S",f:"M",
q:"A developer's call to the Claude API returns `401 authentication_error`. Their request includes:\n```\nContent-Type: application/json\nAuthorization: Bearer sk-ant-api03-<revoked-key>\nanthropic-version: 2023-06-01\n```\nWhat is the most likely cause?",
o:["A. The header must be `x-api-key`; `Authorization` is not accepted","B. The key itself is malformed, revoked, or expired — both `Authorization: Bearer <key>` and the legacy `x-api-key` are accepted credential headers","C. `anthropic-version` must come before the auth header","D. Bearer tokens require the `anthropic-beta` header to be set"],a:1,
e:"Anthropic accepts **two** credential headers: **`Authorization: Bearer <token>`** (an API key or a short-lived access token) and the **legacy-but-still-supported `x-api-key: <key>`**. Because both are valid, a 401 `authentication_error` points at the **credential**, not the header name — the documented causes are a malformed, revoked, or expired key. Worth knowing for real work: `x-api-key` is what every official SDK and nearly all docs examples send by default.",
w:"A — false, and a stale piece of folk wisdom: `Authorization: Bearer` is documented as the primary auth header, with `x-api-key` as the legacy fallback. C — HTTP headers are unordered; order never affects auth. D — `anthropic-beta` opts into beta features and has nothing to do with authentication."},

{id:2,d:"D1",s:"Claude API Mechanics",t:"R",f:"M",
q:"Which headers must be present on a Claude Messages API request?",
o:["A. A credential header, `anthropic-version`, and `content-type: application/json`","B. `x-api-key` only","C. `authorization`, `anthropic-version`, and `anthropic-beta`","D. `x-api-key`, `anthropic-version`, and `request-id`"],a:0,
e:"Three things must be present: a **credential header**, **`anthropic-version`** (the API version you coded against, e.g. `2023-06-01`), and **`content-type: application/json`**. For the credential the API accepts either **`Authorization: Bearer <token>`** or the legacy **`x-api-key: <key>`** — one or the other, not both required. The version header is what lets Anthropic evolve the API without breaking your integration.",
w:"B — omitting `anthropic-version` and `content-type` is an error. C — `anthropic-beta` is only for opting into beta features; it is not required. D — the request identifier is returned **by** the API on responses (header `request-id`); you never send it."},

{id:3,d:"D1",s:"Claude API Mechanics",t:"R",f:"E",
q:"What is the endpoint and HTTP method for a standard (non-batch) Claude completion?",
o:["A. `GET https://api.anthropic.com/v1/complete`","B. `POST https://api.anthropic.com/v1/chat/completions`","C. `POST https://api.anthropic.com/v1/messages`","D. `POST https://api.anthropic.com/v1/models/generate`"],a:2,
e:"**`POST https://api.anthropic.com/v1/messages`** is the Messages API — the single endpoint for standard, streaming, tool-using, and multimodal requests. Streaming is not a different URL; it is the same endpoint with `\"stream\": true` in the body.",
w:"A — `/v1/complete` was the legacy Text Completions API, now deprecated in favour of Messages, and it was never a GET. B — that is OpenAI's path. D — not an Anthropic route."},

{id:4,d:"D1",s:"Claude API Mechanics",t:"R",f:"E",
q:"Which three fields are required in the body of a Messages API request?",
o:["A. `model`, `messages`, `temperature`","B. `model`, `max_tokens`, `messages`","C. `model`, `system`, `messages`","D. `model`, `messages`, `stop_reason`"],a:1,
e:"**`model`**, **`max_tokens`**, and **`messages`** are required. `max_tokens` catching people out is deliberate — unlike several other providers, Anthropic makes the output cap explicit rather than defaulting it, so a request without it fails with a `400 invalid_request_error`.",
w:"A/C — `temperature` and `system` are both optional. D — `stop_reason` is a *response* field the model sets; you never send it."},

{id:5,d:"D1",s:"Claude API Mechanics",t:"S",f:"M",
q:"A developer tries to set Claude's persona by adding this as the **first** element of the `messages` array:\n```\n{\"role\": \"system\", \"content\": \"You are a terse SQL expert.\"}\n```\nThe request fails validation. Why?",
o:["A. System messages must be the last element of `messages`","B. The content must be an array of content blocks, not a string","C. A `system` entry can never be the first element of `messages`; instructions that apply from turn one go in the top-level `system` parameter","D. Persona instructions must be sent via the `metadata` field"],a:2,
e:"The system prompt is a **top-level sibling of `messages`**:\n```\n{\n  \"model\": \"...\",\n  \"max_tokens\": 1024,\n  \"system\": \"You are a terse SQL expert.\",\n  \"messages\": [{\"role\":\"user\",\"content\":\"...\"}]\n}\n```\nA current nuance worth knowing: on some newer models a `{\"role\": \"system\"}` entry **is** accepted **mid-conversation** as a cache-preserving way to inject a new operator instruction later in a session — but it must follow a user turn and **can never be `messages[0]`**. The top-level `system` parameter remains the only way to set instructions that apply from the very first turn, on every model.",
w:"A — placement after a user turn is what is permitted where the feature exists; 'last element' is not the rule. B — string content is perfectly valid for a message. D — `metadata` carries request metadata such as `user_id`, not instructions."},

{id:6,d:"D1",s:"Claude API Mechanics",t:"R",f:"M",
q:"Tool results are returned to Claude using which structure?",
o:["A. A message with `\"role\": \"tool\"`","B. A `tool_result` content block inside a `user` message","C. A `function_response` top-level request parameter","D. A `tool_result` block inside an `assistant` message"],a:1,
e:"Tool output does **not** get its own role. You append a **`user`** message whose `content` array holds one **`tool_result`** block per outstanding `tool_use` id. This collapsing of tool output into the user turn is a distinctive Anthropic design and a common source of integration bugs. On roles generally: `user` and `assistant` are valid everywhere, and on some newer models a `{\"role\":\"system\"}` entry is additionally accepted **mid-conversation** (never as `messages[0]`).",
w:"A — there is no `tool` role in the Messages API. C — no such parameter; `function_response` is other providers' terminology. D — the `assistant` turn holds the `tool_use` blocks; results are something **you** send, so they go in a `user` message."},

{id:7,d:"D1",s:"Claude API Mechanics",t:"R",f:"M",
q:"Which set contains **only** valid `stop_reason` values on a Messages API response?",
o:["A. `complete`, `truncated`, `filtered`, `tool_call`","B. `end_turn`, `max_tokens`, `stop_sequence`, `tool_use`","C. `finished`, `length`, `stop`, `function_call`","D. `done`, `token_limit`, `user_stop`, `tool_result`"],a:1,
e:"**`end_turn`** — finished naturally. **`max_tokens`** — output hit your cap and was cut off. **`stop_sequence`** — one of your `stop_sequences` was produced. **`tool_use`** — the model wants a tool executed. These four are the ones you handle in every integration, but **the enum is larger and still growing**: current docs also define **`pause_turn`** (a server-tool loop hit its iteration limit — send the assistant content back to continue), **`refusal`** (Claude declined; read `stop_details` and consider a fallback model), and **`model_context_window_exceeded`** (generation filled the context window; treat the response as truncated). Always code a **default branch** for unknown values.",
w:"A, C, and D mix in terminology from other providers (`length`, `stop`, `function_call`) or invent values. Note `end_turn` — not `stop` or `complete`."},

{id:8,d:"D1",s:"Claude API Mechanics",t:"S",f:"M",
q:"A summarisation service returns responses that consistently end mid-sentence. `stop_reason` is `max_tokens`. What is the correct fix?",
o:["A. Lower `temperature` so the model is less verbose","B. Add a `stop_sequence` at the end of the desired output","C. Raise `max_tokens`, and/or instruct the model to be more concise","D. Retry the request — `max_tokens` indicates a transient truncation"],a:2,
e:"`stop_reason: \"max_tokens\"` means generation was **hard-cut when it hit your output cap** — the response is genuinely incomplete, not a formatting quirk. Two levers fix it: raise `max_tokens` to accommodate the real output length, and/or constrain the requested output in the prompt (\"summarise in under 150 words\"). Robust clients also *detect* this value and handle the partial output explicitly rather than treating it as a finished answer.",
w:"A — temperature controls randomness, not length. B — a stop sequence would truncate output *earlier*, worsening it. D — it is fully deterministic given the same cap, so retrying reproduces it."},

{id:9,d:"D1",s:"Claude API Mechanics",t:"S",f:"H",
q:"An agent loop calls Claude with tools. It ends the conversation whenever `content` contains any text block. Users report the agent \"answers then abandons the task.\" What is the design error?",
o:["A. It should terminate on `stop_reason == \"end_turn\"`, since `tool_use` responses can also contain text blocks","B. Text and tool_use blocks are mutually exclusive, so the bug must be elsewhere","C. It should check whether `content` has more than one block","D. It should call the API again with `tool_choice: \"none\"` to force a final answer"],a:0,
e:"A single assistant turn can contain **both** a `text` block (Claude narrating its intent, e.g. \"Let me look that up.\") **and** a `tool_use` block. Presence of text therefore proves nothing about completion. **Branch on `stop_reason`, never on content shape.** `tool_use` means execute the tool and continue the loop; `end_turn` is the normal completion signal; and a production loop needs explicit branches for the rest too — `max_tokens` (truncated), `refusal` (declined; read `stop_details`), `pause_turn` (return the assistant content to continue a server-tool loop), and `model_context_window_exceeded` — plus a default branch, since the enum can grow.",
w:"B — they explicitly co-occur; that is the whole bug. C — block count is an unreliable proxy; a lone `tool_use` block would be misread as complete. D — `tool_choice: \"none\"` suppresses tools entirely and would abandon the pending tool call."},

{id:10,d:"D1",s:"Claude API Mechanics",t:"R",f:"M",
q:"Which `stop_reason` indicates the model is pausing and expects you to execute something and reply?",
o:["A. `end_turn`","B. `pause_turn`","C. `tool_use`","D. `stop_sequence`"],a:2,
e:"**`tool_use`**. The assistant turn contains one or more `tool_use` blocks (each with an `id`, `name`, and `input`); your application runs the corresponding function and appends a `user` message containing matching `tool_result` blocks. The conversation is mid-turn until you do — this request/execute/return cycle is the foundation of every Claude agent.",
w:"A — the natural completion signal. B — `pause_turn` relates to long-running server-side tool operations, not the standard client-side tool cycle. D — means one of your configured stop sequences was emitted."},

{id:11,d:"D1",s:"Claude API Mechanics",t:"R",f:"M",
q:"In the response `usage` object, which fields report token consumption?",
o:["A. `prompt_tokens` and `completion_tokens`","B. `input_tokens` and `output_tokens`","C. `tokens_in` and `tokens_out`","D. `total_tokens` only"],a:1,
e:"Anthropic reports **`input_tokens`** and **`output_tokens`**. When prompt caching is active, `usage` additionally carries **`cache_creation_input_tokens`** (written to cache) and **`cache_read_input_tokens`** (served from cache) — the two fields you monitor to prove caching is actually working.",
w:"A — `prompt_tokens`/`completion_tokens` is OpenAI's naming. C — invented. D — no aggregate-only field; you sum them yourself."},

{id:12,d:"D1",s:"Claude API Mechanics",t:"S",f:"M",
q:"A team needs to know the token cost of a large prompt **before** spending money generating a response. What should they use?",
o:["A. Send the request with `max_tokens: 1` and read `usage.input_tokens`","B. `POST /v1/messages/count_tokens`","C. Divide the character count by four","D. Call `/v1/models` with the prompt attached"],a:1,
e:"The **`/v1/messages/count_tokens`** endpoint accepts the same shape as a Messages request — `model`, `messages`, `system`, `tools`, images — and returns `input_tokens` without generating output. It is **free** and rate-limited separately from message creation, making it the right tool for pre-flight budget checks and for validating that a payload fits the context window. Two precision points: the count is documented as an **estimate** that can differ from billed tokens by a small amount, and it is **tokenizer-specific**, so always count against the same `model` you intend to call.",
w:"A — works but wastes a paid call and still generates a token. C — the chars-per-token rule is a rough heuristic that varies by tokenizer and is badly wrong for code, JSON, and non-English text. D — `/v1/models` lists available models and takes no prompt."},

{id:13,d:"D1",s:"Claude API Mechanics",t:"S",f:"H",
q:"A request bundles a 9,000-token system prompt, 185,000 tokens of chat history, and a 14,000-token user message against a 200K-context model. What happens, and what is the right structural fix?",
o:["A. Succeeds — only `messages` counts toward the context window","B. Succeeds — the system prompt is stored separately from context","C. Fails: ~208K exceeds the window. Compact history via summarisation or retrieval","D. Fails: each individual message must stay under 100K tokens"],a:2,
e:"Everything you send shares one budget: **system prompt + all messages + tool definitions + images**, and here that totals ~208,000 against a 200K limit. Output tokens are additional on top. Real fixes are structural, not cosmetic: summarise older turns into a compact digest, apply a sliding window over recent turns, or move the bulk into a retrieval layer and inject only relevant passages.",
w:"A/B — the system prompt and tool schemas absolutely consume context. D — there is no per-message cap; the constraint is the aggregate."},

{id:14,d:"D1",s:"Claude API Mechanics",t:"R",f:"M",
q:"Which content block types can appear in an assistant response?",
o:["A. `text` and `tool_use` (plus `thinking` when extended thinking is enabled)","B. `text` only","C. `text`, `image`, and `tool_result`","D. `message`, `delta`, and `usage`"],a:0,
e:"Assistant turns carry **`text`** and **`tool_use`** blocks, plus **`thinking`** (and `redacted_thinking`) when thinking is enabled. The asymmetry to remember concerns **`image`**: image blocks are only ever something *you* send in a `user` message, because Claude does not generate images. Do not over-generalise that to tool results, though — when **server tools** are enabled the assistant turn also contains result blocks the API produced itself (`server_tool_use`, `web_search_tool_result`, and similar). What Claude never emits is a **`tool_result` block for one of *your* client-side tools** — those you supply in a `user` message.",
w:"B — ignores tool use. C — `image` is input-only, and a `tool_result` for a client-side tool is something you send. D — those are streaming event names, not content blocks."},

{id:15,d:"D1",s:"Error Handling & Retries",t:"R",f:"M",
q:"What does HTTP **529** from the Claude API mean?",
o:["A. Your organisation's rate limit was exceeded","B. Anthropic's API is temporarily overloaded","C. The request payload was too large","D. Your credit balance is exhausted"],a:1,
e:"**529 `overloaded_error`** means Anthropic's service is temporarily saturated — a condition on *their* side, unrelated to your quota. It is retryable: back off exponentially with jitter and try again. Distinguishing 529 from **429 `rate_limit_error`** (you exceeded *your* limit) matters, because 429 responses carry a `retry-after` header you should honour, while 529 needs your own backoff schedule.",
w:"A — that is 429. C — that is 413 `request_too_large`. D — billing and spend problems have their own codes: **402 `billing_error`** for payment-information issues, **400** when you hit an org/workspace spend limit you set, and **429** at a usage-tier monthly spend cap. None of them is 529."},

{id:16,d:"D1",s:"Error Handling & Retries",t:"S",f:"M",
q:"A nightly job fires thousands of concurrent requests and takes a wave of 429s. Every worker retries after exactly 2 seconds. Throughput stays terrible. What is the flaw?",
o:["A. 429 is non-retryable, so the retries are wasted","B. Fixed-delay retries resynchronise all workers into repeating thundering herds","C. The retry delay is too short; it should be a fixed 60 seconds","D. Concurrent requests are unsupported; the job must be serial"],a:1,
e:"A constant delay makes every throttled worker retry **at the same instant**, reproducing the identical spike that caused the throttling — a thundering herd. The fix is **exponential backoff with random jitter**: delay ≈ base × 2^attempt, plus a random offset, so retries spread out instead of re-colliding. Honour the **`retry-after`** header when present, cap total attempts, and rate-limit client-side rather than discovering the ceiling by hitting it.",
w:"A — 429 is the canonical retryable error. C — a long fixed delay still synchronises and needlessly destroys throughput. D — concurrency is fine and necessary; it just needs pacing."},

{id:17,d:"D1",s:"Error Handling & Retries",t:"R",f:"M",
q:"Which status codes generally warrant an automatic retry, versus a code fix?",
o:["A. Retry 429/500/529; fix 400/401/403/404","B. Retry everything with enough attempts","C. Retry 400 and 401; fix 429 and 500","D. Never retry; surface all errors to the user"],a:0,
e:"**Retry transient, server-side or throttling failures: 429 (rate limit), 500 (`api_error`), 529 (overloaded)** — with exponential backoff and jitter. **Do not retry deterministic client errors: 400 (malformed request), 401 (bad key), 403 (no permission), 404 (wrong endpoint/model)** — these fail identically every time, so retrying just burns quota and hides the real defect.",
w:"B — retrying a 401 forever never succeeds. C — inverted: 400/401 are exactly the non-retryable ones. D — abandons resilience against normal transient conditions."},

{id:18,d:"D1",s:"Error Handling & Retries",t:"R",f:"E",
q:"What shape does a Claude API error response body take?",
o:["A. `{\"error\": \"message string\"}`","B. `{\"type\":\"error\",\"error\":{\"type\":\"...\",\"message\":\"...\"}}`","C. `{\"status\":\"failed\",\"code\":429}`","D. A plain-text body with the HTTP status line"],a:1,
e:"Errors are structured JSON: a top-level **`type: \"error\"`** plus a nested **`error`** object holding a machine-readable **`type`** (e.g. `invalid_request_error`, `rate_limit_error`, `overloaded_error`) and a human-readable **`message`**. The body also carries a top-level **`request_id`** — the same value as the `request-id` header — so you can pull the support identifier straight out of a failure. Branch on the nested `error.type`, never on substring-matching the message text, and expect the set of `type` values to expand over time.",
w:"A and C are invented shapes. D — responses are JSON, not plain text."},

{id:19,d:"D1",s:"Error Handling & Retries",t:"S",f:"H",
q:"Requests that worked in staging now return `400 invalid_request_error` in production against the same model. What should be checked first?",
o:["A. Whether the API key has expired","B. Whether the request body is structurally invalid — e.g. missing `max_tokens`, a `system` role inside `messages`, or malformed content blocks","C. Whether the account exceeded its monthly spend","D. Whether Anthropic is having an outage"],a:1,
e:"**400 is deterministic and about the request itself** — Claude never saw a valid payload. Inspect the serialised body: missing `max_tokens`, a `system` entry placed inside `messages`, an unpaired `tool_result` (every `tool_use` id must be answered), an empty `messages` array, or a content block missing its `type`. Environment-specific 400s usually trace to config or serialisation drift between environments, so diff the actual outgoing JSON.",
w:"A — an invalid key is 401. C — a *plausible* but lower-probability cause worth knowing: an org or workspace spend limit you set does return **400**, while a usage-tier monthly cap returns **429** and payment-information problems return **402 `billing_error`**. Read `error.message` first — a spend-limit 400 says so explicitly, whereas a structural 400 names the offending field, which is why diffing the body is still the first move. D — an outage is 500/529, and would not be model- or environment-specific."},

{id:20,d:"D1",s:"Error Handling & Retries",t:"S",f:"M",
q:"An engineer must attach a support ticket for an intermittent API failure. Which value best identifies the specific failed call?",
o:["A. The `request-id` response header","B. The `message.id` from the response body","C. The client's own correlation UUID","D. The Unix timestamp of the request"],a:0,
e:"The **`request-id`** response header — note the name has **no `x-` prefix** — uniquely identifies that API call on Anthropic's side and is exactly what support needs. Values look like `req_018EeWyXxfu5pfWkrYcMdjWG`. It also appears as a top-level **`request_id`** field in error response bodies, so you can read it straight out of a failure. Log it on **every** response, success and failure, because you cannot retroactively obtain it. The Python and TypeScript SDKs expose it as `_request_id`.",
w:"B — `message.id` identifies a successful message and is absent on many failures. C — meaningful only inside your own systems. D — timestamps are far too coarse to isolate one call among thousands."},

{id:21,d:"D1",s:"Streaming",t:"R",f:"E",
q:"How do you request a streamed response?",
o:["A. Call `/v1/messages/stream`","B. Set `\"stream\": true` in the request body","C. Send header `accept: text/event-stream`","D. Set `\"mode\": \"stream\"` in the body"],a:1,
e:"Add **`\"stream\": true`** to the body of the ordinary `POST /v1/messages` call. There is no separate streaming URL. The response arrives as **server-sent events** (`content-type: text/event-stream`) which you consume incrementally rather than awaiting a single JSON document.",
w:"A — no such endpoint. C — the header describes the response type but does not itself trigger streaming. D — no `mode` parameter exists."},

{id:22,d:"D1",s:"Streaming",t:"R",f:"M",
q:"Which sequence of SSE event types does a streaming Messages response follow?",
o:["A. `start` → `data` → `end`","B. `message_start` → `content_block_start` → `content_block_delta`… → `content_block_stop` → `message_delta` → `message_stop`","C. `open` → `chunk` → `close`","D. `message_begin` → `token` → `message_complete`"],a:1,
e:"The lifecycle is: **`message_start`** (message shell with initial usage) → for each content block **`content_block_start`**, a run of **`content_block_delta`**, then **`content_block_stop`** → **`message_delta`** (carries the final `stop_reason` and cumulative output usage) → **`message_stop`**. Periodic **`ping`** events may be interleaved as keep-alives, and an **`error`** event can arrive mid-stream.",
w:"A, C, and D are generic SSE or invented naming, not Anthropic's event set."},

{id:23,d:"D1",s:"Streaming",t:"S",f:"H",
q:"A streaming client needs the final `stop_reason` and total output tokens. Which event carries them?",
o:["A. `message_start`","B. `content_block_stop`","C. `message_delta`","D. `message_stop`"],a:2,
e:"**`message_delta`** carries the terminal metadata: `delta.stop_reason`, `delta.stop_sequence`, and cumulative `usage.output_tokens`. This is a classic exam distinction — `message_stop` merely marks the end of the byte stream and carries no metadata, while `message_start` fires before any output exists so its output count is not yet meaningful.",
w:"A — too early; output usage is not final there. B — closes one content block only. D — a bare terminator with no payload."},

{id:24,d:"D1",s:"Streaming",t:"R",f:"M",
q:"When streaming a response that includes tool use, which delta type carries the incrementally-built tool arguments?",
o:["A. `text_delta`","B. `input_json_delta`","C. `tool_delta`","D. `arguments_delta`"],a:1,
e:"Tool inputs stream as **`input_json_delta`** events whose `partial_json` fragments must be **concatenated and only then parsed**. Any single fragment is almost certainly invalid JSON on its own, so attempting to `JSON.parse` each delta as it arrives is a frequent and confusing bug. Plain prose streams as `text_delta`; extended thinking streams as `thinking_delta`.",
w:"A — carries visible text, not tool arguments. C/D — not real event types."},

{id:25,d:"D1",s:"Streaming",t:"S",f:"M",
q:"Which requirement most strongly justifies streaming over a single buffered response?",
o:["A. Reducing total token cost for the request","B. Showing output progressively so perceived latency drops in a user-facing chat UI","C. Guaranteeing valid JSON output","D. Raising the effective output token ceiling"],a:1,
e:"Streaming is a **perceived-latency and UX** mechanism: first tokens appear in a fraction of the total generation time, so a long answer feels responsive. A secondary operational benefit is avoiding client/proxy timeouts on very long generations. It changes **when** bytes arrive, not what they cost.",
w:"A — identical token count, identical price. C — streaming makes structured output *harder* to validate, since you must buffer before parsing. D — `max_tokens` and model limits are unchanged by streaming."},

{id:26,d:"D1",s:"Streaming",t:"S",f:"H",
q:"A service streams responses and must also return strictly-validated JSON to a downstream consumer. What is the sound approach?",
o:["A. Parse and validate each `text_delta` as it arrives","B. Accumulate all deltas, then parse and validate once the stream completes","C. Streaming and JSON output are incompatible; disable streaming","D. Ask the model to emit one complete JSON object per delta"],a:1,
e:"Deltas are **arbitrary token fragments** — a JSON object is routinely split mid-key or mid-string — so nothing intermediate is parseable. Buffer the fragments, and on `message_stop` parse and validate the assembled payload. Streaming still buys you progress feedback; you simply defer parsing to the end. For contract-grade structure, prefer defining a **tool with a JSON Schema** and reading the tool input over asking for raw JSON prose.",
w:"A — intermediate fragments are invalid JSON by nature. C — unnecessary; buffering resolves it. D — the model has no control over delta boundaries, which are a transport detail."},

{id:27,d:"D1",s:"Streaming",t:"R",f:"E",
q:"What is the purpose of the `ping` event in a Claude SSE stream?",
o:["A. It measures round-trip latency","B. It is a keep-alive that holds the connection open during gaps in generation","C. It signals a retry is required","D. It marks a content block boundary"],a:1,
e:"**`ping`** is a periodic no-op keep-alive. It prevents intermediaries — proxies, load balancers, browsers — from closing a connection that appears idle while the model is still working. Clients should simply ignore it; treating it as content or as an error is a straightforward bug.",
w:"A — it carries no timing data. C — retries are driven by `error` events or HTTP failures. D — boundaries are `content_block_start`/`content_block_stop`."},

{id:28,d:"D1",s:"Batch API",t:"R",f:"M",
q:"What is the headline cost characteristic of the Message Batches API?",
o:["A. Roughly 50% off standard input and output token pricing","B. Free below 1,000 requests per day","C. Flat per-batch fee regardless of tokens","D. Same price, higher rate limits"],a:0,
e:"Batch processing trades latency for money: about **50% off both input and output tokens** versus standard synchronous calls. Batches are submitted to **`/v1/messages/batches`** and complete **within 24 hours** (often much sooner). It stacks with other savings — you can combine batch pricing with prompt caching.",
w:"B — no free tier of this kind. C — pricing remains token-based. D — the defining benefit is the discount, not raised limits."},

{id:29,d:"D1",s:"Batch API",t:"S",f:"M",
q:"Which workload is the **worst** fit for the Batch API?",
o:["A. Re-classifying a 400,000-document archive overnight","B. Generating embeddings-style summaries for a nightly warehouse load","C. An interactive chat widget that must reply within two seconds","D. Backfilling sentiment labels on two years of support tickets"],a:2,
e:"Batch results are returned **within a 24-hour window**, with no latency guarantee for any individual request — categorically unusable for anything a human is waiting on. The API targets high-volume, non-interactive, deadline-tolerant work: archive reprocessing, nightly enrichment, evaluations, and historical backfills.",
w:"A, B, and D are all offline bulk jobs with no user blocking on the result — precisely the intended use case."},

{id:30,d:"D1",s:"Batch API",t:"R",f:"M",
q:"What identifier must accompany each request inside a batch, and why?",
o:["A. `request_id`, assigned by Anthropic","B. `custom_id`, supplied by you, to match results back to inputs","C. `index`, implied by array position","D. No identifier — results always return in submission order"],a:1,
e:"Every entry needs a **`custom_id`** that you assign. Results come back as **JSONL and are not order-guaranteed**, so `custom_id` is the only reliable join key back to your source records. It also makes per-request outcomes individually addressable, since each result carries its own status — `succeeded`, `errored`, `canceled`, or `expired` — meaning partial failure within an otherwise successful batch is normal and must be handled.",
w:"A — Anthropic returns ids but you need your own correlation key. C/D — relying on ordering is unsafe and explicitly not guaranteed."},

{id:31,d:"D1",s:"Batch API",t:"S",f:"H",
q:"A batch of 50,000 requests finishes with status `ended`. How should results be processed?",
o:["A. Assume all succeeded, since the batch ended without error","B. Stream the JSONL results and branch on each entry's individual status, handling `errored` and `expired` separately","C. Re-submit the whole batch if any entry failed","D. Only inspect the batch-level counts and ignore per-entry status"],a:1,
e:"`ended` describes the **batch lifecycle**, not universal per-request success. Each result line carries its own outcome — **`succeeded`, `errored`, `canceled`, `expired`** — so you must iterate the JSONL, join on `custom_id`, and route failures to a retry queue. Treating batch completion as blanket success silently drops records, which is the classic production bug here.",
w:"A — conflates lifecycle with per-item outcome. C — wasteful and expensive; retry only the failed subset. D — the aggregate hides which specific records need rework."},

{id:32,d:"D1",s:"Vision & Multimodal",t:"R",f:"E",
q:"Which image formats does Claude's vision capability accept?",
o:["A. JPEG, PNG, GIF, WebP","B. JPEG and PNG only","C. Any format, auto-converted server-side","D. PNG, TIFF, BMP, SVG"],a:0,
e:"**JPEG, PNG, GIF, and WebP** — declared via the block's `media_type` (e.g. `image/jpeg`). Images are supplied via one of **three** source types: **`base64`** (inline), **`url`** (Anthropic fetches it), or **`file`** (a `file_id` from the Files API — upload once, reference many times). Vector formats, TIFF, and BMP are unsupported, animations are not read beyond the first frame, and there is no server-side conversion, so normalise formats client-side. Note that on some partner cloud platforms only `base64` is available.",
w:"B — too narrow. C — unsupported types are rejected. D — SVG, TIFF, and BMP are all unsupported."},

{id:33,d:"D1",s:"Vision & Multimodal",t:"S",f:"M",
q:"An application must send a locally-stored PNG for analysis. What is the correct content block?",
o:["A. `{\"type\":\"image\",\"source\":{\"type\":\"base64\",\"media_type\":\"image/png\",\"data\":\"<b64>\"}}`","B. `{\"type\":\"image\",\"path\":\"/tmp/x.png\"}`","C. `{\"type\":\"file\",\"content\":\"<binary>\"}`","D. `{\"type\":\"text\",\"text\":\"<b64>\"}`"],a:0,
e:"Local images are inlined as **base64** inside an `image` block with an explicit **`media_type`**. Two other source types exist: **`url`** for publicly-reachable images, and **`file`** (`{\"type\":\"file\",\"file_id\":\"...\"}`) for an image uploaded via the Files API. Prefer `file` in multi-turn or agentic flows — because the API is **stateless** you resend the whole history each turn, so inline base64 bytes are retransmitted on every request. Note the API has no filesystem access, so a local path is meaningless to it.",
w:"B — no `path` field; the API cannot read your disk. C — no such block shape in the Messages API. D — base64 pasted as text is treated as meaningless characters, wastes enormous token budget, and is not interpreted as an image."},

{id:34,d:"D1",s:"Vision & Multimodal",t:"S",f:"M",
q:"A team wants Claude to produce a marketing illustration from a text brief. What should they be told?",
o:["A. Set `\"modality\": \"image\"` on the request","B. Claude analyses images but does not generate them; pair it with an image-generation model","C. Use the `/v1/images` endpoint","D. Request a base64 PNG in the prompt"],a:1,
e:"Claude's vision is **input-only**: it reads, describes, extracts from, and reasons about images, but emits no image data. A common architecture is to use Claude for the reasoning layer — interpreting the brief, writing and refining a detailed generation prompt — then hand that to a dedicated image model.",
w:"A/C — no such parameter or endpoint exists. D — the model cannot synthesise image bytes; asking yields either a refusal or invalid output."},

{id:35,d:"D1",s:"Vision & Multimodal",t:"S",f:"H",
q:"A document-processing pipeline sends 4,000×5,000-pixel page scans and hits both high token costs and slow responses. What is the most effective mitigation?",
o:["A. Convert all scans to GIF","B. Downscale the scans to the model's native resolution limit, since token cost scales with pixel area","C. Set `max_tokens: 100` to cut cost","D. Send each page as a URL instead of base64"],a:1,
e:"Images are charged in **visual tokens**, and Claude reads them as **28×28-pixel patches** — an image costs roughly `⌈width/28⌉ × ⌈height/28⌉` visual tokens, so cost scales with **pixel area**. Each model also has a **native resolution limit** above which the image is downscaled anyway (long edge around **1,568 px** on older models, ~**2,576 px** on the newest tier), so a 4,000×5,000 scan is being reduced regardless — you are paying to upload pixels the model discards. Resize client-side to the tier limit: it cuts visual tokens *and* upload latency. Preserve higher resolution only where fine detail carries meaning, such as dense small print.",
w:"A — format choice barely affects visual-token count, and GIF may degrade text legibility. C — caps the *answer*, not the image input cost, and truncates useful output. D — changes transport, not pixel count, so cost is unchanged."},

{id:36,d:"D1",s:"Vision & Multimodal",t:"S",f:"M",
q:"A request must compare two product photos in a single turn. How are they supplied?",
o:["A. Two separate API calls, then a third to compare","B. Multiple `image` blocks in one message's `content` array, ideally labelled with text blocks","C. Concatenate both into one image","D. Not supported — one image per request"],a:1,
e:"A message's `content` array holds **many blocks**, so you interleave `image` and `text` blocks in one turn. Labelling each image with an adjacent text block (\"Image 1: current packaging\", \"Image 2: proposed packaging\") measurably improves reference accuracy in the answer. Many images per request are supported.",
w:"A — needless cost and latency, and the comparison turn would lack the actual images. C — loses resolution and boundaries. D — multi-image input is explicitly supported."},

{id:37,d:"D1",s:"Software Engineering Foundations",t:"S",f:"M",
q:"A production service must guarantee the underlying model does not change beneath it. What does Anthropic's current model-ID scheme mean for that goal?",
o:["A. Dateless IDs are evergreen pointers to the newest version, so you must append a date suffix to pin","B. Every model ID is already a pinned snapshot — dateless IDs included — so naming the ID *is* the pin","C. Pinning is impossible; you must re-run evals on every release","D. Dated IDs are cheaper and more stable than dateless ones"],a:1,
e:"**Pinning is the default.** Current model IDs are **dateless** and each one *is* its own fixed snapshot — Anthropic does not update the weights behind an existing ID; an updated model ships under a new ID. Never invent a date suffix for a dateless ID. The one moving target is the short **alias** form on older models, which resolves to the most recent dated snapshot; that resolution is what production should avoid depending on. Important caveat: weights are fixed, but **serving infrastructure can change**, so pinning gives stability rather than a guarantee of bit-identical behaviour forever — keep a regression suite and promote new IDs deliberately.",
w:"A — the docs call this out as a common misconception and warn against inventing date suffixes. C — naming a model ID is exactly what pins it. D — pricing and rate limits track the model, not the ID form."},

{id:38,d:"D1",s:"Software Engineering Foundations",t:"R",f:"E",
q:"Where should a Claude API key live in a deployed application?",
o:["A. Hard-coded in source so deploys cannot break","B. In environment variables or a secrets manager, never committed to version control","C. In client-side JavaScript so the browser can call the API directly","D. In a public config file for ops convenience"],a:1,
e:"Keys belong in **environment variables or a managed secret store** (Vault, AWS Secrets Manager, and similar), injected at runtime and never committed. Equally important: keys must stay **server-side**. Any key shipped to a browser or mobile binary is extractable and therefore already compromised — front-ends should call your backend, which holds the key and enforces auth and rate limits.",
w:"A — committed secrets leak through history, forks, and logs, and rotation becomes a redeploy. C — publishes your key to every user. D — a public file is a public key."},

{id:39,d:"D1",s:"Software Engineering Foundations",t:"S",f:"H",
q:"A team must upgrade to a newer Claude model without regressing behaviour. What is the soundest process?",
o:["A. Switch production to `-latest` and watch error rates","B. Run a golden-dataset eval on both versions, diff outputs against expectations, then roll out gradually behind a flag","C. Upgrade only if the release notes mention their use case","D. Rewrite all prompts first, then upgrade"],a:1,
e:"Treat a model change like any dependency upgrade: hold a **golden dataset** of representative inputs with expected outputs, run it against both the current pin and the candidate, **diff and score the deltas**, then roll out **incrementally behind a feature flag** with monitoring and a fast rollback path. Newer models are usually better on average yet can differ on formatting or edge cases your prompts implicitly depended on.",
w:"A — makes production the test environment, with no baseline to diff against. C — release notes cannot anticipate your data. D — rewriting before measuring is wasted effort; measure first, then fix only what regressed."},

{id:40,d:"D1",s:"Software Engineering Foundations",t:"S",f:"M",
q:"Why does Anthropic recommend the official SDKs over hand-rolled HTTP calls?",
o:["A. SDK requests are billed at a lower rate","B. They handle retries, backoff, streaming assembly, versioning, and typed errors for you","C. Raw HTTP access requires special approval","D. SDKs bypass rate limits"],a:1,
e:"The official SDKs — **Python, TypeScript, C#, Go, Java, PHP and Ruby** — absorb the tedious, bug-prone plumbing: **automatic retries with backoff (honouring `retry-after`), SSE stream assembly, auth/version/content-type headers, typed error classes, timeouts, auto-pagination and token-count helpers**. Raw HTTP is entirely legitimate — the API is a documented REST interface — but you then own all of that correctness yourself.",
w:"A/D — billing and rate limits are identical regardless of client. C — no approval needed."},

{id:41,d:"D1",s:"Configuration Management",t:"R",f:"M",
q:"What effect does `temperature: 0` have?",
o:["A. Guarantees byte-identical output on every call, forever","B. Makes output maximally deterministic by strongly favouring the highest-probability tokens","C. Disables the model's safety training","D. Shortens responses"],a:1,
e:"On models that accept it, `temperature: 0` drives sampling toward the most probable token at each step, making output **near-deterministic and highly repeatable** — the right default for classification, extraction, and structured generation. Be precise: the docs state output is **not fully deterministic even at 0.0**. Where supported the range is **0.0–1.0**, default **1.0**. **Critical currency note:** `temperature`, `top_p`, and `top_k` are **deprecated and no longer settable on the newest model generations** — a non-default value returns a **400**. On current models you omit them and steer behaviour through the prompt and structured outputs instead.",
w:"A — overstates it; the docs say output is not fully deterministic even at 0.0, and serving-infrastructure changes can shift behaviour on a fixed model ID. C — temperature is unrelated to safety behaviour. D — it affects token choice, not length; `max_tokens` and prompt instructions control length."},

{id:42,d:"D1",s:"Configuration Management",t:"S",f:"M",
q:"On a model that still accepts sampling parameters, which configuration best fits a creative-copy generator producing varied taglines?",
o:["A. `temperature: 0`","B. A higher `temperature` (around 0.8–1.0)","C. `temperature: 0` with `top_k: 1`","D. `temperature: 2.0`"],a:1,
e:"Higher temperature flattens the sampling distribution so lower-probability tokens get selected more often — exactly the **variety** creative work wants. Roughly: low temperature for extraction, classification, and code; higher for ideation and copy. The valid range is **0.0–1.0** (default 1.0); there is no 2.0. **Currency note:** on the newest model generations `temperature`, `top_p`, and `top_k` are removed and any non-default value returns a **400** — so on a current model you get variety by **asking for it in the prompt** (\"give me five distinctly different taglines\") rather than by tuning sampling.",
w:"A/C — deterministic settings collapse toward one phrasing, defeating the purpose. D — out of range on every model, and on the newest generations even an in-range 0.8 is rejected."},

{id:43,d:"D1",s:"Configuration Management",t:"R",f:"H",
q:"What is Anthropic's guidance on using `temperature` and `top_p` together?",
o:["A. Always set both for finer control","B. Adjust one or the other, not both — they interact unpredictably","C. `top_p` is ignored whenever `temperature` is set","D. Both are required when `top_k` is used"],a:1,
e:"Both reshape the same sampling distribution — temperature by scaling logits, `top_p` by truncating to a cumulative-probability nucleus — so tuning them together produces **compounding, hard-to-reason-about effects**. That long-standing guidance is now **enforced**: on recent models sending both returns a **400** (`temperature and top_p cannot both be specified for this model`). Going further, all three of `temperature`, `top_p`, and `top_k` are deprecated and **not accepted at all on the newest generations**. On current models, omit them and steer output with the prompt and structured outputs.",
w:"A — the opposite of the recommendation, and now a hard 400. C — `top_p` is not silently ignored where supported; it genuinely applies. D — `top_k` is itself deprecated and rejected on the newest models, and never imposed such a requirement."},

{id:44,d:"D1",s:"Configuration Management",t:"S",f:"M",
q:"A code generator must stop as soon as the model emits `</code>`. Which parameter achieves this?",
o:["A. `stop_sequences: [\"</code>\"]`","B. `max_tokens: 1`","C. `stop_reason: \"stop_sequence\"`","D. `truncate_at: \"</code>\"`"],a:0,
e:"**`stop_sequences`** takes an array of strings; generation halts immediately when any is produced, and the response reports **`stop_reason: \"stop_sequence\"`** along with which one matched in `stop_sequence`. It is the standard way to bound output at a structural delimiter without over-generating.",
w:"B — caps length at one token regardless of content. C — a response field the model sets, not an input. D — no such parameter."},

{id:45,d:"D1",s:"Understanding Requirements",t:"S",f:"H",
q:"A stakeholder asks for \"an AI that answers questions about our 40,000 internal policy documents.\" Which requirement most shapes the architecture?",
o:["A. Preferred response tone","B. That the corpus vastly exceeds any context window, so retrieval must select relevant passages per query","C. Which programming language the team prefers","D. Whether responses should stream"],a:1,
e:"40,000 documents is **orders of magnitude beyond any context window** — current flagships top out around **1M tokens** (roughly 555k words) and the smallest tier at 200K — so the defining architectural decision is **retrieval**: index and chunk the corpus, fetch the passages relevant to each query, and inject only those. Everything else — tone, language, streaming — is downstream polish that does not change the shape of the system.",
w:"A/C/D are real requirements but implementation details; none alters the fundamental need for a retrieval layer."},

{id:46,d:"D1",s:"Understanding Requirements",t:"S",f:"M",
q:"A regulated client requires that every generated answer be traceable to a source document. What must the design include?",
o:["A. Setting `temperature: 0`","B. Retrieval that carries document identifiers through to the prompt, plus output structured to cite the passages used","C. Logging every request and response","D. Using the largest available model"],a:1,
e:"Traceability is an **architectural** property, not a sampling setting. Pass retrieved chunks with their **identifiers and metadata** into the prompt, instruct the model to cite the specific passages it relied on, and structure the output so citations are machine-checkable — then validate that cited ids actually exist in what was retrieved. That last verification step is what separates real traceability from plausible-looking references.",
w:"A — improves consistency, provides no provenance. C — audit logs record what happened but do not attribute claims to sources. D — a stronger model still cannot cite documents it was never given."},

{id:47,d:"D1",s:"Systems Life Cycle",t:"S",f:"M",
q:"What is the most reliable way to catch prompt regressions before they reach users?",
o:["A. Manual spot-checks by the prompt author","B. An automated eval suite of representative inputs with expected properties, run in CI on every prompt change","C. Monitoring production error rates after deploy","D. Peer review of the prompt diff"],a:1,
e:"Prompts are **behavioural code** and deserve equivalent testing: a versioned **eval suite** of representative inputs, asserting checkable properties (schema validity, required fields, refusal behaviour, accuracy against known answers), executed **in CI on every change**. Peer review and monitoring are useful complements, but only automated evals catch silent quality regressions before release.",
w:"A — unrepeatable and biased toward the author's expectations. C — detects damage only after users are affected, and quality drops often raise no errors at all. D — reviewers cannot predict model behaviour from a diff."},

{id:48,d:"D1",s:"Systems Life Cycle",t:"S",f:"H",
q:"Which observability signals matter most for a production Claude integration?",
o:["A. CPU and memory of the calling service only","B. Latency percentiles, error rates by `error.type`, token usage per request, cache hit rate, and `stop_reason` distribution","C. Total request count","D. Only end-user satisfaction scores"],a:1,
e:"Instrument the dimensions that actually drive cost, reliability, and quality: **latency percentiles** (p50/p95/p99, since means hide tail pain), **error rates broken down by `error.type`** so 429s are distinguishable from 400s, **token usage per request** for cost attribution, **cache hit rate** to confirm caching is paying off, and the **`stop_reason` distribution** — a rising share of `max_tokens` is an early warning that outputs are being silently truncated.",
w:"A — host metrics say nothing about API behaviour. C — volume alone reveals neither cost nor failures. D — a lagging, low-resolution signal that cannot localise a problem."},

{id:49,d:"D1",s:"Deployment Platforms",t:"R",f:"M",
q:"Besides Anthropic's own API, on which managed cloud platforms are Claude models offered?",
o:["A. Amazon Bedrock, Google Cloud, and Microsoft Foundry on Azure","B. Amazon Bedrock and Google Cloud only","C. Azure OpenAI Service","D. Only through Anthropic's first-party API"],a:0,
e:"Claude is available first-party **and** across multiple clouds: **Amazon Bedrock**, **Google Cloud**, and **Microsoft Foundry** on Azure. Teams choose these for data-residency requirements, consolidated cloud billing and committed spend, and existing IAM/VPC and compliance boundaries. Core request/response semantics carry over, but **authentication, model identifier strings, region handling and feature availability are platform-specific** — Bedrock prefixes model IDs, and partner platforms can lag on some features (for example, only `base64` image sources rather than `url`). That gap is the commonly tested part.",
w:"B — omits the Azure route. C — Azure OpenAI Service is a different product serving OpenAI models; Claude on Azure is delivered through **Microsoft Foundry**, so the common belief that Claude is unavailable on Azure is now wrong. D — the cloud platforms are a well-documented deployment path."},

{id:50,d:"D1",s:"Deployment Platforms",t:"S",f:"H",
q:"An enterprise on AWS with strict data-residency rules wants Claude inside its existing compliance boundary. What changes when moving from the first-party API to Bedrock?",
o:["A. Nothing — the integration is byte-identical","B. Authentication shifts to AWS IAM/SigV4, model IDs use Bedrock's naming, and region selection is explicit; message semantics largely carry over","C. Tool use and streaming are unavailable on Bedrock","D. Prompts must be rewritten for Bedrock"],a:1,
e:"The **model and message semantics transfer**, but the platform envelope changes: credentials become **AWS IAM/SigV4** rather than `x-api-key`, models are addressed by **Bedrock model identifiers**, and you **choose a region** explicitly — which is precisely what satisfies data-residency. Requests flow through your AWS account, so CloudTrail, VPC, and IAM policy all apply. Plan for SDK and configuration changes rather than a prompt rewrite.",
w:"A — auth, identifiers, and region handling all differ. C — both are supported. D — prompts are model-level and port over."}
);
</script>
<script>
/* ===== D2 · Model Selection & Optimization ===== */
QB.push(
{id:51,d:"D2",s:"LLM Fundamentals",t:"R",f:"E",
q:"What is a token in the context of Claude?",
o:["A. One word","B. One character","C. A sub-word unit of text — on the order of 2–4 characters of English, depending on the model's tokenizer","D. One sentence"],a:2,
e:"Tokens are **sub-word units** produced by the tokenizer, and the ratio is **tokenizer-dependent**. On the newest model generations roughly **2.5 characters per token** (~1.8 tokens per word); on earlier models roughly **4 characters per token** (~0.75 **words** per token) — the newer tokenizer yields about **30% more tokens for identical text**. Mind the direction of that ratio, since it is easy to invert. Critically it is only a heuristic: code, JSON, whitespace, rare words, and non-English scripts tokenize far less efficiently. Use `/v1/messages/count_tokens` **against the model you will actually call** when the number matters.",
w:"A — a long or unusual word can split into several tokens. B — character-level tokenization would be wildly inefficient. D — sentences are many tokens."},

{id:52,d:"D2",s:"LLM Fundamentals",t:"S",f:"M",
q:"An engineer estimates prompt size by dividing character count by 4. Their non-English and JSON-heavy payloads keep overflowing the context window. Why?",
o:["A. The divisor should be 2 for all content","B. No fixed chars-per-token divisor is safe — it varies by tokenizer, and JSON punctuation and non-Latin scripts tokenize far less efficiently than the prose it was calibrated on","C. Context windows shrink under load","D. JSON is not supported as input"],a:1,
e:"The 4:1 heuristic was calibrated on **English prose** on an older tokenizer. Structured content breaks it — JSON braces, quotes, and escapes each consume tokens, and CJK scripts use substantially more tokens per character. Worse, **the divisor itself is model-dependent**: the newest generations use a tokenizer producing ~30% more tokens (~2.5 chars/token), so `/4` under-counts even plain English there. Where overflow matters, call **`/v1/messages/count_tokens`** for the real figure.",
w:"A — no single divisor is universally right; that is the whole problem. C — the window is a fixed model property. D — JSON input is perfectly supported, just token-dense."},

{id:53,d:"D2",s:"LLM Fundamentals",t:"R",f:"M",
q:"What does a model's context window bound?",
o:["A. Output tokens only","B. Input tokens only","C. Everything in the request — system prompt, messages, tool definitions, images — **plus** the output Claude generates, which also counts against it","D. Requests per minute"],a:2,
e:"The context window bounds **everything in the request** — system prompt, full message history, tool schemas, image tokens — **and the output Claude generates for the turn, including thinking tokens**. This is the subtle part: output is **not** a separate budget. `max_tokens` is an *additional* ceiling on output, and on recent models if input + `max_tokens` overflows the window the request is still accepted, then generation halts with **`stop_reason: \"model_context_window_exceeded\"`**. The other frequent mistake is forgetting that tool definitions and images consume context too.",
w:"A/B — it covers the aggregate, not one side. D — that is a rate limit, an unrelated concept."},

{id:54,d:"D2",s:"Model Selection & Trade-offs",t:"S",f:"M",
q:"A support product must classify 2 million inbound tickets per month into 12 categories. Accuracy needs are moderate; cost and throughput dominate. Which selection principle applies?",
o:["A. Always use the most capable model to maximise accuracy","B. Choose the smallest, fastest model class (Haiku tier) that clears the accuracy bar on a held-out eval set","C. Choose based on the largest context window","D. Alternate models to average out errors"],a:1,
e:"The governing principle is **fitness for purpose, validated empirically**: start with the cheapest, fastest tier — **Haiku-class** — measure accuracy on a labelled held-out set, and escalate only if it misses the bar. At 2M requests/month the cost delta between tiers is enormous, and short-input classification is exactly where small models perform close to large ones. Pick the model with an eval, not an intuition.",
w:"A — pays a large premium for capability the task does not need. C — context size is irrelevant for short tickets. D — adds cost and variance without improving accuracy."},

{id:55,d:"D2",s:"Model Selection & Trade-offs",t:"R",f:"E",
q:"How do Claude's model tiers differ in intent?",
o:["A. Haiku is fastest and cheapest; Sonnet balances speed and intelligence; Opus handles complex agentic and enterprise work, with a higher tier above it for the most demanding reasoning","B. They differ only in context window size","C. Haiku is for code, Sonnet for chat, Opus for images","D. They are identical, priced differently"],a:0,
e:"The tiers express a **capability/latency/cost trade-off**: **Haiku** is fastest and cheapest for high-volume, well-scoped work like classification, extraction and routing; **Sonnet** offers the best combination of speed and intelligence; **Opus** targets complex agentic coding and enterprise work; and a **top tier above Opus** exists for the most demanding reasoning and long-horizon agentic work. Note the current guidance starts you at the **Opus** tier for most workloads and escalates only when evals fall short — and that a mature system **routes across tiers** rather than standardising on one.",
w:"B — context does differ (the smallest tier is 200K while flagships reach 1M) but it is not what defines the tiers; capability, latency and price are. C — no tier is modality-specific; vision spans the family. D — capability differences are real and measurable."},

{id:56,d:"D2",s:"Model Selection & Trade-offs",t:"S",f:"H",
q:"A pipeline runs a single expensive model for every step: parsing intent, retrieving, then writing a nuanced customer reply. Costs are unsustainable. What is the strongest optimisation?",
o:["A. Reduce `max_tokens` on all calls","B. Route by step difficulty — a cheap fast model for intent parsing and routing, a stronger model only for the final nuanced reply","C. Cache the final response for all users","D. Move the whole pipeline to the Batch API"],a:1,
e:"**Model routing** — sometimes called cascading — is the highest-leverage move. Mechanical steps like intent classification and routing are easy wins for a **Haiku-class** model, while only the final user-facing generation genuinely needs a stronger tier. Because the cheap steps are usually the most frequent, this often cuts cost by large multiples with no perceptible quality loss.",
w:"A — truncates useful output and barely dents input-dominated cost. C — customer replies are personalised; caching them across users is wrong and a privacy hazard. D — the reply is interactive, so a 24-hour window is unusable."},

{id:57,d:"D2",s:"Model Selection & Trade-offs",t:"S",f:"M",
q:"A user-facing autocomplete feature must respond in under 300 ms. Which factor should dominate model choice?",
o:["A. Maximum context window","B. Latency — favour the fastest tier, since capability beyond the task's needs buys nothing a user will perceive","C. Vision capability","D. Extended thinking support"],a:1,
e:"Under a hard interactive latency budget, **speed is the binding constraint**. The fastest tier (**Haiku-class**) is the natural fit, and short completions rarely need deep reasoning. Also design around latency: keep prompts and `max_tokens` tight, and stream if partial output is useful — a larger model that answers beautifully in 2 seconds has still failed this requirement.",
w:"A — irrelevant for short completions. C — no images involved. D — extended thinking deliberately trades latency for reasoning depth, the exact opposite of what is needed."},

{id:58,d:"D2",s:"Model Selection & Trade-offs",t:"R",f:"M",
q:"What is extended thinking, and what is its primary trade-off?",
o:["A. A larger context window, traded against cost","B. Internal reasoning before the final answer, improving hard multi-step problems at the cost of extra tokens and latency","C. Automatic web search, traded against privacy","D. A caching mechanism, traded against freshness"],a:1,
e:"Thinking lets the model **reason internally before answering**, surfacing that work as `thinking` content blocks. Those tokens are **billed as output tokens** and count toward `max_tokens`. On current models it is enabled with **`thinking: {type: \"adaptive\"}`** and steered with an **effort** setting, letting Claude decide how much to think. The older manual mode — `thinking: {type: \"enabled\", budget_tokens: N}` — is **deprecated and returns a 400 on the newest generations**, surviving only on older models. Either way it measurably helps hard multi-step maths, complex analysis and intricate debugging, and costs extra tokens and latency, so it is wasted on simple lookups.",
w:"A — it does not change the context window. C — no browsing is involved. D — unrelated to caching."},

{id:59,d:"D2",s:"Model Selection & Trade-offs",t:"S",f:"H",
q:"On a model that still supports manual extended thinking, a team sets `budget_tokens: 8000` with `max_tokens: 4000`. What is wrong?",
o:["A. Nothing — the parameters are independent","B. `budget_tokens` must be less than `max_tokens`, since thinking tokens are drawn from the same output allowance","C. `budget_tokens` must be a multiple of 1024","D. Extended thinking requires `max_tokens` to be unset"],a:1,
e:"Thinking tokens are **output tokens**, so the reasoning budget must fit inside the output allowance: **`budget_tokens` < `max_tokens`** (with a documented minimum of 1,024). Here 8,000 > 4,000, so the request is invalid — size `max_tokens` as the thinking budget plus room for the visible answer. Two refinements: the one documented exception is **interleaved thinking**, where the budget spans all thinking blocks in a turn and may exceed `max_tokens`; and sampling is constrained, with `temperature` and `top_k` incompatible with thinking on these models. On the newest generations this request fails even earlier, since `thinking: {type: \"enabled\"}` is itself rejected in favour of adaptive thinking.",
w:"A — they are directly coupled through the output budget. C — there is a documented minimum, but no multiple-of-1024 requirement. D — `max_tokens` remains required on every request."},

{id:60,d:"D2",s:"Cost & Token Management",t:"R",f:"E",
q:"Which generally costs more per token, and what follows for cost control?",
o:["A. Input tokens; so shorten prompts above all","B. Output tokens; so constrain response length and avoid needless verbosity","C. They are always identical","D. Cost is per request, not per token"],a:1,
e:"**Output tokens are priced higher than input tokens.** Practically, that means two distinct levers: bound generation with a realistic `max_tokens` and explicit brevity instructions or structured formats, *and* separately reduce repeated input through prompt caching. Many real workloads are still input-dominated by volume, so measure your own `usage` split before optimising — do not assume which side dominates.",
w:"A — input is the cheaper side per token, though often larger in volume. C — the rates differ. D — billing is token-based, not per call."},

{id:61,d:"D2",s:"Cost & Token Management",t:"S",f:"M",
q:"A chatbot resends a 12,000-token style guide and tool catalogue as the system prompt on every one of 500,000 monthly calls. What is the single most effective cost fix?",
o:["A. Switch to the Batch API","B. Enable prompt caching on the static system prompt and tool definitions","C. Trim the style guide to 6,000 tokens","D. Lower `temperature` to 0"],a:1,
e:"This is the textbook prompt-caching case: a **large, static, repeatedly-sent prefix**. Marking it with `cache_control` means subsequent hits read from cache at a **small fraction of normal input cost** rather than re-paying full price 500,000 times. Trimming content helps a little; caching addresses the actual structure of the waste. The two also compose — cache a trimmed prompt.",
w:"A — the bot is interactive, so a 24-hour window is unusable. C — halving still re-pays full price every call. D — temperature has no cost effect."},

{id:62,d:"D2",s:"Prompt Caching",t:"R",f:"M",
q:"How is a prompt cache breakpoint declared?",
o:["A. Set `\"cache\": true` at the top level of the request","B. Add `\"cache_control\": {\"type\": \"ephemeral\"}` to the content block that ends the cacheable prefix","C. Send an `anthropic-cache: on` header","D. Call `/v1/cache` before the request"],a:1,
e:"Caching is declared **per content block** by attaching **`cache_control: {\"type\": \"ephemeral\"}`** to the last block of the prefix you want cached. Everything **from the start of the request up to and including that block** becomes the cached prefix — the mechanism is deliberately positional, which is why breakpoint placement is the skill being tested. A **top-level `cache_control` field** is also accepted as a convenience: it places the breakpoint automatically at the last cacheable block and advances it as the conversation grows.",
w:"A — there is no `\"cache\": true` flag; the real top-level form is `cache_control: {\"type\": \"ephemeral\"}`. C — no such header. D — no cache endpoint exists; caching is inline."},

{id:63,d:"D2",s:"Prompt Caching",t:"S",f:"H",
q:"A request contains tool definitions, a long static system prompt, and a short volatile user message. Where should the cache breakpoint go?",
o:["A. On the user message, to cache the whole request","B. At the end of the static system prompt, so tools + system prompt are cached and the volatile user turn stays outside","C. On the first tool definition only","D. Breakpoints are unnecessary; caching is automatic"],a:1,
e:"Caching works on a **prefix** basis, so the breakpoint belongs at the **boundary between stable and changing content** — after the static system prompt, which captures the tool schemas and system prompt (tools are ordered before system, which precedes messages). Placing it on the volatile user message would define a prefix that **changes every call and therefore never hits**. Cache what repeats; leave what varies outside.",
w:"A — a per-user prefix cannot be reused, so hit rate collapses to zero. C — caches only part of the stable prefix, leaving the system prompt re-billed. D — caching is opt-in via explicit breakpoints."},

{id:64,d:"D2",s:"Prompt Caching",t:"R",f:"M",
q:"What is the default lifetime of an ephemeral prompt cache entry?",
o:["A. 30 seconds","B. 5 minutes, refreshed on each cache hit","C. 24 hours","D. Permanent until manually invalidated"],a:1,
e:"The default TTL is **5 minutes**, and it is **refreshed each time the cached prefix is read** — so a steadily-used prefix stays warm indefinitely, while an idle one expires. A longer **1-hour TTL** option also exists at a higher write cost. This is why caching pays off best under sustained traffic: with sparse, bursty usage you keep paying write cost for entries that expire unused.",
w:"A — too short. C — that is the Batch API window, a different concept. D — ephemeral means time-limited by design, and there is no manual invalidation API."},

{id:65,d:"D2",s:"Prompt Caching",t:"R",f:"H",
q:"Roughly how do cache write and cache read costs compare to normal input token cost?",
o:["A. Writes and reads are both free","B. Writes cost somewhat more than normal input; reads cost a small fraction of it","C. Writes are free; reads cost double","D. Both cost exactly the same as normal input"],a:1,
e:"You pay a **premium to write** a cache entry (modestly above the normal input rate, higher for the longer TTL) and then a **steep discount to read** it — a small fraction of standard input cost. The economics follow directly: caching wins when a prefix is read **many times per write**, and can actually *lose* money if you pay write premiums for prefixes that are used once and expire. Verify with `cache_creation_input_tokens` versus `cache_read_input_tokens`.",
w:"A — writes carry a real premium. C — inverted; reads are the cheap side. D — then caching would offer no benefit."},

{id:66,d:"D2",s:"Prompt Caching",t:"S",f:"H",
q:"A team enables caching but `usage` shows `cache_creation_input_tokens` on nearly every call and almost no `cache_read_input_tokens`. What is the most likely cause?",
o:["A. Caching is broken and should be reported as a bug","B. The cached prefix is not byte-identical across calls — something variable (a timestamp, user name, or reordered tools) sits inside it","C. `max_tokens` is set too low","D. The model does not support caching"],a:1,
e:"Cache hits require the prefix to match **exactly**. Any variability inside it — an injected timestamp or session id, a personalised greeting, non-deterministic tool ordering, or a re-serialised JSON key order — produces a different prefix and therefore a **write instead of a read** every call. That pattern is strictly worse than no caching, since you pay the write premium without ever collecting the discount. Audit the serialised prefix byte-for-byte and move all volatile content after the breakpoint. A secondary cause is a prefix below the **minimum cacheable token count**, which is silently not cached at all.",
w:"A — this is near-always a prefix-stability defect in the caller, not a platform fault. C — output limits have no bearing on input caching. D — caching is broadly supported across current models."},

{id:67,d:"D2",s:"Prompt Caching",t:"R",f:"M",
q:"Which parts of a request can be cached?",
o:["A. Only the system prompt","B. Tool definitions, the system prompt, and message content — as a contiguous prefix","C. Only the final user message","D. Only assistant responses"],a:1,
e:"Caching covers the request **prefix** and can span **tool definitions, the system prompt, and message content** — including prior conversation turns, which is what makes multi-turn caching effective. Order matters: tools come first, then system, then messages, and the cached region always runs from the start of the request to your breakpoint. Up to **4 cache breakpoints** are supported per request; exceeding that returns a 400.",
w:"A — tools and messages are cacheable too. C — a volatile final message is the worst possible breakpoint. D — generated output is never cached; caching applies to input."},

{id:68,d:"D2",s:"Prompt Caching",t:"S",f:"H",
q:"A long-running assistant caches its system prompt and, as turns accumulate, also caches conversation history. What is the correct pattern?",
o:["A. Move the single breakpoint to the newest message each turn","B. Keep a stable breakpoint after the static prefix and add a further breakpoint after the settled history, leaving only the newest turn uncached","C. Disable caching once history exceeds 10 turns","D. Re-create the cache from scratch every turn"],a:1,
e:"Use **multiple breakpoints** at stability boundaries: one after the static system prompt and tools, another after the conversation history that will not change again. Each turn then re-reads a long cached prefix cheaply and pays full price only for the **newest turn**. Because history is append-only, previously cached prefixes stay valid — this is the canonical way to keep long conversations affordable.",
w:"A — a single breakpoint on the newest message invalidates the prefix every turn. C — long histories are exactly where caching pays most. D — deliberately discarding a valid cache maximises cost."},

{id:69,d:"D2",s:"Prompt Caching",t:"R",f:"M",
q:"Which `usage` fields prove caching is working?",
o:["A. `input_tokens` and `output_tokens` alone","B. `cache_creation_input_tokens` and `cache_read_input_tokens`","C. `cache_hit_rate`","D. `total_cached`"],a:1,
e:"**`cache_creation_input_tokens`** counts tokens written into the cache (paid at the write premium) and **`cache_read_input_tokens`** counts tokens served from it (paid at the deep discount). A healthy steady-state pattern is a large read count with occasional writes; persistent writes with negligible reads means your prefix is unstable. There is no server-provided hit-rate field — you compute the ratio yourself from these two.",
w:"A — necessary for cost accounting but reveal nothing about caching. C/D — not real fields."},

{id:70,d:"D2",s:"Cost & Token Management",t:"S",f:"M",
q:"Which combination stacks correctly to reduce cost on a large offline classification job?",
o:["A. Batch API + prompt caching + a smaller model tier","B. Streaming + extended thinking","C. Raising `max_tokens` + `temperature: 0`","D. Sending each document in its own conversation with full history"],a:0,
e:"These three compose cleanly and attack different axes: the **Batch API** cuts the rate for non-interactive work, **prompt caching** stops you re-paying for the shared instruction prefix across documents, and **a smaller tier** cuts the base rate — provided an eval confirms it holds accuracy. Classification is short-output and offline, so nothing here trades away a requirement. One caveat: batches are processed asynchronously, so with the default 5-minute TTL a cache entry can expire before later requests in the batch read it — use the **1-hour TTL** for batch workloads.",
w:"B — extended thinking deliberately adds tokens, and streaming saves nothing on a job no human watches. C — raising the output cap and fixing temperature does not reduce cost. D — replaying full history per document multiplies input tokens for no benefit."},

{id:71,d:"D2",s:"Technical Fundamentals",t:"S",f:"M",
q:"An engineer wraps the Claude API behind an internal REST service. Which responsibility belongs in that wrapper rather than in each calling application?",
o:["A. Business-specific prompt text","B. Cross-cutting concerns: key custody, retries with backoff, rate limiting, token/cost accounting and logging","C. Nothing — callers should hit the Claude API directly","D. Model choice, which must be hard-coded to one model"],a:1,
e:"A gateway service is the right home for **cross-cutting concerns**: the API key never leaves it, and retry/backoff, client rate limiting, cost attribution, audit logging, and PII redaction get implemented once and enforced uniformly. Callers then stay simple. Prompts, by contrast, are domain logic and belong with the feature that owns them.",
w:"A — centralising every prompt makes the gateway a bottleneck for product changes. C — forfeits the key-custody and governance benefits, and scatters retry logic. D — the wrapper should *enable* per-use-case model routing, not prevent it."},

{id:72,d:"D2",s:"Technical Fundamentals",t:"R",f:"M",
q:"What does `top_k` control?",
o:["A. The number of responses returned","B. Sampling restricted to the k highest-probability next tokens","C. The count of retrieved documents","D. Parallel tool calls allowed"],a:1,
e:"**`top_k`** truncates sampling to the **k most probable next tokens**, discarding the long tail. It sits alongside `temperature` (which rescales the distribution) and `top_p` (a cumulative-probability nucleus). Currency note: on the newest model generations **any non-default `temperature`, `top_p` or `top_k` returns a 400** — these knobs survive only on older models, and on current ones you steer output with an effort setting and prompt instructions instead.",
w:"A — the Messages API returns one message per request. C — a retrieval parameter in your own stack, unrelated to sampling. D — governed by `tool_choice.disable_parallel_tool_use`."},

{id:73,d:"D2",s:"Cost & Token Management",t:"S",f:"H",
q:"Finance asks for per-team cost attribution on a shared Claude integration. What is the minimum needed?",
o:["A. The monthly invoice total","B. Per-request logging of team identity alongside `usage` token counts, including cache read/write fields, priced per model","C. Counting requests per team","D. Anthropic's console dashboard alone"],a:1,
e:"Attribution requires **per-request** records joining a team or tenant identifier to the response's **`usage`** figures — `input_tokens`, `output_tokens`, and the cache fields — plus the model used, since rates differ by tier. Only then can spend be priced correctly and allocated. The `metadata.user_id` field can help tag requests, but your own logs are what make the attribution auditable.",
w:"A — an aggregate with no breakdown. C — request counts ignore token size and model, so they mis-price wildly. D — useful for org-level trends but not team-level allocation."},

{id:74,d:"D2",s:"LLM Fundamentals",t:"R",f:"M",
q:"Why can an LLM state something false with complete confidence?",
o:["A. Its training data contained only false statements","B. It generates statistically plausible continuations, and fluency is not the same as factual grounding","C. It caches stale answers","D. Temperature above 0 injects errors deliberately"],a:1,
e:"The model predicts **likely next tokens**, and a fluent, well-formed sentence can be entirely fabricated — plausibility and truth are different properties, which is why confident tone is no evidence of accuracy. Mitigations are architectural: **ground answers in retrieved sources**, require citations you can verify against what was actually supplied, validate structured output against a schema, and keep a human in the loop for consequential decisions.",
w:"A — training data is largely accurate; the failure is generative, not corpus-wide. C — no answer caching is involved. D — temperature affects variety, and hallucination occurs even at 0."},

{id:75,d:"D2",s:"Model Selection & Trade-offs",t:"S",f:"H",
