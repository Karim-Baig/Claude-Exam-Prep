e:"Use **multiple breakpoints at stability boundaries**: one after the static system prompt and tools, another advanced to cover conversation history that will not change again. Because history is **append-only**, previously cached prefixes stay valid, so each turn re-reads a long cached region cheaply and pays full price only for the newest turn. This is the canonical way to keep long conversations affordable — and note that a **top-level `cache_control`** field can manage the advancing breakpoint automatically.",
w:"A — leaves the growing history uncached, so cost climbs every turn. C — a breakpoint on the newest message invalidates the prefix each turn, guaranteeing misses. D — long conversations are precisely where caching pays most."},

{id:362,d:"D2",s:"Model Selection & Trade-offs",t:"R",f:"M",
q:"What does an effort setting control on models that support it?",
o:["A. The number of retries","B. How much internal reasoning the model applies before answering, trading tokens and latency for depth","C. The rate limit tier","D. The context window size"],a:1,
e:"An **effort** setting steers **how much reasoning the model invests** before answering — the current mechanism for tuning depth, alongside adaptive thinking, now that manual `budget_tokens` is deprecated. Higher effort helps genuinely hard multi-step problems at the cost of more tokens and latency; lower effort suits simple, high-volume or latency-bound work. Tune it **against your eval set** rather than defaulting to maximum.",
w:"A — retries are a client concern. C — rate limits are account properties. D — the context window is a fixed model property."},

{id:363,d:"D2",s:"Cost & Token Management",t:"S",f:"M",
q:"A team reports \"the model got more expensive\" after adding a large tool catalogue, with no prompt changes. What explains it?",
o:["A. Tool definitions are free","B. Tool schemas are serialised into the prompt and billed as input tokens on **every** request, plus a fixed tool-use system prompt overhead","C. Tools raise the per-token price","D. Only executed tools are billed"],a:1,
e:"**Tool definitions are billed as input tokens on every single call**, whether or not any tool is used, and the API adds a fixed tool-use system prompt of a few hundred tokens on top. A large catalogue of verbose schemas therefore raises the floor cost of every request. Remedies: **scope** tools to the task, **consolidate** related operations, place definitions inside a **cached prefix** (they sit at the front, ideal for caching), and for very large catalogues use **`defer_loading`** with the tool search tool.",
w:"A — the costly misconception. C — per-token pricing is unchanged; token count rose. D — merely offering a tool costs tokens, unless deferred."},

{id:364,d:"D2",s:"Technical Fundamentals",t:"S",f:"H",
q:"A gateway service adds prompt caching centrally for all teams. What must it be careful about?",
o:["A. Nothing — caching is always safe","B. Cache prefixes must not contain tenant- or user-specific content, or one caller's data could sit in a prefix shared with another","C. Caching will slow responses","D. Caching changes model output"],a:1,
e:"Centralised caching is a strong win for genuinely **shared** prefixes — a common system prompt or tool catalogue — but the boundary must be drawn carefully. **Anything tenant- or user-specific must sit outside the cached region**, both to avoid cross-tenant data exposure and because per-user prefixes fragment the cache into entries that rarely reach a read. Cache the shared instruction layer; keep user data and retrieved content beyond the breakpoint.",
w:"A — the isolation question is exactly what makes shared caching non-trivial. C — cache reads are typically faster, not slower. D — caching affects cost, never generated content."},

{id:365,d:"D2",s:"Model Selection & Trade-offs",t:"S",f:"M",
q:"When is a larger context window genuinely the deciding factor in model choice?",
o:["A. Always — bigger is better","B. When the task legitimately requires reasoning across more material than smaller windows hold, and retrieval cannot adequately narrow it","C. For all chat applications","D. When latency matters most"],a:1,
e:"Context size decides only when the task **genuinely needs breadth that retrieval cannot supply** — analysing a whole codebase for cross-cutting concerns, or reasoning over a long document where relevance cannot be localised. Where retrieval *can* narrow the material, it is usually **cheaper and often more accurate**, since a curated context avoids the attention dilution that comes with volume. Remember that fitting the window and reasoning well over it are different thresholds.",
w:"A — larger windows cost more per call and invite context dilution. C — most chat turns are short; history management matters more than raw window size. D — larger contexts increase latency rather than reducing it."}
);
</script>
<script>
/* ===== D1 · Applications & Integration — batch 4 ===== */
QB.push(
{id:366,d:"D1",s:"Claude API Mechanics",t:"R",f:"M",
q:"Which statement about `max_tokens` is correct?",
o:["A. It is optional and defaults to the model maximum","B. It is required, and setting it above the model's output ceiling returns a 400","C. It is silently clamped to the model ceiling","D. It limits total input plus output tokens"],a:1,
e:"**`max_tokens` is required on every Messages request**, and a value above the model's output ceiling is **rejected with a 400** at validation — there is no silent clamping, so a value valid on one model can fail on another after a model switch. Keep it distinct from the **context window**, which bounds input and output together and produces `model_context_window_exceeded` if generation fills it.",
w:"A — omitting it is a 400; Anthropic deliberately makes the output cap explicit. C — no clamping occurs. D — that describes the context window, not `max_tokens`."},

{id:367,d:"D1",s:"Error Handling & Retries",t:"R",f:"M",
q:"What does a `402` response from the Claude API indicate?",
o:["A. The request was malformed","B. A billing or payment-information problem","C. The API is overloaded","D. Rate limit exceeded"],a:1,
e:"**402 `billing_error`** signals a problem with billing or payment information. It is worth distinguishing from the neighbouring cases that also relate to spend: an **org or workspace spend limit you configured** returns **400**, and a **usage-tier monthly cap** returns **429**. Read `error.type` and `error.message` rather than inferring from the status code alone, since several conditions map onto overlapping codes.",
w:"A — that is 400 `invalid_request_error`. C — that is 529 `overloaded_error`. D — that is 429 `rate_limit_error`."},

{id:368,d:"D1",s:"Streaming",t:"R",f:"M",
q:"Which field on `content_block_delta` tells you which content block the fragment belongs to?",
o:["A. `id`","B. `index`","C. `block_id`","D. `sequence`"],a:1,
e:"**`index`** identifies the content block a delta belongs to, and it appears on `content_block_start`, `content_block_delta` and `content_block_stop`. Because a response can carry several blocks — thinking, text, and tool_use — deltas from different blocks are **interleaved in the stream and distinguished only by index**. Maintain a **per-index accumulator**; appending everything into one buffer is a classic bug that produces duplicated or jumbled output.",
w:"A — `id` identifies the message, not the block position. C/D — not real fields on these events."},

{id:369,d:"D1",s:"Batch API",t:"R",f:"M",
q:"What are the documented size limits for a single batch submission?",
o:["A. 1,000 requests or 10 MB","B. 100,000 requests or 256 MB, whichever is reached first","C. Unlimited","D. 10,000 requests only"],a:1,
e:"A batch may contain up to **100,000 requests or 256 MB**, whichever binds first. Beyond the limits, remember the operational shape: results complete **within 24 hours**, each request needs a **`custom_id`** because results are **not order-guaranteed**, and each result carries its own status — `succeeded`, `errored`, `canceled`, or `expired` — so partial failure inside a completed batch is normal and must be handled.",
w:"A/D — understate the limits substantially. C — there are documented hard limits."},

{id:370,d:"D1",s:"Vision & Multimodal",t:"R",f:"M",
q:"Which image `source` types does the Messages API accept?",
o:["A. `base64` only","B. `base64`, `url`, and `file` (a `file_id` from the Files API)","C. `base64` and `path`","D. `url` only"],a:1,
e:"Three source types: **`base64`** (inline bytes), **`url`** (Anthropic fetches the image), and **`file`** referencing a **`file_id`** from the Files API. Prefer **`file`** in multi-turn or agentic flows — because the API is stateless you resend the whole history each turn, so inline base64 bytes are retransmitted every request. Note that some partner cloud platforms currently support **`base64` only**.",
w:"A — omits two supported types. C — there is no `path` type; the API has no filesystem access. D — base64 is the most common source for local images."},

{id:371,d:"D1",s:"Claude API Mechanics",t:"S",f:"H",
q:"A client resends a conversation after editing a message near the beginning. Cache hit rate collapses. Why?",
o:["A. Editing disables caching for the conversation","B. Caching matches an exact prefix, so a change near the start invalidates every cached region from that point onward","C. The cache TTL resets on edit","D. Edited messages cannot be cached"],a:1,
e:"Caching operates on an **exact prefix from the start of the request**, so a change near the beginning invalidates **everything downstream of it** — the whole cached region must be rewritten. This is inherent to prefix matching, not a defect. Design around it by ordering **most stable content first** (tools, system prompt, settled history) and keeping anything liable to change late in the request.",
w:"A — caching still works; the prefix simply no longer matches. C — TTL is about time, not edits. D — messages are cacheable; the issue is prefix invalidation."},

{id:372,d:"D1",s:"Software Engineering Foundations",t:"R",f:"E",
q:"Which official Anthropic SDKs are available?",
o:["A. Python and TypeScript only","B. Python, TypeScript, C#, Go, Java, PHP and Ruby","C. Python only","D. JavaScript and Ruby only"],a:1,
e:"Official SDKs cover **Python, TypeScript, C#, Go, Java, PHP and Ruby**. Beyond language coverage, the reason to prefer them is what they absorb: **automatic retries with backoff honouring `retry-after`, SSE stream assembly, auth and version headers, typed error classes, timeouts, pagination**, and access to the **`request-id`** for support. Raw HTTP is entirely valid — you simply own that correctness yourself.",
w:"A/C/D — all understate the current language coverage."},

{id:373,d:"D1",s:"Configuration Management",t:"S",f:"M",
q:"A service must switch model versions without redeployment during an incident. What does this require?",
o:["A. Hard-coding the model in the request builder","B. The model identifier held in runtime configuration or a feature flag, readable without a code change","C. A separate deployment per model","D. Automatic model selection by the API"],a:1,
e:"Treat the **model identifier as runtime configuration** — a config value or feature flag — so you can fail over during an incident without a build and deploy cycle. This matters because model choice is exactly the kind of change you may need under time pressure. It also pairs with the rollback lesson: since prompt and model config drive behaviour, a **code** rollback alone may not undo a regression that shipped through config.",
w:"A — requires a deployment to change, which is the problem. C — heavyweight and slow, exactly what an incident cannot afford. D — the API does not choose models for you; you name one explicitly."},

{id:374,d:"D1",s:"Understanding Requirements",t:"S",f:"H",
q:"A requirement reads: \"the assistant should never make things up.\" How should this be translated into engineering terms?",
o:["A. Set `temperature: 0` and consider it solved","B. Ground answers in retrieved sources, require citations verified against what was actually retrieved, license the model to say it does not know, and route low-confidence cases to human review","C. Use the largest available model","D. Explain that the requirement is impossible and drop it"],a:1,
e:"\"Never make things up\" is a **grounding requirement**, and it decomposes into concrete mechanisms: **retrieve** relevant sources and constrain the model to them, **verify citations** by checking that referenced ids exist in the retrieved set (which catches fabricated references), **explicitly permit \"I don't know\"** so abstention is an available behaviour rather than gap-filling, and **escalate low-confidence cases** to humans. No single control eliminates hallucination, so layer them and measure the residual rate.",
w:"A — reduces variance, not groundlessness; a model hallucinates at low temperature too. C — capability reduces but does not remove the failure mode. D — the intent is legitimate and largely achievable; the job is to translate it."},

{id:375,d:"D1",s:"Systems Life Cycle",t:"S",f:"M",
q:"Which artefacts should be version-controlled alongside application code for an LLM feature?",
o:["A. Only the source code","B. Prompts, tool and output schemas, model identifiers, and the eval suite with its expected results","C. Only the eval suite","D. Nothing beyond code; prompts are configuration"],a:1,
e:"Everything that **determines behaviour** belongs in version control: **prompts** (behavioural code), **tool and output schemas** (interface contracts), the **model identifier** in use, and the **eval suite with expected results**. Together these make behaviour changes reviewable, attributable to a commit, and revertible. Environment-specific values such as credentials and tuning knobs remain configuration — the distinction is *defines behaviour* versus *varies by environment*.",
w:"A — leaves the highest-churn behavioural artefact untracked. C — evals without versioned prompts cannot attribute a regression. D — treating prompts as untracked config is how silent quality regressions ship."},

{id:376,d:"D1",s:"Deployment Platforms",t:"R",f:"M",
q:"Which is true of image inputs on partner cloud platforms such as Amazon Bedrock and Google Cloud?",
o:["A. All three source types are supported identically","B. Only `base64` image sources are currently available there","C. Images are unsupported","D. Only `url` sources are available"],a:1,
e:"On those partner platforms, image inputs currently support **`base64` only** — `url` and Files API `file_id` sources are not available. This is a concrete instance of the general porting lesson: **message semantics carry over, but feature availability and platform plumbing differ**, alongside distinct authentication, model identifier formats, region configuration and request-size limits. Verify feature parity before assuming a first-party integration ports unchanged.",
w:"A — parity is exactly what does not hold. C — vision works; only the source types are narrower. D — inverted; base64 is the supported one."},

{id:377,d:"D1",s:"Claude Application Design",t:"S",f:"H",
q:"A product must support conversation branching, where a user explores two alternative replies from the same point. What does the state model need?",
o:["A. A single linear message array","B. A tree of message states, where each branch is a distinct history the client can send independently","C. Server-side branch storage in the API","D. Two separate API keys"],a:1,
e:"Because the API is **stateless and evaluates only what a request contains**, branching is purely a client-side state design: hold conversation history as a **tree**, where each branch is an independent linear history you can send as its own request. Note the caching consequence — branches **share the prefix up to the divergence point**, so that shared region stays cached, while each branch pays cache-write cost for its own continuation.",
w:"A — a linear array cannot represent two alternative continuations. C — no server-side conversation storage exists. D — keys are unrelated to conversation structure."},

{id:378,d:"D1",s:"Error Handling & Retries",t:"S",f:"M",
q:"Which errors should increment an alert-worthy metric rather than being silently retried?",
o:["A. All errors equally","B. Persistent 4xx client errors, and 429/529 rates that stay elevated — the first signals a defect, the second signals capacity or throughput problems","C. Only 500 errors","D. None; retries handle everything"],a:1,
e:"Alert on the two patterns that indicate something needs human attention. **Persistent 4xx** means a real defect — malformed requests, bad credentials, wrong endpoint — which retries will never resolve and which should fail fast and loudly. **Sustained elevated 429/529** means you are throttled or the service is saturated, calling for client-side pacing, queueing, or capacity planning. Transient blips that backoff absorbs are noise, so alert on **rate and duration**, not individual occurrences.",
w:"A — undifferentiated alerting produces fatigue and buries the signal. C — 500s matter, but 4xx and sustained throttling are equally actionable. D — retries mask defects rather than resolving them."},

{id:379,d:"D1",s:"Streaming",t:"S",f:"M",
q:"A client must show token usage after a streamed response completes. Where does it come from?",
o:["A. `message_start` only","B. The cumulative output usage arrives in `message_delta`, with initial usage in `message_start`","C. It is unavailable when streaming","D. Only from a separate `count_tokens` call"],a:1,
e:"**`message_start`** carries the initial usage (input tokens), and **`message_delta`** carries the **final cumulative output usage** together with `stop_reason`. This is why `message_delta` is the event to capture for cost accounting and truncation detection — `message_stop` is a bare terminator with no payload. Streaming gives you the same accounting as a buffered response; you just collect it from events rather than one body.",
w:"A — output usage is not final at the start, before generation has occurred. C — usage is fully available when streaming. D — an unnecessary extra call, and it counts input only."},

{id:380,d:"D1",s:"Claude API Mechanics",t:"S",f:"H",
q:"An integration works with one tool but fails intermittently when several tools may be called. What is the most likely defect?",
o:["A. The API does not support multiple tools","B. The client handles only the first `tool_use` block, leaving others unanswered — which is a 400 on the next request","C. Tool definitions exceed a size limit","D. `tool_choice` must be set to `any`"],a:1,
e:"An assistant turn can contain **several `tool_use` blocks**, and **every one must be answered** with a matching `tool_result` (keyed by `tool_use_id`) in the immediately following `user` message — an unanswered id produces a **400**. Code written against the single-tool case typically processes `content[0]` or breaks after the first match, which works until the model genuinely parallelises. Iterate **all** `tool_use` blocks, execute them concurrently, and return all results in one turn.",
w:"A — multiple and parallel tool use is fully supported. C — plausible at extreme scale but not the intermittent pattern described. D — `any` forces a call; it does not fix result pairing."},

{id:381,d:"D1",s:"Software Engineering Foundations",t:"S",f:"M",
q:"Why should unit tests mock the Claude API rather than calling it?",
o:["A. To avoid violating the terms of service","B. To keep tests fast, deterministic, free and offline, and to focus them on the logic you control — request construction, `stop_reason` branching, parsing and error handling","C. Because the API cannot be called from CI","D. Because mocked responses are more accurate"],a:1,
e:"Unit tests should verify **your** logic deterministically: that requests are built correctly, that each `stop_reason` branch behaves, that `tool_result` pairing is right, that retries and error paths work, and that parsing handles malformed output. Mocking makes this **fast, free, offline and repeatable**. Model output *quality* is a separate concern, measured by a smaller **eval suite** against the live API on a schedule — conflating the two gives you slow, flaky, expensive tests.",
w:"A — testing against the API is permitted; the reasons are practical. C — CI can reach the API; you generally should not on every commit. D — mocks are not accurate, they are controlled, which is the point for unit tests."},

{id:382,d:"D1",s:"Understanding Requirements",t:"S",f:"M",
q:"A requirement says results must be \"auditable.\" What does that imply for the integration?",
o:["A. Logging the final answer only","B. A durable record linking each output to its inputs, retrieved sources, model identifier, prompt version and `request-id`","C. Storing the API key with each record","D. Streaming responses so users see them form"],a:1,
e:"Auditability means being able to **reconstruct and defend a decision later**, which requires linking each output to the **inputs** it was based on, the **sources retrieved**, the **model identifier and prompt version** in effect, and the **`request-id`** for provider-side traceability. Together those answer \"why did the system say this, and what produced it?\" months afterwards. Redact PII before storage and apply retention limits so the audit trail does not itself become a liability.",
w:"A — the answer without its provenance is not auditable. C — storing credentials in records is a security error, not an audit control. D — a presentation choice with no audit value."},

{id:383,d:"D1",s:"Systems Life Cycle",t:"S",f:"H",
q:"A model the service pins to is scheduled for retirement. What is the appropriate response?",
o:["A. Continue using it until it stops working","B. Plan a migration — evaluate the successor against the existing eval suite, compare per category, then roll out behind a flag before the deadline","C. Switch immediately without evaluation","D. Build an abstraction that supports every model simultaneously"],a:1,
e:"Model retirement is a **scheduled dependency upgrade**, so treat it as one: run the **existing eval suite** against the successor, **compare per category** to see what improved and what regressed, fix prompts where behaviour shifted, then **roll out behind a flag** with monitoring and fast rollback — all comfortably before the deadline. This is exactly why keeping a versioned eval suite pays off: without it, a forced migration becomes a blind change.",
w:"A — turns a planned change into an outage. C — abandons the safety net precisely when it is most needed. D — over-engineering; support the versions you actually run."},

{id:384,d:"D1",s:"Configuration Management",t:"R",f:"M",
q:"What is the `metadata` field on a Messages request used for?",
o:["A. Storing conversation history","B. Attaching request metadata such as a `user_id`, which supports abuse monitoring and per-user attribution","C. Defining tools","D. Setting the system prompt"],a:1,
e:"**`metadata`** carries request-level metadata — notably a **`user_id`** — supporting abuse monitoring and per-user attribution. Two cautions: it is **not** a state mechanism, since the API remains stateless and nothing is linked between calls for you, and the identifier should be an **opaque, non-identifying value** rather than an email or name, so you are not transmitting PII unnecessarily.",
w:"A — history goes in `messages`; the API stores nothing between calls. C — tools have their own top-level parameter. D — the system prompt is the top-level `system` parameter."},

{id:385,d:"D1",s:"Vision & Multimodal",t:"S",f:"M",
q:"A workflow analyses multi-page PDFs. What should be checked before designing page-to-image conversion?",
o:["A. Nothing; conversion is always required","B. Whether native document support covers the case, since it avoids a conversion step and has its own documented size and page limits","C. Whether PDFs can be sent as plain text","D. Whether the PDF is under 1 MB"],a:1,
e:"Check for **native document support** first — it removes an entire conversion stage, along with the rendering fidelity and coordinate problems that come with it. Documented **request-size and page-count limits** apply, and the effective page allowance varies with the context window in play, so verify your documents fit. Fall back to page-to-image conversion when a document exceeds those limits or needs per-page control, sizing images to the model's resolution limit.",
w:"A — assumes conversion without checking the simpler path. C — extracting text discards layout, tables and figures that often carry the meaning. D — an invented threshold; consult the documented limits."}
);
</script>
<script>
/* ===== D3 · Agents & Workflows — batch 3 ===== */
QB.push(
{id:386,d:"D3",s:"Agent Architecture",t:"R",f:"M",
q:"What is the defining characteristic of the augmented-LLM building block underlying most agents?",
o:["A. A model fine-tuned on agent traces","B. A model augmented with retrieval, tools and memory, invoked in a loop that feeds results back in","C. Several models voting","D. A model with a larger context window"],a:1,
e:"The **augmented LLM** is the atomic unit: a model given **retrieval** (to fetch relevant information), **tools** (to act on the world), and **memory** (to carry state), invoked in a loop that returns results into context. Every **workflow** pattern — prompt chaining, routing, parallelisation, orchestrator-workers, evaluator-optimiser — and the **agent loop** itself are compositions of this block. Recognising it clarifies that capability comes from the **loop and the augmentations**, not from a special kind of model.",
w:"A — no fine-tuning is involved; augmentation happens at request time. C — that is ensembling, a different technique. D — window size is a capacity property, not an architecture."},

{id:387,d:"D3",s:"Agent Construction with Claude",t:"S",f:"H",
q:"An agent must not exceed a £5 budget per task. How is that enforced?",
o:["A. Instruct the model to be economical in the system prompt","B. Track cumulative token cost from each response's `usage` and terminate the loop when the ceiling is reached, returning partial results with a clear reason","C. Set `max_tokens` low","D. Use the cheapest model"],a:1,
e:"A hard budget must be enforced by **the loop, not the model**: accumulate cost from each response's **`usage`** (including cache read/write fields), check it against the ceiling before each iteration, and **terminate with a distinguishable reason** — returning partial results and an explanation rather than silently stopping. The model cannot see its own spend, so any instruction to \"be economical\" is unenforceable. Log the termination reason so budget exhaustion is visible in telemetry.",
w:"A — the model has no visibility of cumulative cost. C — bounds one response, not the number of iterations. D — reduces the rate but sets no ceiling."},

{id:388,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"M",
q:"A workflow generates a draft, then a second call checks it against a rubric and returns revisions. Which pattern is it, and what bounds it?",
o:["A. Routing; bounded by category count","B. Evaluator-optimiser; bounded by an explicit iteration cap and a pass condition","C. Parallelisation; bounded by worker count","D. Orchestrator-workers; bounded by subtask count"],a:1,
e:"This is **evaluator-optimiser** — generate, critique against explicit criteria, revise, repeat. It needs **two bounds**: a **pass condition** defining what \"good enough\" means against the rubric, and a **hard iteration cap** so a candidate that never satisfies the evaluator cannot loop indefinitely. It works best where quality is **checkable against stated criteria**, and is strongest when the evaluator is objective — a test suite rather than a model judgement.",
w:"A — no classification or dispatch occurs. C — the steps are sequential, not concurrent. D — there is no dynamic decomposition into subtasks."},

{id:389,d:"D3",s:"Agent Architecture",t:"S",f:"H",
q:"An agent is deployed with tools that can read a database and post to a public status page. What separation is advisable?",
o:["A. None; one agent is simpler","B. Split so the component reading untrusted or sensitive data does not also hold the outbound publish capability, and require approval on any publish","C. Use two API keys","D. Lower the temperature on publish operations"],a:1,
e:"Read access to sensitive data combined with an **outbound public channel** is a complete exfiltration path — an injection that reaches the reading component could publish what it finds. **Separate the trust domains** so no single component both reads sensitive data and publishes externally, pass **structured, validated data** across the boundary rather than free text, and require **human approval** on publish, which is irreversible and externally visible.",
w:"A — simplicity here creates a serious exposure. C — separate keys aid attribution but do not separate capability. D — sampling settings are irrelevant to blast radius."},

{id:390,d:"D3",s:"Agent Construction with Claude",t:"S",f:"M",
q:"Why should an agent's tool results include what was searched, not just what was found?",
o:["A. It makes logs prettier","B. It lets the model judge whether the absence of results is meaningful, so it can broaden, switch approach, or correctly report infeasibility instead of retrying blindly","C. It reduces token cost","D. It is required by the API"],a:1,
e:"Stating **what was searched and over what scope** turns an empty result from an ambiguous signal into evidence. \"No matches for 'Q3 revenue' in the 2024 filings index, which covers annual reports only\" tells the model the coverage boundary, so it can broaden the query, choose a different source, or conclude the goal is unreachable. A bare empty set gives it nothing to reason from, which is why blind retry loops are so common.",
w:"A — the benefit is behavioural, not cosmetic. C — it slightly increases tokens, and is worth it. D — no API requirement; it is a design practice."},

{id:391,d:"D3",s:"Agent Patterns & Frameworks",t:"R",f:"M",
q:"In orchestrator-workers, what distinguishes it from simple parallelisation?",
o:["A. It runs faster","B. The orchestrator decides the decomposition dynamically at runtime, whereas parallelisation splits a task along boundaries fixed in advance","C. It uses more tools","D. Workers cannot run concurrently"],a:1,
e:"The distinction is **who determines the split, and when**. **Parallelisation** divides work along boundaries you fixed in code — ten known policies, each checked independently. **Orchestrator-workers** has the model **decompose at runtime**, because the number and nature of subtasks depend on the specific input. A classification point worth getting right: Anthropic still counts orchestrator-workers as a **workflow**, not an agent — what makes a system an *agent* is the LLM **directing its own process and tool usage**, not an orchestrator splitting work into subtasks.",
w:"A — orchestration adds overhead; speed is not the differentiator. C — tool count is incidental. D — workers commonly do run concurrently in both patterns."},

{id:392,d:"D3",s:"Agent Architecture",t:"S",f:"H",
q:"An agent's telemetry shows most tasks finishing in 4 iterations but a long tail reaching the 25-iteration cap. What should be investigated first?",
o:["A. Raise the cap to 50","B. Examine the capped runs' trajectories — repeated tool calls, uninformative results, or ambiguous goals — since hitting the cap signals non-convergence, not insufficient headroom","C. Switch to a larger model","D. Reduce the cap to 10"],a:1,
e:"A bimodal distribution means those tasks are **not converging**, and the cap is merely where they stop. Inspect the capped **trajectories**: repeated near-identical tool calls point to uninformative results, ping-ponging between tools points to ambiguous descriptions, and no clear progress points to an underspecified goal or missing capability. Raising the cap would only make failures **more expensive**, not more successful.",
w:"A — spends more to reach the same non-convergence. C — capability may help marginally, but the cause is usually tool or goal design. D — fails sooner without diagnosing why."},

{id:393,d:"D3",s:"Agent Construction with Claude",t:"S",f:"M",
q:"An agent must summarise its own work for a human reviewer at the end. What should the final step be?",
o:["A. Return the raw message history","B. A final call with `tool_choice: \"none\"`, asking for a structured summary of what was done, what was found, and what remains uncertain","C. Concatenate all tool results","D. Return only the last tool result"],a:1,
e:"Use a **dedicated synthesis turn with `tool_choice: \"none\"`**, which lets the model draw on everything it gathered while **preventing it from fetching more** — cleanly closing the loop. Ask for a **structured summary**: actions taken, findings, and explicitly what remains uncertain. That last element matters most for a reviewer, because knowing where the agent was unsure is what directs human attention efficiently.",
w:"A — raw history is unreadable and buries the conclusions. C — concatenated tool output is data, not synthesis. D — the last result is rarely the whole picture."},

{id:394,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"H",
q:"A team's agent works well in testing but behaves erratically on real user requests. What is the most likely gap?",
o:["A. The production model is different","B. Test tasks were well-specified while real requests are ambiguous, underspecified or out of scope — and the agent has no defined behaviour for those cases","C. Production has higher latency","D. The iteration cap is too low"],a:1,
e:"Test tasks are unconsciously written to be **answerable**; real users ask vague, out-of-scope or self-contradictory questions. Without a defined path for those, the agent's default is to **proceed anyway** — guessing, or wandering through tools. Define the behaviours explicitly: **ask a clarifying question**, return a `needs_clarification` status naming what is missing, or report that the request is out of scope — and include **few-shot examples of those paths**, since an unmodelled behaviour will not be exhibited.",
w:"A — worth ruling out, but the specification gap is far more common. C — latency does not cause erratic behaviour. D — a low cap truncates work; it does not explain erratic handling."},

{id:395,d:"D3",s:"Agent Architecture",t:"R",f:"M",
q:"What is the main cost of the orchestrator-workers pattern relative to a single agent?",
o:["A. It cannot use tools","B. Higher total token spend and coordination overhead, traded for context isolation, parallelism and specialised sub-agents","C. It requires a larger context window","D. It cannot be logged"],a:1,
e:"Orchestration is a **deliberate trade**: total tokens rise, since the orchestrator and each worker carry their own context and the hand-offs cost tokens, and you take on coordination complexity — including **reconciling conflicting worker findings**. What you buy is **context isolation** (bulky material never reaches the orchestrator), **parallelism** on independent subtasks, and **specialised, least-privilege sub-agents**. Worth it for genuinely decomposable work; wasteful for a task one agent handles.",
w:"A — workers typically use tools heavily. C — each participant has its own window, which is the point. D — it is loggable, and should be logged per sub-agent."},

{id:396,d:"D3",s:"Agent Construction with Claude",t:"S",f:"M",
q:"How should an agent handle a tool that returns a permission-denied error?",
o:["A. Retry the same call repeatedly","B. Return a structured error identifying it as a non-retryable authorisation failure, so the agent reports or escalates rather than looping","C. Return an empty successful result","D. Terminate the whole run silently"],a:1,
e:"Permission denial is **deterministic and non-retryable**, so the error envelope must say so — category (authorisation), retryability (no), and any alternative available. That lets the agent stop attempting it and instead **report or escalate**. Contrast the failure modes: retrying wastes the budget on something that cannot succeed, and returning a **fake success** is the worst option, because every subsequent step then reasons from a false premise.",
w:"A — deterministic failures never resolve on retry. C — fabricating success corrupts the agent's reasoning. D — silent termination hides an actionable, fixable condition."},

{id:397,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"H",
q:"Which factor most strongly argues for a workflow over an agent in a regulated environment?",
o:["A. Workflows are cheaper","B. Determinism and auditability — a fixed path is reproducible, testable and explainable in a way a dynamically-chosen one is not","C. Workflows use fewer tools","D. Agents cannot access databases"],a:1,
e:"In regulated settings the decisive property is usually **explainability and reproducibility**: a fixed path can be documented, tested exhaustively, and defended to an auditor, and identical inputs yield identical control flow. An agent choosing its own path is harder to characterise and to prove bounded. Cost and speed are real advantages too, but **auditability** is what makes the argument in a compliance context — and it is why hybrids keep determinism wherever the path is knowable.",
w:"A — true and relevant, but secondary to the compliance argument. C — tool count is not the distinction. D — agents access databases routinely."},

{id:398,d:"D3",s:"Agent Architecture",t:"S",f:"M",
q:"An agent must hand off to a human when it cannot proceed. What makes the hand-off effective?",
o:["A. Transferring the raw conversation log","B. A structured summary — the goal, what was attempted, what was found, the specific blocker, and what decision is needed from the human","C. An email saying the agent failed","D. Retrying until a human notices"],a:1,
e:"An effective hand-off is designed for **the human's decision**, not the agent's convenience. State the **goal**, what was **attempted** and found, the **specific blocker**, and precisely **what decision or information is needed**. That lets a human resolve it in seconds rather than reconstructing the situation from a transcript. Preserve the underlying trace for those who want it, but lead with the structured summary.",
w:"A — forces the human to do the reconstruction the agent should have done. C — conveys failure without any actionable context. D — not a hand-off; the work simply stalls."},

{id:399,d:"D3",s:"Agent Construction with Claude",t:"S",f:"H",
q:"An agent's context is filling with verbose tool results. Which combination of fixes is most effective?",
o:["A. Raise `max_tokens`","B. Return narrower tool projections, compact settled history into structured summaries, and delegate bulky exploration to subagents","C. Disable tools","D. Switch to a larger context model only"],a:1,
e:"Attack it at all three points where context accumulates. **At the tool**: return a narrow projection plus a reference id rather than raw payloads. **In the history**: compact completed work into structured summaries while keeping recent turns verbatim. **In the architecture**: delegate bulky exploration to **subagents** that absorb the volume in their own context and return a distilled result. A larger window alone postpones the limit at higher cost, and does nothing about attention dilution.",
w:"A — governs output length, not the accumulating input. C — removes the capability the agent depends on. D — buys headroom without addressing why context is filling."},

{id:400,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"M",
q:"A task requires the same check applied to 50 independent records, then an aggregate report. Which structure fits?",
o:["A. One agent iterating through all 50 sequentially","B. Parallelised checks across the records, followed by an aggregation step over the collected results","C. Orchestrator-workers with dynamic decomposition","D. Evaluator-optimiser"],a:1,
e:"The records are **independent and the decomposition is known in advance**, which is exactly **parallelisation by sectioning**: run the 50 checks concurrently, then aggregate. Wall-clock time approaches that of a single check, and each check gets a **focused prompt** rather than one call juggling 50 records. Orchestrator-workers would be over-engineering here, since nothing needs deciding at runtime — the split is already fixed.",
w:"A — correct but needlessly slow, taking 50× the wall-clock time. C — dynamic decomposition solves a problem this task does not have. D — no generate-and-critique loop is involved."}
);
</script>

  return text
    // ordered longest-pattern-first so composite refs are consumed whole
    .replace(/\b([A-D]), ([A-D]),? and ([A-D])\b/g,(m,a,b,c)=>ph(a)+", "+ph(b)+", and "+ph(c))
    .replace(/\b([A-D])\/([A-D])\/([A-D])\b/g,(m,a,b,c)=>ph(a)+"/"+ph(b)+"/"+ph(c))
    .replace(/\b([A-D])\/([A-D])\b/g,(m,a,b)=>ph(a)+"/"+ph(b))
    .replace(/([Oo]ption )([A-D])\b/g,(m,p,L)=>p+ph(L))
    .replace(/\b([A-D])(?=\s*—)/g,(m,L)=>ph(L))
    .replace(/␀(\d)␀/g,(m,n)=>LTR[+n]);
}

/* ---------- filtering ---------- */
function pool(){
  const d=$("#fDom").value,sb=$("#fSub").value,df=$("#fDiff").value,ty=$("#fType").value;
  const q=$("#fSearch").value.trim().toLowerCase();
  return QB.filter(x=>{
    if(d&&x.d!==d)return 0;
    if(sb&&x.s!==sb)return 0;
    if(df&&x.f!==df)return 0;
    if(ty&&x.t!==ty)return 0;
    if(q&&!(x.q+" "+x.e+" "+x.o.join(" ")).toLowerCase().includes(q))return 0;
    return 1;
  });
}
function domAcc(){
  const m={};
  for(const k in DOM)m[k]={c:0,n:0};
  for(const id in S.hist){
    const h=S.hist[id],q=QB.find(x=>x.id==id);
    if(!q||!h.n)continue;
    m[q.d].n+=h.n; m[q.d].c+=h.c;
  }
  return m;
}
function weakDoms(){
  const a=domAcc(),out=[];
  for(const k in a) if(a[k].n>=4 && a[k].c/a[k].n<0.75) out.push(k);
  return out;
}
function build(){
  let p=pool();
  if(set==="bm")     p=p.filter(x=>S.bm.includes(x.id));
  if(set==="wrong")  p=p.filter(x=>S.hist[x.id]&&S.hist[x.id].n>S.hist[x.id].c);
  if(set==="unseen") p=p.filter(x=>!S.hist[x.id]);
  if(set==="weak"){const w=weakDoms();p=w.length?p.filter(x=>w.includes(x.d)):p.filter(x=>S.hist[x.id]&&S.hist[x.id].n>S.hist[x.id].c);}
  if(shuffled)for(let k=p.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[p[k],p[j]]=[p[j],p[k]];}
  list=p; i=0; picked=null; flipped=false;
}

/* ---------- record ---------- */
function record(q,ok){
  const h=S.hist[q.id]||(S.hist[q.id]={n:0,c:0});
  h.n++; if(ok)h.c++; h.last=ok?1:0; save(); chips();
}

/* ---------- chips + counters ---------- */
function chips(){
  let n=0,c=0;
  for(const id in S.hist){n+=S.hist[id].n;c+=S.hist[id].c;}
  $("#chipScore").innerHTML=n?`<b>${Math.round(c/n*100)}%</b> · ${c}/${n}`:"No attempts yet";
  $("#chipBank").innerHTML=`<b>${QB.length}</b> questions`;
  const p=pool();
  $("#cAll").textContent=p.length;
  $("#cBm").textContent=p.filter(x=>S.bm.includes(x.id)).length;
  $("#cWrong").textContent=p.filter(x=>S.hist[x.id]&&S.hist[x.id].n>S.hist[x.id].c).length;
  $("#cUnseen").textContent=p.filter(x=>!S.hist[x.id]).length;
  const w=weakDoms();
  $("#cWeak").textContent=w.length?p.filter(x=>w.includes(x.d)).length:0;
}

/* ---------- render: practice / exam ---------- */
function metaRow(q,n,tot){
  return `<div class="meta">
   <span class="tag dom">${q.d} · ${DOM[q.d].n}</span>
   <span class="tag sub">${esc(q.s)}</span>
   <span class="tag ${q.f}">${{E:"Easy",M:"Medium",H:"Hard"}[q.f]}</span>
   <span class="tag ty">${q.t==="S"?"Scenario":"Recall"}</span>
   <span class="qnum">Q ${n} / ${tot} &nbsp;·&nbsp; #${q.id}</span></div>`;
}
function renderQ(){
  if(!list.length){view.innerHTML=`<div class="empty"><h3>Nothing in this set</h3><p>Loosen the filters or pick another study set.</p></div>`;return;}
  const q=list[i], ex=mode==="exam";
  const P=prep(q);
  const show = picked!==null && !ex;
  let h=`<div class="pbar"><i style="width:${(i+1)/list.length*100}%"></i></div>`;
  if(ex)h+=examBar();
  h+=metaRow(q,i+1,list.length);
  h+=`<div class="qtext">${fmt(q.q)}</div><div class="opts">`;
  P.opts.forEach((o,k)=>{
    let cls="opt";
    if(ex){ if(exam.ans[q.id]===k)cls+=" sel"; }
    else if(show){ cls+=" dis"; if(k===P.ans)cls+=" right"; else if(k===picked)cls+=" wrong"; }
    h+=`<button class="${cls}" data-k="${k}"><span class="k">${LTR[k]}</span><span>${fmt(o)}</span>${
      show&&k===P.ans?'<span class="mk" style="color:var(--ok)">✓</span>':
      show&&k===picked?'<span class="mk" style="color:var(--bad)">✕</span>':""}</button>`;
  });
  h+=`</div>`;
  if(show){
    const ok=picked===P.ans;
    h+=`<div class="exp ${ok?"good":"poor"}"><div class="hd">${ok?"✓ Correct":"✕ Incorrect — correct answer is "+LTR[P.ans]}</div>
      <div class="bd">${fmt(P.e)}${P.w?`<div class="why"><b>Why the others fail:</b> ${fmt(P.w)}</div>`:""}</div></div>`;
  }
  const bm=S.bm.includes(q.id);
  h+=`<div class="nav">
    <button id="pv" ${i===0?"disabled":""}>← Prev</button>
    <button id="nx" class="pri" ${i>=list.length-1&&!ex?"disabled":""}>${ex&&i>=list.length-1?"Submit exam":"Next →"}</button>
    <button class="bmk ${bm?"on":""}" id="bm">${bm?"★ Bookmarked":"☆ Bookmark"}</button></div>`;
  view.innerHTML=h;

  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(ex){exam.ans[q.id]=k;renderQ();return;}
    if(picked!==null)return;
    picked=k; record(q,k===P.ans); renderQ();
  });
  $("#pv").onclick=()=>{if(i>0){i--;picked=null;renderQ()}};
  $("#nx").onclick=()=>{
    if(ex&&i>=list.length-1){finishExam();return}
    if(i<list.length-1){i++;picked=null;renderQ()}
  };
  $("#bm").onclick=()=>{
    const k=S.bm.indexOf(q.id);
    if(k<0)S.bm.push(q.id);else S.bm.splice(k,1);
    save();chips();renderQ();
  };
}

/* ---------- flashcards ---------- */
function renderCard(){
  if(!list.length){view.innerHTML=`<div class="empty"><h3>Nothing in this set</h3></div>`;return}
  const q=list[i], P=prep(q);
  let h=`<div class="pbar"><i style="width:${(i+1)/list.length*100}%"></i></div>`+metaRow(q,i+1,list.length);
  h+=`<div class="fc" id="fc"><div class="lbl">${flipped?"Answer & concept":"Concept prompt — click to reveal"}</div>
    <div class="fq">${fmt(q.q)}</div>`;
  if(flipped)h+=`<div class="ans">${fmt(P.opts[P.ans])}</div>
    <div class="ex">${fmt(P.e)}${P.w?`<div class="ex" style="margin-top:10px;opacity:.85"><b>Why the others fail:</b> ${fmt(P.w)}</div>`:""}</div>`;
  h+=`</div><div class="hint">${flipped?"Space / click = next card":"Space / click = flip"}</div>`;
  const bm=S.bm.includes(q.id);
  h+=`<div class="nav"><button id="pv" ${i===0?"disabled":""}>← Prev</button>
    <button id="nx" class="pri">${flipped?"Next card →":"Reveal"}</button>
    <button class="bmk ${bm?"on":""}" id="bm">${bm?"★ Bookmarked":"☆ Bookmark"}</button></div>`;
  view.innerHTML=h;
  const adv=()=>{if(!flipped){flipped=true}else{flipped=false;if(i<list.length-1)i++;}renderCard()};
  $("#fc").onclick=adv; $("#nx").onclick=adv;
  $("#pv").onclick=()=>{if(i>0){i--;flipped=false;renderCard()}};
  $("#bm").onclick=()=>{const k=S.bm.indexOf(q.id);if(k<0)S.bm.push(q.id);else S.bm.splice(k,1);save();chips();renderCard()};
}

/* ---------- exam simulator ---------- */
function examBar(){
  const left=Math.max(0,exam.end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  const answered=Object.keys(exam.ans).length;
  return `<div class="exambar">🎯 <b>Exam simulation</b> · 53 questions · blueprint-weighted · pass = 720/1000
   <span style="color:var(--tx2)">Answered <b style="color:var(--tx)">${answered}/53</b></span>
   <span class="timer ${left<600000?"low":""}" id="tmr">${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</span></div>`;
}
function startExam(){
  // blueprint-weighted sample of 53
  const want={};let tot=0;
  for(const k in DOM){want[k]=Math.round(DOM[k].w/100*53);tot+=want[k]}
  const ks=Object.keys(DOM); let g=0;
  while(tot<53){want[ks[g++%ks.length]]++;tot++}
  while(tot>53){if(want[ks[g%ks.length]]>1){want[ks[g%ks.length]]--;tot--}g++}
  let pick=[];
  for(const k in want){
    const c=QB.filter(x=>x.d===k);
    for(let j=c.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[c[j],c[r]]=[c[r],c[j]]}
    pick=pick.concat(c.slice(0,want[k]));
  }
  for(let j=pick.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[pick[j],pick[r]]=[pick[r],pick[j]]}
  exam={ans:{},end:Date.now()+120*60000};
  list=pick;i=0;picked=null;
  clearInterval(window._t);
  window._t=setInterval(()=>{
    if(mode!=="exam"||!exam){clearInterval(window._t);return}
    const el=$("#tmr");if(!el)return;
    const left=exam.end-Date.now();
    if(left<=0){finishExam();return}
    const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
    el.className="timer"+(left<600000?" low":"");
  },1000);
  renderQ();
}
function finishExam(){
  clearInterval(window._t);
  let c=0;const per={};
  for(const k in DOM)per[k]={c:0,n:0};
  list.forEach(q=>{
    const ok=exam.ans[q.id]===prep(q).ans;
    if(ok)c++;
    per[q.d].n++;if(ok)per[q.d].c++;
    record(q,ok);
  });
  const scaled=Math.round(c/list.length*1000);
  const pass=scaled>=720;
  let h=`<h2 class="sec">Exam result</h2>
  <div class="grid">
   <div class="stat ${pass?"ok":"bad"}"><div class="n">${scaled}</div><div class="l">Scaled score / 1000</div></div>
   <div class="stat pri"><div class="n">${c}/${list.length}</div><div class="l">Correct</div></div>
   <div class="stat ${pass?"ok":"bad"}"><div class="n">${pass?"PASS":"FAIL"}</div><div class="l">Cut score 720</div></div>
   <div class="stat warn"><div class="n">${Math.round(c/list.length*100)}%</div><div class="l">Accuracy</div></div>
  </div>
  <h2 class="sec">Domain breakdown</h2><div class="panel"><table><thead><tr>
  <th>Domain</th><th>Weight</th><th>Score</th><th style="width:130px">Bar</th><th>Verdict</th></tr></thead><tbody>`;
  for(const k in DOM){
    const p=per[k],pc=p.n?Math.round(p.c/p.n*100):0;
    const cl=!p.n?"n":pc>=80?"g":pc>=60?"y":"r";
    const col=cl==="g"?"var(--ok)":cl==="y"?"var(--warn)":"var(--bad)";
    h+=`<tr><td><b>${k}</b> ${DOM[k].n}</td><td>${DOM[k].w}%</td><td>${p.c}/${p.n}</td>
     <td><div class="mini"><i style="width:${pc}%;background:${col}"></i></div></td>
     <td><span class="pill ${cl}">${p.n?pc+"%":"—"}</span></td></tr>`;
  }
  h+=`</tbody></table></div>
  <div class="nav"><button class="pri" id="again">Take another exam</button>
  <button id="toRev">Review missed questions</button></div>`;
  view.innerHTML=h;
  $("#again").onclick=startExam;
  $("#toRev").onclick=()=>{setMode("practice");set="wrong";build();renderQ()};
  exam=null;
}

/* ---------- dashboard ---------- */
function renderDash(){
  let n=0,c=0;
  for(const id in S.hist){n+=S.hist[id].n;c+=S.hist[id].c}
  const seen=Object.keys(S.hist).length;
  const acc=n?Math.round(c/n*100):0;
  const proj=Math.round(acc*10);
  const a=domAcc(),weak=weakDoms();
  let h=`<h2 class="sec">Readiness</h2>
  <div class="grid">
   <div class="stat ${proj>=720?"ok":proj>=600?"warn":"bad"}"><div class="n">${n?proj:"—"}</div><div class="l">Projected scaled score</div></div>
   <div class="stat pri"><div class="n">${seen}<span style="font-size:15px;color:var(--tx3)">/${QB.length}</span></div><div class="l">Questions seen</div></div>
   <div class="stat ${acc>=75?"ok":"warn"}"><div class="n">${n?acc+"%":"—"}</div><div class="l">Lifetime accuracy</div></div>
   <div class="stat ${weak.length?"bad":"ok"}"><div class="n">${weak.length}</div><div class="l">Weak domains</div></div>
  </div>`;
  if(n&&proj<720)h+=`<div class="exambar">⚠ <b>Below the 720 cut score.</b> Drill your weak domains below until every one clears 80%.</div>`;
  if(n&&proj>=720)h+=`<div class="exambar">✓ <b>Tracking above the cut score.</b> Keep coverage up — aim to see every question at least once.</div>`;

  h+=`<h2 class="sec">Per-domain mastery <span>weighted by official blueprint</span></h2>
  <div class="panel"><table><thead><tr><th>Domain</th><th>Exam weight</th><th>Attempts</th>
  <th style="width:140px">Mastery</th><th>Status</th></tr></thead><tbody>`;
  const order=Object.keys(DOM).sort((x,y)=>DOM[y].w-DOM[x].w);
  for(const k of order){
    const p=a[k],pc=p.n?Math.round(p.c/p.n*100):0;
    const inBank=QB.filter(q=>q.d===k).length;
    const cl=!p.n?"n":pc>=80?"g":pc>=65?"y":"r";
    const col=cl==="g"?"var(--ok)":cl==="y"?"var(--warn)":cl==="r"?"var(--bad)":"var(--tx3)";
    h+=`<tr><td><b>${k}</b> ${DOM[k].n}<div style="font-size:11px;color:var(--tx3)">${inBank} in bank</div></td>
     <td><b>${DOM[k].w}%</b></td><td>${p.c}/${p.n}</td>
     <td><div class="mini"><i style="width:${pc}%;background:${col}"></i></div></td>
     <td><span class="pill ${cl}">${p.n?pc+"%":"not started"}</span></td></tr>`;
  }
  h+=`</tbody></table></div>`;

  if(weak.length){
    h+=`<h2 class="sec">Weak-area drill <span>below 75%</span></h2><div class="bmlist">`;
    weak.forEach(k=>{
      h+=`<div class="bmrow" data-dom="${k}"><span class="id">${k}</span>
      <div><b>${DOM[k].n}</b> — ${Math.round(a[k].c/a[k].n*100)}% across ${a[k].n} attempts.
      <span style="color:var(--pri2)">Click to drill this domain →</span></div></div>`;
    });
    h+=`</div>`;
  }

  const bms=QB.filter(x=>S.bm.includes(x.id));
  h+=`<h2 class="sec">Bookmarks <span>${bms.length}</span></h2>`;
  if(!bms.length)h+=`<div class="panel" style="color:var(--tx3);font-size:13.5px">Nothing bookmarked yet. Star questions you want to revisit.</div>`;
  else{h+=`<div class="bmlist">`;bms.slice(0,40).forEach(q=>{
    h+=`<div class="bmrow" data-id="${q.id}"><span class="id">#${q.id}</span><div>${esc(q.q.slice(0,170))}${q.q.length>170?"…":""}</div></div>`;
  });h+=`</div>`;}

  h+=`<h2 class="sec">About this bank</h2>
  <div class="panel" style="font-size:13.5px;line-height:1.7;color:var(--tx2)">
   <b style="color:var(--tx)">Blueprint-weighted.</b> Question counts track the official CCDV-F domain weights, so practice time lands where the marks are — D1–D3 alone are ~65% of the exam.<br><br>
   <b style="color:var(--tx)">Fact-checked against live docs.</b> Questions are verified in batches against the current Anthropic documentation, not written from memory. Corrections already applied include the <code>request-id</code> header (not <code>x-request-id</code>), the seven <code>stop_reason</code> values, deprecated sampling parameters, native structured outputs, and 28×28-patch image token costs.<br><br>
   <b style="color:var(--tx)">Currency caveat.</b> The API moves faster than exam banks do. Where the live docs and older material diverge, these questions teach <i>current</i> behaviour and flag the change in the explanation — so you learn the real API and can recognise a dated question if you meet one.<br><br>
   <b style="color:var(--tx)">Answer positions are randomised</b> per question, so option order never leaks the key. Toggle it in the sidebar if you prefer fixed order.
  </div>
  <div class="nav"><button class="pri" id="dExam">Start 53-question exam sim</button></div>`;
  view.innerHTML=h;
  $("#dExam").onclick=()=>setMode("exam");
  view.querySelectorAll("[data-dom]").forEach(el=>el.onclick=()=>{
    $("#fDom").value=el.dataset.dom;syncSub();setMode("practice");set="all";build();renderQ();
  });
  view.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{
    setMode("practice");set="bm";build();
    const k=list.findIndex(x=>x.id==el.dataset.id);if(k>=0)i=k;
    picked=null;renderQ();
  });
}

/* ---------- mode ---------- */
function setMode(m){
  mode=m;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  if(m==="exam"){startExam();return}
  clearInterval(window._t);
  if(m==="dash"){renderDash();return}
  build();
  m==="cards"?renderCard():renderQ();
}
function rerender(){
  if(mode==="dash"){renderDash();return}
  if(mode==="exam")return;
  build(); mode==="cards"?renderCard():renderQ();
}

/* ---------- filter wiring ---------- */
function syncSub(){
  const d=$("#fDom").value;
  const subs=[...new Set(QB.filter(x=>!d||x.d===d).map(x=>x.s))].sort();
  $("#fSub").innerHTML=`<option value="">All sub-skills</option>`+subs.map(s=>`<option>${esc(s)}</option>`).join("");
}
function initFilters(){
  const order=Object.keys(DOM).sort((x,y)=>DOM[y].w-DOM[x].w);
  $("#fDom").innerHTML=`<option value="">All domains (${QB.length})</option>`+
    order.map(k=>`<option value="${k}">${k} · ${DOM[k].n} — ${DOM[k].w}%</option>`).join("");
  syncSub();
}
["fDom","fSub","fDiff","fType"].forEach(id=>$("#"+id).onchange=()=>{if(id==="fDom")syncSub();chips();rerender()});
let dt;$("#fSearch").oninput=()=>{clearTimeout(dt);dt=setTimeout(()=>{chips();rerender()},220)};
document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{
  set=b.dataset.set;if(mode==="dash"||mode==="exam")setMode("practice");else rerender();
});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#btnShuffle").onclick=()=>{shuffled=!shuffled;$("#btnShuffle").textContent=shuffled?"⇄ Shuffle ON":"⇄ Shuffle order";rerender()};
const shufLbl=()=>$("#btnShufOpt").textContent=S.shufOpts?"🔀 Options randomised":"🔀 Options in fixed order";
$("#btnShufOpt").onclick=()=>{S.shufOpts=!S.shufOpts;save();shufLbl();picked=null;rerender()};
$("#btnReset").onclick=()=>{if(confirm("Erase all progress, scores and bookmarks?")){S={hist:{},bm:[],theme:S.theme};save();chips();rerender()}};
$("#btnTheme").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";document.body.classList.toggle("light",S.theme==="light");save()};
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(mode==="cards"&&e.code==="Space"){e.preventDefault();$("#nx")&&$("#nx").click();return}
  if(e.key==="ArrowRight"){$("#nx")&&$("#nx").click()}
  if(e.key==="ArrowLeft"){$("#pv")&&$("#pv").click()}
  if(mode!=="cards"&&/^[1-4a-dA-D]$/.test(e.key)){
    const k="1234".indexOf(e.key)>=0?+e.key-1:"abcd".indexOf(e.key.toLowerCase());
    const b=view.querySelectorAll(".opt")[k]; b&&b.click();
  }
  if(e.key==="b"||e.key==="B"){$("#bm")&&$("#bm").click()}
});

/* ---------- boot ---------- */
document.body.classList.toggle("light",S.theme==="light");
initFilters(); shufLbl(); chips(); setMode("practice");
</script>
