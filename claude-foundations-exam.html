/* ===== D2 · Model Selection & Optimization — batch 2 ===== */
QB.push(
{id:216,d:"D2",s:"Cost & Token Management",t:"S",f:"H",
q:"A team enables prompt caching and total spend rises. `usage` shows high `cache_creation_input_tokens` and low `cache_read_input_tokens`. What is the economic explanation?",
o:["A. Caching always increases cost and should be disabled","B. They are paying the cache write premium repeatedly without collecting read discounts — the prefix is unstable or traffic is too sparse for entries to be reused before expiry","C. The model tier is wrong","D. Output tokens increased"],a:1,
e:"Caching is a bet that a prefix will be **read many times per write**. Writes cost **more** than normal input; reads cost a **fraction** of it. If nearly every call writes, you are paying the premium and never collecting the discount — strictly worse than not caching. Two causes: an **unstable prefix** (a timestamp, session id, or user name inside the cached region), or **traffic too sparse** for the 5-minute TTL, where the longer 1-hour TTL may fit better despite its higher write cost.",
w:"A — caching reliably reduces cost when prefixes are stable and reused; the mechanism is not at fault. C — tier affects base rates, not the write/read ratio. D — output tokens are unaffected by input caching."},

{id:217,d:"D2",s:"Prompt Caching",t:"S",f:"M",
q:"A multi-tenant assistant has a 15,000-token shared system prompt plus a short per-tenant preamble. How should the breakpoint be placed for best economics?",
o:["A. After the per-tenant preamble, so each tenant's full prefix is cached","B. After the shared system prompt and before the tenant preamble, so the large shared region is cached once and reused across all tenants","C. Caching cannot be used in multi-tenant systems","D. On the user message"],a:1,
e:"Order the request from **most stable to least stable** and put the breakpoint at the boundary. Placing it after the 15,000-token **shared** prompt means one cached region serves **every tenant**, maximising reads per write. Caching after the per-tenant preamble instead fragments the cache into one entry per tenant, so each pays its own write premium and low-traffic tenants may never reach a read before expiry. Note that caching after the *shared* block still lets the tenant preamble differ freely — it simply falls outside the cached prefix.",
w:"A — plausible but economically worse: it multiplies write costs by tenant count. C — multi-tenancy is a strong caching case, given a correctly-ordered prefix. D — a volatile breakpoint means zero cache hits."},

{id:218,d:"D2",s:"Prompt Caching",t:"S",f:"H",
q:"A team wants to keep a cache entry warm for a workload that fires roughly every 20 minutes. What applies?",
o:["A. The default 5-minute TTL suffices, since it refreshes automatically over time","B. The default TTL will expire between calls; the 1-hour TTL option fits, at a higher write cost that must be weighed against the read savings","C. Cache entries never expire","D. Send a dummy request every 4 minutes to keep it alive"],a:1,
e:"The default TTL is **5 minutes**, refreshed **on each read** — so a prefix used every 20 minutes expires between calls and every real request becomes a cache write. The **1-hour TTL** exists exactly for this cadence, at a **higher write cost**, so the decision is arithmetic: compare the extra write premium against the read savings at your actual call frequency. Below some traffic rate, caching genuinely does not pay.",
w:"A — refresh happens on use, and there is no use within the window here. C — 'ephemeral' means time-limited by design. D — technically warms the cache but burns requests, quota and money to avoid a cost, and the 1-hour TTL solves it properly."},

{id:219,d:"D2",s:"Cost & Token Management",t:"S",f:"M",
q:"An agent's cost per task has tripled over six months with no prompt changes. What is the most likely cause?",
o:["A. Anthropic raised prices","B. Conversation and tool-result accumulation — each iteration resends a longer history, so input tokens grow superlinearly across a task","C. The model became less efficient","D. Rate limits changed"],a:1,
e:"Because the API is **stateless**, every agent iteration resends the **entire accumulated history** — including all prior tool results. As tasks grow longer or tools return more verbose payloads, input tokens per iteration climb and total cost grows far faster than the step count. Remedies: **compact** completed history into structured summaries, make tools return **narrow projections** rather than raw dumps, cache the stable prefix, and delegate bulky exploration to **subagents** whose context does not pollute the main loop.",
w:"A — a possible but far less likely explanation than accumulation, and it would not be gradual. C — a fixed model ID does not degrade in efficiency. D — rate limits throttle throughput; they do not change per-token cost."},

{id:220,d:"D2",s:"Model Selection & Trade-offs",t:"S",f:"H",
q:"An eval shows the cheapest tier reaching 91% accuracy and the strongest 96% on a task where an error costs roughly £40 to remediate, at 200,000 requests per month. What should drive the decision?",
o:["A. Always pick the higher accuracy","B. Compute total cost of ownership — the token-price delta versus the remediation cost of the extra 5% error rate — and consider routing uncertain cases to the stronger tier","C. Always pick the cheaper model","D. Alternate between tiers"],a:1,
e:"This is an **expected-cost calculation, not a preference**. The 5-point gap is 10,000 extra errors per month, so roughly **£400,000** in remediation — a figure that will dwarf almost any token-price difference and make the stronger tier obviously correct here. The general lesson is to price accuracy in **business terms** rather than treating it as an abstract score. A **cascade** often beats either choice outright: run the cheap tier, and escalate only low-confidence cases to the strong one.",
w:"A — right by accident here, but the reasoning fails whenever errors are cheap and volume is enormous. C — ignores a remediation cost far exceeding the saving. D — averages the error rate without any decision logic; strictly worse than routing on confidence."},

{id:221,d:"D2",s:"Technical Fundamentals",t:"S",f:"M",
q:"A service must expose Claude-backed functionality over a WebSocket to a browser client. What is the appropriate structure?",
o:["A. Have the browser open a WebSocket directly to the Claude API","B. The browser connects to your server over WebSocket; the server calls the Claude API with streaming and relays deltas onward","C. Claude only supports WebSocket transport","D. Buffer the full response server-side, then send it in one WebSocket frame"],a:1,
e:"The browser must never hold your API key, so your **server sits in the middle**: it authenticates the user, calls the Messages API with `stream: true`, and **relays deltas** over the WebSocket as they arrive. That preserves incremental rendering while keeping credentials, quotas, rate limiting and logging server-side. This bridging of a server-sent-event upstream to a WebSocket downstream is a common real-world pattern.",
w:"A — exposes the key to every client and forfeits all server-side control. C — the API uses HTTP with SSE for streaming, not WebSocket. D — works but discards the latency benefit that motivated streaming."},

{id:222,d:"D2",s:"LLM Fundamentals",t:"R",f:"M",
q:"Why does the same prompt sometimes produce different outputs even with sampling parameters at their defaults?",
o:["A. The API caches inconsistently","B. Generation is probabilistic, and serving infrastructure can vary — the docs are explicit that output is not fully deterministic even at the lowest temperature","C. The model retrains continuously","D. Token counts vary randomly"],a:1,
e:"Two sources of variation. **Sampling is probabilistic by nature** — and on current models you cannot even dial it down, since `temperature`, `top_p` and `top_k` are deprecated and rejected with a 400 on the newest generations. Separately, **serving infrastructure** — routing, batching, numerical execution — can shift subtly over time even on a pinned model ID whose weights are fixed. The engineering consequence: never assume byte-identical output. Assert on **properties** (schema validity, required fields, semantic correctness) rather than exact strings.",
w:"A — no answer cache serves varying responses. C — weights behind a given model ID are fixed; updates ship as new IDs. D — token counts follow from the text, they are not independently random."},

{id:223,d:"D2",s:"Cost & Token Management",t:"S",f:"M",
q:"Which change reduces output token cost most directly for a report generator?",
o:["A. Enabling prompt caching","B. Specifying a tight output contract — target length, required sections, no restated preamble — and setting `max_tokens` accordingly","C. Using a bigger context window","D. Adding more few-shot examples"],a:1,
e:"Output tokens are the **more expensive side per token**, and they are governed by what you ask for. A **tight output contract** — stated length target, required sections only, an explicit instruction not to restate the request or add closing commentary — plus a realistic **`max_tokens`** cuts output volume directly. Note the asymmetry: caching is the right lever for *input* cost and does nothing for output.",
w:"A — reduces input cost only; output is never cached. C — a larger window permits more input, which raises cost rather than lowering it. D — examples add input tokens and improve format, but do not shorten output unless they demonstrate brevity."},

{id:224,d:"D2",s:"Model Selection & Trade-offs",t:"S",f:"H",
q:"When does deeper model reasoning cost more than it delivers?",
o:["A. Never — deeper reasoning always helps","B. On simple, latency-sensitive, or high-volume tasks, where it adds output tokens and delay without improving a result the model already gets right","C. Only when the context window is full","D. Only for non-English input"],a:1,
e:"Thinking tokens are **billed as output and add latency**, so on a task the model already handles in one step — classification, extraction, formatting, routing — you pay materially more for no accuracy gain, and in an interactive path you may break the latency budget outright. On current models this is tuned with an **effort** setting rather than an on/off switch: the fixed-budget `thinking: {\"type\":\"enabled\", budget_tokens: N}` form is **removed on the newest generations and returns a 400**, and on some models thinking cannot be disabled at all. Drop to **low effort** for simple, high-volume, latency-bound routes, and validate the choice on your eval set.",
w:"A — it is a cost/latency trade, not a free improvement. C — unrelated to context pressure, though thinking does consume the window. D — language is irrelevant to whether deep reasoning helps."},

{id:225,d:"D2",s:"Technical Fundamentals",t:"S",f:"H",
q:"An internal gateway wraps the Claude API for many teams. Which capability most improves organisational cost control?",
o:["A. Caching every response permanently","B. Per-team token accounting from `usage`, enforced budgets with alerting, and model-tier policy per use case","C. Forcing all teams onto the cheapest model","D. Blocking requests over 1,000 tokens"],a:1,
e:"Control requires **visibility then enforcement**: attribute every request's `usage` — including the cache read/write fields — to a team and model so spend is priced correctly, then apply **budgets with alerting** before overruns, and **tier policy** so expensive models are used where they are justified rather than by default. Note that a gateway can enable good behaviour too, by centralising caching and providing safe defaults.",
w:"A — response caching is wrong for personalised or time-sensitive output, and raises correctness and privacy problems. C — a blunt policy that will break workloads genuinely needing capability. D — an arbitrary cap that blocks legitimate long-context work."},

{id:226,d:"D2",s:"LLM Fundamentals",t:"S",f:"M",
q:"A summariser reproduces a factual error present in its source document. Is this a hallucination?",
o:["A. Yes — any incorrect output is a hallucination","B. No — it faithfully reflected the source; this is a data-quality problem, distinct from fabricating content not present in the input","C. Yes, because the temperature was above zero","D. No, because summarisation cannot hallucinate"],a:1,
e:"The distinction is diagnostically important. **Hallucination** is generating content **not supported by the input** — fabricated citations, invented figures. Faithfully summarising a wrong source is **correct summarisation of bad data**, and the fixes differ completely: hallucination calls for grounding, citation verification and output validation, whereas source error calls for **corpus quality control** and provenance signals so users can judge reliability. Conflating them sends you optimising the wrong layer.",
w:"A — collapses two failure modes with different remedies. C — temperature affects variety, not fidelity to the source. D — summarisation absolutely can hallucinate, by adding unsupported claims."},

{id:227,d:"D2",s:"Cost & Token Management",t:"S",f:"H",
q:"A RAG system retrieves 20 passages per query \"to be safe.\" Cost is high and answer quality is mediocre. What is the likely diagnosis?",
o:["A. Too few passages; retrieve 50","B. Over-retrieval — marginal passages inflate input cost and dilute attention, so fewer, better-ranked passages usually improve both cost and quality","C. The model tier is too low","D. Passages should go in the system prompt"],a:1,
e:"Over-retrieval hurts on **both** axes. It inflates input tokens on every query, and it **dilutes attention** — irrelevant passages compete with relevant ones and invite the model to cite something tangential. The fix is precision over volume: **rerank** retrieved candidates and pass only the top few, tune `k` empirically against an eval set, and improve **chunking** so each passage is self-contained. \"More context to be safe\" is a common and expensive misconception.",
w:"A — compounds the problem in both cost and quality. C — capability cannot compensate for a diluted, noisy context. D — per-query content in the system prompt breaks cache stability and confuses the durable/transient split."},

{id:228,d:"D2",s:"Model Selection & Trade-offs",t:"S",f:"M",
q:"A cascade routes requests to a cheap tier first and escalates on low confidence. What is required for this to work?",
o:["A. Nothing — the cheap model self-reports reliability accurately","B. A usable confidence or verification signal — a structured self-assessment, a validation check, or an evaluator step — since raw model confidence is unreliable","C. Both tiers must share a prompt","D. The cheap tier must be at least 99% accurate"],a:1,
e:"A cascade is only as good as its **escalation trigger**. Asking a model \"how confident are you?\" is notoriously poorly calibrated, so build a signal you can trust: **schema or business-rule validation** that a wrong answer would fail, a **structured self-assessment** with explicit criteria, an **evaluator call** that grades the candidate, or deterministic checks such as whether cited document ids actually exist. Without a reliable trigger, the cascade either escalates everything (no saving) or escalates nothing (no quality).",
w:"A — the core failure mode: raw self-reported confidence is not calibrated. C — sharing a prompt is convenient but not a requirement. D — if it were that accurate you would not need a cascade at all."},

{id:229,d:"D2",s:"Prompt Caching",t:"S",f:"M",
q:"Which request ordering maximises cache effectiveness?",
o:["A. Volatile user content first, then stable instructions","B. Most stable content first — tool definitions, then system prompt, then settled history — with volatile content last","C. Alphabetical by content type","D. Ordering is irrelevant to caching"],a:1,
e:"Caching matches an **exact prefix from the start of the request**, so anything volatile placed early invalidates everything after it. Order **most stable to least stable**: tool definitions, system prompt, settled conversation history, then the current turn — which happens to match the API's natural ordering of tools, system, messages. Then place breakpoints at the stability boundaries. Ordering is not a detail here; it determines whether caching works at all.",
w:"A — guarantees a cache miss on every call, the worst possible arrangement. C — content type has no relationship to stability. D — ordering is precisely what determines prefix reuse."},

{id:230,d:"D2",s:"LLM Fundamentals",t:"S",f:"H",
q:"Why can a model perform worse on a task when given a very long context, even well within the window limit?",
o:["A. Tokens degrade as the context grows","B. Attention is finite and diluted — relevant signal competes with irrelevant material, so curation of what enters the window often beats volume","C. The API truncates silently above 100K tokens","D. Long contexts disable tool use"],a:1,
e:"Fitting the window and **reasoning well** over it are different thresholds. As irrelevant material accumulates, the relevant signal competes for finite attention, and instructions buried mid-context lose salience. This is why **context engineering** matters as much as prompt engineering: retrieve precisely rather than exhaustively, **compact** stale history, place critical instructions at high-salience positions, and delegate bulky exploration to subagents that return distilled results.",
w:"A — tokens do not degrade; attention distribution is the mechanism. C — no silent truncation occurs; overflow produces an explicit condition. D — tool use is unaffected by context length."}
);
</script>
<script>
/* ===== D3 · Agents & Workflows — batch 2 ===== */
QB.push(
{id:231,d:"D3",s:"Agent Construction with Claude",t:"S",f:"M",
q:"An agent must complete a task that takes roughly 40 tool calls. Partway through, the process crashes. What design would have made this recoverable?",
o:["A. A larger `max_tokens`","B. Durable checkpointing — persist the message history and task state after each iteration so the loop can resume rather than restart","C. Retrying the whole task automatically","D. Using a stronger model"],a:1,
e:"Long agent runs need **durable state**, because in-memory history dies with the process. Persist the accumulated messages and task progress after each iteration, so a restart **resumes from the last good step** instead of repeating 40 calls' worth of work and cost. Record the **termination reason** too, so you can distinguish a crash from a legitimate completion — and make side-effecting tools **idempotent**, since resumption may re-attempt an action that already succeeded.",
w:"A — governs one response's length, nothing about durability. C — restarting from zero repeats all cost and may duplicate side effects. D — capability does not survive a process crash."},

{id:232,d:"D3",s:"Agent Architecture",t:"S",f:"H",
q:"An agent is given a goal it cannot achieve with its available tools. What is the desirable behaviour, and how is it obtained?",
o:["A. Keep trying until the iteration cap trips","B. Recognise the gap and report it clearly — achieved by instructing the model that reporting infeasibility is a valid outcome, and by returning informative tool errors","C. Invent a plausible answer to satisfy the request","D. Silently return partial results"],a:1,
e:"Models default to producing *an* answer, so **\"I cannot do this with these tools\" must be specified as a legitimate outcome** or you will get fabrication or aimless looping instead. Two supports make it work: system-prompt instruction that reporting infeasibility is valid and expected, and **informative tool errors** — \"no records match; this tool only covers 2023 onward\" gives the model the evidence to conclude the goal is unreachable, whereas an empty result invites endless retrying.",
w:"A — burns the full budget to arrive at an unexplained failure. C — the worst outcome: a confident fabrication the user may act on. D — silent partial results are indistinguishable from complete ones downstream."},

{id:233,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"M",
q:"A workflow needs a document classified, then routed to one of four specialised handlers. Which pattern names this?",
o:["A. Prompt chaining","B. Routing","C. Evaluator-optimiser","D. Orchestrator-workers"],a:1,
e:"**Routing** classifies an input and dispatches it to a specialised downstream handler. Its value is that each handler gets a **focused prompt and tool set** tuned for its category, rather than one bloated prompt attempting everything — and the classifier itself can run on a cheap fast tier. It is a **workflow**, since the set of destinations is fixed in your code rather than chosen freely by the model.",
w:"A — prompt chaining is sequential decomposition, where each step feeds the next. C — evaluator-optimiser iterates generate-then-critique. D — orchestrator-workers dynamically decomposes into subtasks; here the four handlers are known in advance."},

{id:234,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"H",
q:"Which situation calls for orchestrator-workers rather than simple routing?",
o:["A. Inputs fall into three known categories","B. The subtasks cannot be enumerated in advance — the number and nature of the pieces depend on the specific input, so the orchestrator must decompose dynamically","C. Every request needs the same two steps","D. Only one tool exists"],a:1,
e:"The distinction is **who decides the decomposition, and when**. Routing picks from a **fixed, known set** of handlers. **Orchestrator-workers** applies when the subtasks are **not knowable in advance** — a research question might need three sub-investigations or eleven, determined by what the orchestrator finds. That dynamism is what makes it agentic rather than a workflow, and it is why the pattern costs more and needs iteration and budget guards.",
w:"A — three known categories is exactly routing. C — a fixed two-step sequence is prompt chaining. D — tool count does not determine the pattern."},

{id:235,d:"D3",s:"Agent Construction with Claude",t:"S",f:"H",
q:"An agent calls a search tool that returns no results. It then calls the same tool with an almost identical query, repeatedly. What is the most effective fix?",
o:["A. Reduce the iteration cap so it fails faster","B. Make the tool's empty result informative — state what was searched, why nothing matched, and what alternatives exist — so the model can adapt instead of retrying blindly","C. Remove the search tool","D. Increase `temperature` to vary the queries"],a:1,
e:"A bare empty result gives the model **no information to act on**, so retrying is a rational response to an uninformative signal. Make the result carry diagnosis: \"No matches for 'Q3 revenue' in the 2024 filings index. Index covers 2020–2024 annual reports only; quarterly data is not included.\" Now the model can broaden, switch source, or correctly report infeasibility. **Tool result quality drives agent behaviour** at least as much as the prompt does — repeat-call detection is a useful safety net, but this is the root cause.",
w:"A — treats the symptom; the agent still fails, just sooner. C — removes needed capability. D — random query variation is not a search strategy and wastes calls."},

{id:236,d:"D3",s:"Agent Architecture",t:"S",f:"M",
q:"Which agent capability most warrants a human approval gate?",
o:["A. Reading a public documentation page","B. Sending an email to an external customer","C. Counting rows in a report","D. Formatting a JSON response"],a:1,
e:"Gate on **irreversibility and external visibility**. An email to a customer cannot be recalled, is seen by someone outside your organisation, and can carry reputational, contractual, or regulatory weight — so it warrants explicit approval. Read-only, internal, and reversible operations do not, and gating them destroys the agent's usefulness with approval fatigue that trains reviewers to click through without reading. Gate deliberately and narrowly.",
w:"A — read-only and public, with no side effect. C — a read operation with no external impact. D — an internal transformation, trivially reversible."},

{id:237,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"M",
q:"A code-generation agent writes code, runs the tests, and fixes failures iteratively. Which pattern is this?",
o:["A. Routing","B. Evaluator-optimiser, with the test suite acting as an objective evaluator","C. Prompt chaining","D. Parallelisation"],a:1,
e:"This is **evaluator-optimiser**, and it is an unusually strong instance because the evaluator is a **test suite** — objective, deterministic, and free of the calibration problems that plague model-as-judge setups. The loop generates, evaluates, feeds failures back, and repeats until tests pass or an iteration cap trips. The pattern works best precisely where quality is **mechanically checkable**, which is why coding is its canonical application.",
w:"A — no classification or dispatch is involved. C — chaining is a fixed forward sequence without a feedback loop. D — the steps are strictly sequential, not parallel."},

{id:238,d:"D3",s:"Agent Architecture",t:"S",f:"H",
q:"A supervisor agent spawns sub-agents that each spawn their own sub-agents, several levels deep. What risk does this introduce?",
o:["A. None — deeper hierarchies are always more capable","B. Cost and latency compound multiplicatively, failures become hard to trace, and instructions degrade through each delegation layer","C. The API forbids nested sub-agents","D. Sub-agents cannot use tools"],a:1,
e:"Depth compounds problems **multiplicatively**: each level multiplies token spend and adds latency, a failure three levels down is hard to attribute, and the original intent degrades as it is re-interpreted at each hand-off — a telephone-game effect. Keep hierarchies **shallow**, typically one orchestrator plus a layer of workers, give sub-agents **precise scoped briefs** rather than vague goals, and require **structured returns** so the supervisor can reconcile findings rather than re-interpret prose.",
w:"A — capability does not scale with depth; coordination overhead grows faster than benefit. C — nesting is an architectural choice, not an API restriction. D — sub-agents typically use tools heavily."},

{id:239,d:"D3",s:"Agent Construction with Claude",t:"S",f:"M",
q:"An agent's tool returns a 50,000-token document. What should the agent architecture do with it?",
o:["A. Insert it whole into the conversation as the tool result","B. Have the tool return a summary or relevant extract plus a reference id, letting the agent fetch specific detail only if needed","C. Truncate it to the first 1,000 tokens","D. Store it in the system prompt"],a:1,
e:"Tool results consume the **same context budget** as everything else and are **resent on every subsequent iteration**, so a 50,000-token result is charged repeatedly for the remainder of the task. Design the tool to return a **distilled projection plus a reference id** the agent can use to pull specific detail on demand. This is context engineering applied to the tool layer — the response shape is a design decision, not an accident of the underlying data.",
w:"A — poisons the context for every following turn and can exhaust the window in two or three calls. C — arbitrary truncation may discard exactly the relevant section. D — the system prompt is for durable instructions, and per-call content there destroys cache stability."},

{id:240,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"H",
q:"A team is deciding between the Claude Agent SDK and a hand-written loop over the Messages API. What is the honest trade-off?",
o:["A. The SDK is always better","B. The SDK provides a maintained loop, tool execution, context management and permissions out of the box; a custom loop gives full control at the cost of owning that correctness yourself","C. A custom loop is always cheaper to run","D. They are functionally identical"],a:1,
e:"The SDK gives you a **battle-tested implementation** of the parts that are tedious and easy to get subtly wrong: the loop and `stop_reason` branching, tool execution and result pairing, context management, permissions and hooks. A **custom loop** is entirely reasonable when you need behaviour the SDK does not express, or want to minimise dependencies — but you then own retries, compaction, pairing correctness and guards. Decide on **how standard your agent's shape is**, not on ideology.",
w:"A — a custom loop is the right call for unusual control flow or minimal dependencies. C — token cost is driven by prompts and iterations, not by the client library. D — they differ substantially in what you must implement yourself."},

{id:241,d:"D3",s:"Agent Architecture",t:"S",f:"M",
q:"Why is it useful to give a research sub-agent read-only tools while the orchestrator holds write access?",
o:["A. Read-only tools are faster","B. It applies least privilege — the component processing untrusted external content cannot mutate state, so an injection in that content has a bounded blast radius","C. It reduces token cost","D. Sub-agents cannot use write tools"],a:1,
e:"This is **least privilege applied to agent decomposition**, and it directly counters the exfiltration pattern. The research sub-agent is the component consuming **untrusted external content** — web pages, documents — and therefore the one most exposed to **indirect prompt injection**. Denying it write and send capabilities means a successful injection there cannot mutate state or exfiltrate, because the privileged actions sit in a component that never touches attacker-controlled text.",
w:"A — permission scope does not affect speed. C — no meaningful token effect. D — sub-agents can hold write tools; the point is that they should not here."},

{id:242,d:"D3",s:"Agent Construction with Claude",t:"S",f:"H",
q:"An agent must operate over a task lasting several days with pauses between sessions. What does the memory architecture require?",
o:["A. Keeping the process alive with the full history in memory","B. External durable memory — persisted task state, decisions and findings that the agent loads at session start and updates as it works","C. Relying on prompt caching to retain state","D. A larger context window"],a:1,
e:"Multi-day continuity demands **externalised memory**, since context is per-conversation and processes do not survive days of idleness. Persist **structured task state** — the goal, decisions taken, findings, open items, and what has already been done — in a database or files the agent reads at session start and updates as it progresses. Note that prompt caching is a **short-lived cost optimisation**, not a memory store, and it never changes what the model knows.",
w:"A — brittle, expensive, and lost on any restart or deploy. C — a cache with a minutes-long TTL cannot span days, and caching is not recall. D — a bigger window postpones the limit within a session and does nothing across sessions."},

{id:243,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"M",
q:"When is parallelisation by sectioning appropriate?",
o:["A. When each step depends on the previous step's output","B. When a task splits into independent pieces that can be processed concurrently and combined afterwards — for example checking a document against ten separate policy rules","C. When only one tool is available","D. When the task is trivially short"],a:1,
e:"**Sectioning** splits a task into genuinely **independent subtasks** run concurrently, then aggregates the results. Checking a document against ten policies is ideal: no rule's evaluation depends on another's, so wall-clock time approaches that of a single check, and each subtask gets a **focused prompt** that often improves accuracy over one prompt juggling ten criteria. Independence is the strict prerequisite.",
w:"A — a data dependency makes concurrency impossible by construction. C — tool count is unrelated. D — orchestration overhead would exceed the benefit."},

{id:244,d:"D3",s:"Agent Architecture",t:"S",f:"H",
q:"A production agent occasionally takes a sensible-looking but wrong action. Which control most reduces the harm without crippling autonomy?",
o:["A. Removing all write tools","B. Graduated authority — automatic execution for low-impact reversible actions, confirmation above a defined threshold, and hard code-enforced caps regardless of model judgement","C. A prompt instruction to be more careful","D. Reviewing all actions manually after the fact"],a:1,
e:"**Graduate authority by impact** rather than choosing between full autonomy and none. Let low-impact, reversible actions run automatically so the agent stays useful; require **confirmation above a threshold**; and enforce **hard caps in code** that the model cannot exceed regardless of its reasoning. The governing principle: **the model proposes, deterministic code authorises**, with the threshold set by what an error actually costs.",
w:"A — removes the capability that justifies the agent. C — advisory, and defeated by injection or simple error. D — after-the-fact review is auditing; the harm has already occurred."},

{id:245,d:"D3",s:"Agent Construction with Claude",t:"S",f:"M",
q:"How should an agent loop handle a tool that times out?",
o:["A. Abort the entire agent run","B. Return a `tool_result` with `is_error: true` describing the timeout and its retryability, letting the agent decide whether to retry, use another tool, or report","C. Return an empty result and continue","D. Retry the tool indefinitely inside the executor"],a:1,
e:"Surface the failure as a **structured error the model can reason about**: `is_error: true` with content such as \"Timed out after 10s. Retryable — consider narrowing the query.\" The agent can then retry with tighter parameters, choose an alternative tool, or report the blockage — decisions it can only make with information. Note that a **bounded** executor-side retry is reasonable for transient faults, but unbounded retries hide the problem and consume the budget invisibly.",
w:"A — discards recoverable situations and all work so far. C — ambiguous; the model cannot distinguish 'no results' from 'failed', which commonly triggers pointless retry loops. D — unbounded retries stall the loop with no visibility."},

{id:246,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"H",
q:"What most reliably indicates a task should be a workflow rather than an agent?",
o:["A. The task is complex","B. The steps and their order can be enumerated in advance, so model judgement is not needed to decide what happens next","C. The task uses more than three tools","D. The task involves external APIs"],a:1,
e:"The test is **whether control flow can be written down ahead of time**. If you can enumerate the steps and their order, a **workflow** encodes them in code — cheaper, deterministic, testable, and incapable of wandering. Reserve **agentic autonomy** for cases where the path genuinely depends on what is discovered at runtime. Complexity is not the criterion: a complex but fully-specified pipeline is still a workflow, and choosing an agent for it imports variance for no benefit.",
w:"A — complexity and unpredictability are different properties. C — tool count says nothing about who chooses the sequence. D — workflows call external APIs routinely."},

{id:247,d:"D3",s:"Agent Architecture",t:"S",f:"M",
q:"A sub-agent returns a long prose narrative of its findings. The orchestrator struggles to reconcile several such returns. What improves this?",
o:["A. A larger model for the orchestrator","B. Requiring structured returns — findings with confidence, sources and explicit open questions — so conflicts are detectable rather than buried in prose","C. Running sub-agents sequentially","D. Increasing the orchestrator's `max_tokens`"],a:1,
e:"**Structured returns make reconciliation mechanical.** When each sub-agent returns typed findings with sources, confidence, and explicit unknowns, the orchestrator can detect that two sub-agents disagree on a specific claim and adjudicate it. Buried in prose, the same conflict is silently averaged into a confident-sounding synthesis. Enforce the shape with a **schema-bearing tool** for the return rather than relying on free-text instructions.",
w:"A — capability does not compensate for unstructured input. C — sequencing changes ordering, not the reconcilability of prose. D — a larger output cap lets it write more, not reconcile better."},

{id:248,d:"D3",s:"Agent Construction with Claude",t:"S",f:"H",
q:"Which metric best reveals that an agent's tool descriptions need improvement?",
o:["A. Total tokens consumed","B. A high rate of tool calls that are immediately followed by a different tool call for the same subgoal, or repeated calls with near-identical arguments","C. Average response latency","D. The number of tools defined"],a:1,
e:"**Trajectory patterns diagnose tool design.** Calling one tool and immediately switching to another for the same subgoal indicates the first was chosen wrongly — ambiguous or overlapping descriptions. Repeated near-identical calls indicate results too uninformative to act on. Both are **tool-layer defects**, not model failures, and the remedy is to sharpen descriptions with explicit boundaries and preference rules, and to make results diagnostic. Instrument tool-call sequences, not just totals.",
w:"A — an aggregate that cannot localise the cause. C — latency reflects many factors. D — count alone says nothing about clarity, though a large catalogue does worsen ambiguity."},

{id:249,d:"D3",s:"Agent Architecture",t:"S",f:"M",
q:"What should be logged when an agent loop terminates?",
o:["A. Only the final answer","B. The termination reason — natural completion, iteration cap, budget exhaustion, unrecoverable error, or declined approval — alongside iteration count and cumulative token usage","C. Only the elapsed time","D. Only whether it succeeded"],a:1,
e:"Capturing a **distinguishable termination reason** is what makes agent behaviour analysable in aggregate. A rising share of **iteration-cap** terminations signals a convergence problem; **budget exhaustion** signals inefficiency in tools or prompts; **declined approvals** signal the agent is proposing inappropriate actions. A bare success/fail flag collapses all of these into one undiagnosable bucket. Pair with iteration count and cumulative tokens for cost attribution.",
w:"A — reveals nothing about the path or why it ended. C — one number with no explanatory power. D — hides which limit actually bound, so you cannot tell what to fix."},

{id:250,d:"D3",s:"Agent Patterns & Frameworks",t:"S",f:"H",
q:"An agent must produce a legal summary that will be relied upon professionally. Which arrangement is appropriate?",
o:["A. Full autonomy, since the model is capable","B. Agent-assisted drafting with mandatory qualified human review before the output is relied upon, plus citations verifiable against retrieved sources","C. Autonomy with a disclaimer","D. Two agents cross-checking each other, with no human involved"],a:1,
e:"Where output carries **professional or legal consequence**, the agent is a **drafting accelerator, not the decision-maker**. Require qualified human review before reliance, and make review *effective* by grounding claims in retrieved sources with **citations you programmatically verify** — checking that cited ids actually exist in what was retrieved, which catches fabricated references. This keeps the productivity gain while placing accountability with a qualified human.",
w:"A — capability is not accountability, and confident errors are the dangerous kind here. C — a disclaimer transfers blame without reducing harm. D — models share failure modes and can agree confidently on the same fabrication; cross-checking is not independent verification."}
);

QB.push(
{id:251,d:"D4",s:"Output Handling",t:"S",f:"M",
q:"A pipeline needs guaranteed schema-valid JSON from Claude. Which mechanism provides a decoding-level guarantee rather than a strong steer?",
o:["A. Repeating \"respond only in JSON\" three times in the system prompt","B. Structured outputs — `output_config.format` with a `json_schema`, which constrains decoding itself","C. A regex that extracts the first `{...}` block","D. Few-shot examples showing JSON output"],a:1,
e:"**Structured outputs** constrain the decoding process, so the model **cannot** emit anything that violates your schema — no fences, no preamble, no parse failures, and no retries for schema violations. The tool-side equivalent is **`strict: true`** on a tool definition, which guarantees conforming tool *inputs*. Everything else on this list influences probability rather than enforcing a constraint, which is exactly the difference that matters for a hard contract.",
w:"A — emphasis and repetition are unreliable and waste tokens. C — post-hoc extraction patches symptoms and fails on nested or malformed output. D — examples improve consistency but guarantee nothing."},

{id:252,d:"D4",s:"Prompt Engineering",t:"S",f:"H",
q:"A prompt performs well in English but poorly in German and Japanese. What is the most likely cause and remedy?",
o:["A. Claude does not support non-English input","B. Instructions, examples and output-format specifications are English-centric — supply few-shot examples in the target language and state the expected output language explicitly","C. Increase `max_tokens` for non-English output","D. Use a different model per language"],a:1,
e:"Multilingual weakness usually traces to the **prompt, not the model**. Few-shot examples in English teach English output patterns; a format specified with English labels invites English responses; and instructions may not state which language to answer in. Fix it by **supplying examples in the target language**, **stating the output language explicitly**, and evaluating per language. Do budget more tokens too — many non-Latin scripts tokenize less efficiently — but that is a cost consideration, not the quality cause.",
w:"A — multilingual capability is a core strength. C — a real budgeting point but it does not explain poor quality. D — unnecessary complexity before fixing the prompt."},

{id:253,d:"D4",s:"Context Engineering",t:"S",f:"H",
q:"A knowledge-base chunking strategy splits documents every 500 characters regardless of structure. Retrieval quality is poor. What is the likely cause?",
o:["A. Chunks are too large","B. Fixed-length splitting cuts mid-sentence and mid-section, producing chunks that lack self-contained meaning and the context needed to be understood alone","C. The embedding model is wrong","D. Too few chunks are retrieved"],a:1,
e:"A retrieved chunk must **stand on its own**, because the model sees it without its surroundings. Blind character-count splitting severs sentences and separates a claim from the heading that gives it meaning, so even a correctly-retrieved chunk may be uninterpretable. Chunk on **semantic boundaries** — sections, paragraphs, or logical units — use **overlap** so context spanning a boundary is not lost, and **carry document and section metadata into each chunk** so it retains its frame of reference.",
w:"A — the problem is where the splits fall, not their size. C — worth checking, but structural chunking defects are the more common cause. D — retrieving more poorly-formed chunks adds noise rather than meaning."},

{id:254,d:"D4",s:"Prompt Engineering",t:"S",f:"M",
q:"A classification prompt returns labels that are correct but inconsistently cased and occasionally wrapped in explanation. What is the most efficient fix?",
o:["A. Post-process with string normalisation","B. Constrain the output space — an `enum` in a structured-output schema, or few-shot examples showing the exact bare label","C. Lower `temperature` only","D. Ask the model to be more consistent"],a:1,
e:"**Constrain the output space rather than cleaning up afterwards.** An `enum` in a structured-output schema makes non-conforming labels impossible; few-shot examples showing the exact bare token are the lighter-weight version. Post-processing works until an unanticipated variant appears, and each new variant is a bug. Note also that removing the explanation cuts output tokens, so the structural fix is cheaper too.",
w:"A — a maintenance treadmill that fails on the first unseen variant. C — helps consistency but does not bound the output space. D — vague instructions produce vague compliance."},

{id:255,d:"D4",s:"Context Engineering",t:"S",f:"M",
q:"Which content should sit **outside** a prompt-cache breakpoint?",
o:["A. The tool definitions","B. Anything that varies per request — the current user message, per-query retrieved passages, timestamps and session identifiers","C. The system prompt","D. Few-shot examples"],a:1,
e:"The cached region is matched as an **exact prefix**, so **anything variable must sit after the breakpoint**. The classic accidental cache-busters are **timestamps and session identifiers** injected into an otherwise-stable system prompt — a single changing token turns every call into a cache write, which costs more than not caching at all. Keep tools, system prompt and few-shot examples inside; keep the current turn and per-query retrieval outside.",
w:"A/C/D — all stable across requests and therefore ideal cached content."},

{id:256,d:"D4",s:"Prompt Engineering",t:"S",f:"H",
q:"A prompt asks the model to \"analyse the document and extract key points, then assess risk, then recommend an action.\" Output quality on the later steps is weak. What often helps?",
o:["A. Combining the three requests into one sentence","B. Decomposing into separate calls (prompt chaining) so each step gets a focused prompt and its output can be validated before feeding the next","C. Raising `temperature`","D. Removing the risk assessment"],a:1,
e:"Multi-part prompts frequently produce a strong first section and progressively weaker later ones, as attention and effort skew toward the opening task. **Prompt chaining** gives each step its own focused prompt and lets you **validate between steps** — confirming extraction is complete before risk assessment depends on it. The trade-off is more calls and latency, so reserve it for cases where quality on later steps actually matters. Requesting **explicitly delimited sections** is the lighter-weight middle ground.",
w:"A — compresses the request without addressing the underlying attention skew. C — randomness will not improve analytical depth. D — drops a requirement rather than meeting it."},

{id:257,d:"D4",s:"Output Handling",t:"S",f:"M",
q:"A downstream service receives a well-formed JSON object citing document id `DOC-8842`, which does not exist in the retrieved set. What check would have caught this?",
o:["A. JSON schema validation","B. Referential validation — verifying cited identifiers against the passages actually supplied","C. A stricter `max_tokens`","D. Lowering `temperature`"],a:1,
e:"Schema validation confirms the **shape** is right; it cannot tell you the **content is real**. A fabricated-but-well-formed citation passes schema checks and fails **referential integrity**, so validate cited ids against the set you actually retrieved and reject or flag anything unmatched. This is one of the highest-value checks in a RAG pipeline, because a plausible fake citation is precisely the failure users will not catch themselves.",
w:"A — the object is schema-valid; that is what makes this dangerous. C — output length is unrelated. D — reduces variance without preventing fabrication."},

{id:258,d:"D4",s:"Prompt Engineering",t:"S",f:"H",
q:"A system prompt has accumulated 40 rules over a year, and the model now inconsistently follows several of them. What is the most likely cause?",
o:["A. The model has degraded over time","B. Rule dilution and conflict — a long unstructured list buries important constraints and may contain contradictions, so consolidation and prioritisation is needed","C. `max_tokens` is too low","D. The system prompt should be moved into a user message"],a:1,
e:"Long accumulated rule lists suffer two problems: **dilution**, where genuinely critical constraints carry no more weight than trivial ones, and **latent conflict**, where rules added at different times contradict each other and the model must silently pick. Audit for contradictions, **consolidate** overlapping rules, **prioritise explicitly** by marking the non-negotiable ones, and structure with tags. Constraints that must always hold should be **enforced in code**, not left to instruction-following.",
w:"A — a pinned model does not degrade; the prompt grew. C — output limits do not affect rule adherence. D — that would weaken the instructions' standing, not strengthen it."},

{id:259,d:"D4",s:"Context Engineering",t:"S",f:"M",
q:"An agent summarises its own progress every ten turns and drops the raw history. What risk must the summary design manage?",
o:["A. Summaries cost more tokens than raw history","B. Losing decision-relevant detail — the summary must retain decisions, constraints, established facts and open items, not just a narrative of what happened","C. Summarisation is not possible mid-conversation","D. The model cannot read its own summaries"],a:1,
e:"Compaction is **lossy by design**, so its value depends entirely on **what you choose to keep**. A narrative recap (\"I searched for X, then read Y\") is nearly useless; what the agent needs forward is the **decisions taken and why, the constraints established, the facts confirmed, and the open items remaining**. Prompt for that structure explicitly — and keep the most recent turns verbatim, since local coherence depends on unsummarised detail.",
w:"A — a good summary is far cheaper than the history it replaces. C — mid-conversation compaction is standard practice. D — summaries are ordinary context the model reads normally."},

{id:260,d:"D4",s:"Prompt Engineering",t:"S",f:"M",
q:"Which few-shot example set will most improve an extraction task?",
o:["A. Five near-identical straightforward examples","B. A small set spanning the typical case plus the genuinely awkward ones — missing fields, ambiguous values, and the correct handling for each","C. Twenty examples of the same pattern","D. Examples drawn from an unrelated domain"],a:1,
e:"Examples teach **decision boundaries**, so their value lies in **coverage, not volume**. Five near-identical easy cases teach nothing the instructions did not already convey. What changes behaviour is demonstrating the **hard cases**: what to emit when a field is missing, how to resolve an ambiguous value, when to flag rather than guess. Include an example of the **escape path** too, or the model will guess when it should abstain.",
w:"A — redundant; adds tokens without adding information. C — twenty repetitions of one pattern is expensive redundancy. D — off-domain examples can actively mislead."},

{id:261,d:"D4",s:"Output Handling",t:"S",f:"H",
q:"An extraction service must distinguish \"field genuinely absent from the document\" from \"model failed to find it.\" How is this achieved?",
o:["A. Return an empty string for both cases","B. Design the schema with an explicit absence representation — such as a `null` value plus a `found: false` flag or a confidence field — and instruct the model when to use it","C. Retry until a value is returned","D. Use a larger model"],a:1,
e:"An empty string **conflates two situations requiring different responses** — genuine absence is a valid finding, whereas a failed extraction warrants retry or human review. Encode the distinction in the **schema**: a nullable value with an explicit `found` flag or confidence field, and prompt instructions defining when each applies. The general principle: if your system must act differently on two outcomes, the output contract has to be able to express both.",
w:"A — the exact conflation causing the problem. C — retrying a genuinely-absent field loops forever and may induce fabrication. D — capability cannot express a distinction the schema lacks."},

{id:262,d:"D4",s:"Context Engineering",t:"S",f:"H",
q:"A long-running agent's system prompt states \"never modify files outside /workspace.\" After 60 turns it attempts an edit elsewhere. What does this demonstrate?",
o:["A. The model is deliberately disobedient","B. Constraints stated once in a long context degrade — and more fundamentally, a rule that must always hold belongs in enforcement code, not in the prompt","C. The system prompt was too short","D. `temperature` was too high"],a:1,
e:"Two lessons, one practical and one architectural. Practically, this is **context drift**: an instruction stated once at the start competes with 60 turns of accumulated material, so **re-inject critical constraints periodically** and compact stale content. Architecturally — and this is the more important point — **a constraint that must never be violated cannot rest on instruction-following**. Enforce the path restriction in a **PreToolUse hook or the tool implementation**, where it holds regardless of what the model decides.",
w:"A — anthropomorphises what is an attention-distribution effect. C — length is not the issue; salience and enforcement are. D — sampling settings do not govern constraint adherence."},

{id:263,d:"D4",s:"Prompt Engineering",t:"S",f:"M",
q:"A prompt instructs the model to \"think step by step\" and the reasoning appears in the user-facing output. What is the cleanest remedy?",
o:["A. Remove the reasoning instruction and accept lower accuracy","B. Have the model emit reasoning inside delimited tags and the conclusion in its own tags, then display only the conclusion","C. Truncate the response after the last paragraph","D. Post-process to strip sentences containing \"step\""],a:1,
e:"Keep the accuracy benefit while controlling presentation: request **explicitly delimited regions** — reasoning inside `<thinking>`, the answer inside `<answer>` — and render only the answer. This gives you a **deterministic extraction target** rather than inferring structure from layout. Note the distinction from the extended-thinking feature, which produces `thinking` content blocks structurally; this is the prompt-level equivalent when you simply want the working kept out of the display.",
w:"A — sacrifices reasoning quality to fix a formatting problem. C — brittle; reasoning length and trailing commentary vary. D — keyword stripping mangles legitimate content and misses rephrased reasoning."},

{id:264,d:"D4",s:"Output Handling",t:"S",f:"M",
q:"A summarisation service must guarantee its output never exceeds 200 words for a downstream display component. What is the reliable approach?",
o:["A. Set `max_tokens` to roughly 200 and rely on the cap","B. State the limit in the prompt, then enforce it in code — measure the returned length and truncate or regenerate if it exceeds the contract","C. Ask the model to count its own words","D. Use `stop_sequences` at the 200th word"],a:1,
e:"Treat the length limit as a **contract to be verified, not merely requested**. Instruct clearly (\"under 200 words\"), then **check the actual output** and handle breaches deliberately. Note why `max_tokens` alone is the wrong instrument: it cuts generation **mid-sentence** when reached, producing `stop_reason: \"max_tokens\"` and a truncated fragment rather than a shorter complete summary. Set it generously enough to allow a well-formed answer, and enforce the word limit as a validation step.",
w:"A — a token cap produces truncation, not concision, and tokens map imprecisely to words. C — self-counting is unreliable and wastes output tokens. D — you cannot express \"the 200th word\" as a stop sequence."},

{id:265,d:"D4",s:"Prompt Engineering",t:"S",f:"H",
q:"A team maintains eight prompt variants for different customer segments, and a bug fix must be applied to all of them. What does this reveal?",
o:["A. Eight variants is the correct design","B. Duplicated prompt logic should be factored into a shared base with segment-specific overlays, so common fixes apply once","C. Prompts should never be segmented","D. The fix should be applied to only the most-used variant"],a:1,
e:"Prompts are **behavioural code and suffer the same duplication problems**: a fix applied to eight copies will be applied inconsistently, and the copies will drift. Factor the shared instructions, format contract and safety rules into a **common base**, and keep only genuine per-segment differences as overlays. A useful bonus: a shared, stable base is exactly what **prompt caching** rewards, whereas eight full variants fragment the cache.",
w:"A — the duplication is what makes the fix expensive and error-prone. C — segmentation is often legitimate; unfactored duplication is the problem. D — knowingly leaving seven variants broken."},

{id:266,d:"D4",s:"Context Engineering",t:"S",f:"M",
q:"Retrieved passages are injected without source identifiers. What capability is lost?",
o:["A. Nothing — the content is what matters","B. Verifiable citation — the model cannot attribute claims to sources, and you cannot programmatically check that cited references correspond to what was actually retrieved","C. Prompt caching","D. Streaming"],a:1,
e:"Without identifiers you lose **provenance in both directions**: the model cannot attribute a claim to a specific source, and you cannot **verify** citations by checking that referenced ids exist in the retrieved set — the single most effective defence against fabricated references. For regulated or high-stakes use this is usually a hard requirement, not a nice-to-have. Inject each passage tagged with its id and instruct the model to cite by that id.",
w:"A — traceability is frequently a hard requirement and always a debugging aid. C — caching is unaffected by identifiers. D — streaming is orthogonal."},

{id:267,d:"D4",s:"Prompt Engineering",t:"S",f:"M",
q:"Which instruction is most likely to be followed reliably?",
o:["A. \"Don't be too long.\"","B. \"Respond in 3 to 5 bullet points, each under 20 words.\"","C. \"Be concise but thorough.\"","D. \"Avoid unnecessary detail.\""],a:1,
e:"**Measurable beats subjective.** \"3 to 5 bullets, each under 20 words\" is unambiguous, verifiable, and therefore **testable in an eval**. \"Concise but thorough\" asks the model to resolve a tension you have not defined, and \"not too long\" gives no reference point. The same principle applies to your eval suite: an instruction you cannot check automatically is one you cannot defend against regression.",
w:"A/C/D — all subjective, and C additionally poses a contradiction the model must silently resolve, producing inconsistency across calls."},

{id:268,d:"D4",s:"Context Engineering",t:"S",f:"H",
q:"A support agent needs both static policy documentation and live account data. How should these be handled differently in the prompt?",
o:["A. Both in the system prompt","B. Static policy inside the cached prefix; live account data fetched per request via a tool and placed outside the breakpoint","C. Both fetched fresh on every request","D. Both cached for 1 hour"],a:1,
e:"Split by **volatility**. Static policy is stable and reused across users, so it belongs **inside the cached prefix** — write once, read cheaply many times. Live account data is per-user and time-sensitive, so it must be **fetched per request and placed outside the breakpoint**, preserving freshness. Caching account data would serve stale balances and, worse, risks **leaking one user's data into another's cached prefix**.",
w:"A — putting volatile per-user data in the system prompt destroys cache stability and confuses the durable/transient split. C — re-fetching stable policy wastes the caching opportunity entirely. D — caching live account data serves stale and potentially cross-user data."},

{id:269,d:"D4",s:"Output Handling",t:"S",f:"M",
q:"A pipeline logs only the parsed output, not the raw response. What debugging capability is lost?",
o:["A. None — parsed output is sufficient","B. The ability to diagnose parse failures and truncation, since the raw text and `stop_reason` are exactly what reveal why parsing failed","C. Token usage tracking","D. Latency measurement"],a:1,
e:"When parsing fails there is **nothing to inspect**, and the failure modes are indistinguishable without the raw evidence: `stop_reason: \"max_tokens\"` means truncation, a markdown fence means a formatting problem, and valid-but-different structure means schema drift. Each has a different remedy. Log the **raw text plus `stop_reason` and `request-id`** on failures at minimum — sampling successes too is useful for spotting quality drift.",
w:"A — precisely the assumption that leaves you blind at the moment of failure. C/D — usage and latency come from other fields and are unaffected."},

{id:270,d:"D4",s:"Prompt Engineering",t:"S",f:"H",
q:"A prompt yields excellent results for the engineer who wrote it and mediocre results in production. What is the most likely explanation?",
o:["A. Production uses a different model tier without anyone noticing","B. The prompt was tuned against the narrow inputs the author had in mind, and real traffic is more varied — ambiguous, malformed and edge-case inputs it was never tested against","C. Production has higher latency","D. The system prompt is cached in production"],a:1,
e:"This is **overfitting to the author's mental model**. Development inputs are clean, well-formed, and unconsciously selected to fit the prompt; real traffic includes ambiguity, missing context, unexpected formats and adversarial input. The remedy is to **build the eval set from real production traffic** — including the messy tail — rather than hand-written examples. Worth checking option A as a configuration hypothesis too, but the distribution gap is the far more common cause.",
w:"A — possible and worth ruling out, but less common than the distribution mismatch. C — latency does not affect output quality. D — caching changes cost, never content."}
);
</script>
<script>
/* ===== D1 · Applications & Integration — batch 3 ===== */
QB.push(
{id:271,d:"D1",s:"Claude API Mechanics",t:"S",f:"M",
q:"A developer wants Claude to stop generating as soon as it writes `---END---`. Which parameter, and what will `stop_reason` be?",
o:["A. `stop_sequences: [\"---END---\"]`, and `stop_reason` will be `stop_sequence`","B. `stop_sequences: [\"---END---\"]`, and `stop_reason` will be `end_turn`","C. `max_tokens`, and `stop_reason` will be `max_tokens`","D. `truncate_at`, and `stop_reason` will be `truncated`"],a:0,
e:"**`stop_sequences`** takes an array of strings; generation halts the moment any is produced and the response reports **`stop_reason: \"stop_sequence\"`**, with the matched string in the **`stop_sequence`** field. Two practical notes: the stop sequence itself is **not included** in the returned text, and this is the clean way to bound output at a structural delimiter without over-generating.",
w:"B — `end_turn` means natural completion; a triggered stop sequence reports `stop_sequence`. C — `max_tokens` bounds length, not content. D — no such parameter or stop reason."},

{id:272,d:"D1",s:"Error Handling & Retries",t:"S",f:"H",
q:"A high-throughput service must stay within rate limits rather than discovering them by hitting 429s. What is the best approach?",
o:["A. Retry aggressively whenever a 429 occurs","B. Client-side throttling informed by the `anthropic-ratelimit-*` headers, with a request queue and concurrency ceiling tuned below the reported limits","C. Spread requests across several API keys","D. Reduce `max_tokens` on every request"],a:1,
e:"**Throttle proactively rather than reactively.** The `anthropic-ratelimit-*` headers report your limit, remaining capacity and reset time per dimension, so a queue with a concurrency ceiling tuned just below those figures keeps you inside the envelope. Retain backoff as a **safety net**, not the primary mechanism — reactive retrying means you always operate at the edge, absorbing latency spikes and failed calls as a matter of routine.",
w:"A — reactive by definition; you take the failures first. C — splitting across keys to evade limits is a policy problem, and organisation limits typically still apply. D — a common misconception: `max_tokens` **does not factor into output-token rate-limit calculations at all** (only tokens actually generated count), so lowering it relieves no rate-limit dimension."},

{id:273,d:"D1",s:"Streaming",t:"S",f:"M",
q:"A streaming UI must show a typing indicator only while the model is genuinely producing text. Which events should drive it?",
o:["A. Start on the HTTP response, stop on connection close","B. Start on `content_block_start` for a text block, stop on `content_block_stop`, ignoring `ping` events","C. Toggle it on every `ping`","D. Start on `message_start`, stop on `message_delta`"],a:1,
e:"Drive UI state from **content-block lifecycle events**: `content_block_start` for a text block means visible output is beginning, and `content_block_stop` means that block is complete. Crucially, **ignore `ping`** — it is a keep-alive with no semantic content, and treating it as activity produces a flickering indicator. Note also that with thinking enabled the first block may be a `thinking` block, which you may want to represent differently rather than as ordinary typing.",
w:"A — too coarse; the connection opens before generation and may linger after. C — pings are connection keep-alives, unrelated to generation activity. D — `message_start` precedes any content and `message_delta` carries terminal metadata, so both are the wrong boundaries."},

{id:274,d:"D1",s:"Vision & Multimodal",t:"S",f:"H",
q:"A pipeline must extract line items from invoice PDFs. What is the key architectural consideration?",
o:["A. Convert every page to a maximum-resolution image","B. Decide between native document handling and page-to-image conversion, size images to the model's resolution limit, and use structured outputs with a per-line-item schema","C. Send the raw PDF bytes as base64 text","D. Ask for a prose description of each invoice"],a:1,
e:"Three decisions matter. First, **how the document reaches the model** — native document support where available, otherwise page-to-image conversion. Second, **resolution**: cost scales with pixel area, and beyond the model's native limit images are downscaled anyway, so oversizing pays for discarded pixels. Third, **output shape**: line items are repeating structured records, so a **structured-output schema** with a typed array is far more reliable than parsing prose — and include an explicit low-confidence path for illegible scans.",
w:"A — beyond the resolution limit you pay for pixels that are discarded. C — base64 pasted as text is not interpreted as a document and wastes enormous token budget. D — prose defeats the purpose of an extraction pipeline."},

{id:275,d:"D1",s:"Software Engineering Foundations",t:"S",f:"M",
q:"Which practice most improves the debuggability of a Claude integration in production?",
o:["A. Logging only errors","B. Logging the `request-id`, model, `stop_reason` and `usage` on every response, with raw output captured on failures","C. Increasing log verbosity for all services","D. Logging the full prompt for every request"],a:1,
e:"Capture a **compact, high-value record on every call**: the **`request-id`** (the identifier Anthropic support needs, obtainable only at the time), the **model** used, **`stop_reason`** as an early truncation and refusal signal, and **`usage`** for cost attribution. Then capture **raw output on failures**, where the diagnostic value is highest. Note the balance: logging every full prompt is expensive at volume and a PII hazard, so sample it and **redact** before writing.",
w:"A — you cannot obtain the `request-id` for a call you did not log, and error-only logs give no baseline. C — indiscriminate verbosity buries the signal and inflates cost. D — expensive and a privacy risk without redaction and sampling."},

{id:276,d:"D1",s:"Configuration Management",t:"S",f:"H",
q:"A team wants to A/B test two system prompts in production. What must the implementation support?",
o:["A. Deploying two separate services","B. Deterministic per-user assignment to a variant, variant identity recorded on every request, and metrics segmented by variant","C. Randomly choosing a variant per request","D. Manually switching between prompts daily"],a:1,
e:"A valid experiment needs three properties. **Deterministic assignment** — a stable hash of the user id — so a given user sees consistent behaviour rather than a variant that changes mid-conversation. **Variant recorded on every request**, so outcomes can be attributed. And **metrics segmented by variant**, covering quality, cost, latency and `stop_reason` distribution. Without stable assignment you measure noise; without recording you cannot attribute results at all.",
w:"A — heavy infrastructure for what is a configuration concern. C — per-request randomisation gives users inconsistent behaviour within one conversation and confounds the measurement. D — day-to-day traffic differences confound the comparison entirely."},

{id:277,d:"D1",s:"Batch API",t:"S",f:"M",
q:"A batch job's results file shows some entries with status `expired`. What does that mean and what should happen?",
o:["A. The results were deleted before download; re-run the entire batch","B. Those requests were not completed within the processing window; identify them by `custom_id` and resubmit just that subset","C. The API key expired mid-batch","D. The model version was retired"],a:1,
e:"**`expired`** means those particular requests were not completed within the batch processing window. Handle it at the **per-request level**: join results back to inputs by **`custom_id`**, isolate the expired subset, and resubmit only those. This is why treating batch completion as blanket success silently drops records — each entry carries its own outcome (`succeeded`, `errored`, `canceled`, `expired`) and must be inspected individually.",
w:"A — misreads the status, and re-running everything wastes the successful majority. C — keys do not expire mid-batch. D — model retirement would surface as a request error, not expiry."},

{id:278,d:"D1",s:"Claude Application Design",t:"S",f:"H",
q:"A feature must work when the Claude API is unavailable. What design element is required?",
o:["A. Retrying until it succeeds","B. A defined degraded mode — cached or template responses, a queue for later processing, or an explicit unavailable state — chosen by what the feature actually needs","C. Running a local model as a fallback","D. Nothing; the API is highly available"],a:1,
e:"Treat the API as a **dependency that will occasionally be unavailable** and decide the degraded behaviour deliberately. Options differ by feature: **queue for later** where the work is deferrable, serve a **cached or template response** where an approximate answer helps, or show an **explicit unavailable state** where a wrong answer would be worse than none. The anti-pattern is an undefined failure mode — a spinner that never resolves, or a silent empty result.",
w:"A — retries help transient blips but not a sustained outage, and unbounded retries hang the user. C — a legitimate architecture for some cases but heavy, and not the general requirement. D — designing for perfect availability is how outages become incidents."},

{id:279,d:"D1",s:"Understanding Requirements",t:"S",f:"M",
q:"A requirement says the assistant must \"respond instantly.\" What is the right engineering response?",
o:["A. Use the fastest model and hope it suffices","B. Convert it into a measurable target — a p95 latency budget — then design to it with tier selection, prompt size limits and streaming","C. Explain that instant responses are impossible","D. Cache all responses"],a:1,
e:"\"Instantly\" is a **feeling, not a specification**, so turn it into a number — typically a **p95 or p99 latency budget**, since averages hide the tail users actually notice. Then design against it: choose a **fast tier**, keep prompts and `max_tokens` tight, and use **streaming** so first tokens appear quickly where partial output is useful. If the required work genuinely cannot fit the budget, that is a case for an **asynchronous** interaction model, surfaced early rather than discovered late.",
w:"A — an untested guess with no acceptance criterion. C — technically true but unhelpful; the job is to translate the intent. D — helps only for repeated identical requests."},

{id:280,d:"D1",s:"Systems Life Cycle",t:"S",f:"H",
q:"After a model version upgrade, output is subtly different in tone though accuracy is unchanged. Users complain. What does this reveal about the upgrade process?",
o:["A. The new model is defective and should be rolled back permanently","B. Evals measured accuracy but not the stylistic properties users actually valued — eval criteria must cover the qualities that define acceptable output, not just correctness","C. Model upgrades should never be performed","D. Users are resistant to change"],a:1,
e:"The eval suite measured **what was easy to measure** rather than what mattered to users. If tone, formatting, structure or verbosity are part of the product's value, they belong in the **eval criteria** — via rubric scoring, structural assertions, or human review on a sample. Then re-run against both versions and compare. The broader lesson: an upgrade is safe only insofar as your evals capture the properties you would be upset to lose.",
w:"A — rollback is a reasonable immediate step, but permanently refusing upgrades is not a strategy. C — pinning forever accumulates its own risk as models are retired. D — dismisses a legitimate signal that the eval suite was incomplete."},

{id:281,d:"D1",s:"Claude API Mechanics",t:"S",f:"M",
q:"A request includes `max_tokens: 100000` on a model whose output ceiling is lower. What happens?",
o:["A. The request succeeds and the model may generate 100,000 output tokens","B. The request is rejected with a `400 invalid_request_error`, since `max_tokens` cannot exceed the model's output limit","C. `max_tokens` is silently clamped to the model limit","D. The request is queued until capacity allows"],a:1,
e:"**`max_tokens` must not exceed the model's documented output ceiling**, and exceeding it produces a **400 `invalid_request_error`** at validation, before any generation occurs. Output limits differ by model, so a value that is valid on one can be invalid on another — a common failure when switching models. Note this is distinct from the *context window*, which bounds input plus output together.",
w:"A — the ceiling is a hard model property, not a suggestion. C — no silent clamping; the request is rejected outright. D — no queueing behaviour exists on the synchronous API."},

{id:282,d:"D1",s:"Deployment Platforms",t:"S",f:"M",
q:"An organisation needs Claude usage to appear in existing cloud spend commitments and stay inside its VPC and IAM boundary. What does this point to?",
o:["A. The first-party Anthropic API with an enterprise agreement","B. Deploying via a cloud platform such as Amazon Bedrock, Google Cloud or Microsoft Foundry, where billing, IAM and network controls follow the cloud provider's model","C. Running Claude on-premises","D. Using the Batch API"],a:1,
e:"Cloud-platform deployment exists for exactly these **governance requirements**: usage bills through the existing cloud account and can count toward committed spend, access is governed by the provider's **IAM**, traffic stays within your **network and region** boundaries, and calls appear in the provider's audit logging. Expect platform-specific **authentication, model identifiers and region configuration**, and verify **feature availability**, since partner platforms can lag on newer capabilities.",
w:"A — an enterprise agreement addresses commercial terms, not IAM or VPC integration. C — Claude models are not distributed for on-premises self-hosting. D — the Batch API is a cost/latency trade with no bearing on governance boundaries."},

{id:283,d:"D1",s:"Error Handling & Retries",t:"S",f:"H",
q:"A service retries on 429 with exponential backoff but ignores the `retry-after` header. What is the consequence?",
o:["A. None — backoff is sufficient on its own","B. It may retry sooner than the server has indicated, prolonging throttling; honouring `retry-after` when present is more accurate than a guessed delay","C. The request will be rejected as malformed","D. The account will be suspended"],a:1,
e:"**`retry-after` is authoritative** — the server is telling you when capacity will actually be available, which is strictly better information than your client-side guess. Ignoring it risks retrying into a still-exhausted window, extending the throttled period and wasting quota. The robust pattern is to **honour `retry-after` when present** and fall back to exponential backoff with jitter when it is not.",
w:"A — a guessed delay is less accurate than the server's own figure. C — ignoring a response header does not invalidate the request. D — suspension is not the consequence of suboptimal retry timing."},

{id:284,d:"D1",s:"Claude Application Design",t:"S",f:"M",
q:"A conversational product must let users edit an earlier message and regenerate from that point. What does this require of state management?",
o:["A. Anthropic's servers can rewind the conversation","B. Your application must store the message history as an editable structure, truncate it at the edit point, and resend the revised history","C. A special `regenerate` API parameter","D. Prompt caching to restore the earlier state"],a:1,
e:"Because the API is **stateless**, conversation editing is entirely a **client-side state operation**: hold the history as an ordered, mutable structure, **truncate at the edit point**, apply the change, and resend the revised array as a fresh request. There is nothing to rewind server-side. Worth noting the caching interaction — editing an earlier turn **invalidates the cached prefix from that point on**, so a regenerated branch pays cache-write cost again.",
w:"A — no server-side conversation state exists. C — no such parameter; regeneration is just a new request with a modified history. D — caching is a cost optimisation and cannot restore or store state."},

{id:285,d:"D1",s:"Streaming",t:"S",f:"H",
q:"A streaming client needs to detect that the model wants to call a tool, as early as possible. What should it watch for?",
o:["A. The `message_stop` event","B. A `content_block_start` whose block type is `tool_use`, then accumulate `input_json_delta` fragments until `content_block_stop`","C. The first `text_delta` mentioning a tool name","D. The `ping` event"],a:1,
e:"A **`content_block_start`** carrying a `tool_use` block is the earliest structural signal, giving you the tool `name` and `id` immediately — useful for showing \"looking that up…\" in the UI. The arguments then arrive as **`input_json_delta`** fragments whose `partial_json` must be **concatenated and only parsed once complete**; individual fragments are almost never valid JSON on their own. The final `stop_reason: \"tool_use\"` arrives later in `message_delta`.",
w:"A — far too late; the stream has finished by then. C — prose mentioning a tool is not a tool call, and parsing intent from narration is unreliable. D — a connection keep-alive with no content."},

{id:286,d:"D1",s:"Software Engineering Foundations",t:"S",f:"M",
q:"Why should the Claude API client be wrapped behind an internal interface rather than called directly throughout a codebase?",
